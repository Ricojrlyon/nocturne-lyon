<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable · *nocturne</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-16 -16 32 32'><g fill='%23d4a574'><rect x='-2' y='-13' width='4' height='26' rx='2'/><rect x='-2' y='-13' width='4' height='26' rx='2' transform='rotate(60)'/><rect x='-2' y='-13' width='4' height='26' rx='2' transform='rotate(120)'/></g></svg>">
<!-- GitHub Pages sert cette page pour toute adresse introuvable du site,
     même profonde (/nocturne-lyon/a/b/c) : le lien et les polices sont
     donc en adresses complètes, une adresse relative partirait du mauvais
     dossier. -->
<link href="/nocturne-lyon/fonts/polices.css" rel="stylesheet">
<style>
  :root {
    --bg: #161f25;
    --ink: #e7dfbe;
    --ink-mute: #5e6973;
    --warm: #d4a574;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter Tight', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 20px;
  }
  .code {
    margin: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  h1 {
    margin: 10px 0 28px;
    font-size: clamp(30px, 6vw, 48px);
    font-weight: 700;
    line-height: 1.1;
  }
  a {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--bg);
    background: var(--ink);
    text-decoration: none;
    padding: 10px 18px;
    border-radius: var(--radius);
  }
  a:hover { background: #fff6d6; }
  a:focus-visible { outline: 2px solid var(--warm); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">erreur 404</p>
  <h1>page introuvable</h1>
  <a href="/nocturne-lyon/">→ retour à la page d'accueil</a>
</main>
</body>
</html>
