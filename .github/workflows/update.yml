name: Update events daily

on:
  schedule:
    # Trois passages par jour (audit A-25, novembre 2026) : le PREMIER
    # arrivé travaille, les suivants s'arrêtent si le programme du jour
    # est déjà publié (job « creneau », passage.py). GitHub compte en UTC :
    # 00:17 UTC, c'est 2 h 17 à Paris l'été et 1 h 17 l'hiver ; 01:17 UTC,
    # 3 h 17 ou 2 h 17. Le troisième, 09:17 UTC (11 h 17 ou 10 h 17 à
    # Paris), rattrape un jour où GitHub aurait abandonné les deux passages
    # de la nuit, ou un passage tombé au rouge.
    # GitHub retarde ses passages programmés de plusieurs heures (5 à 7 en
    # octobre 2026, à 04:17 UTC) : partir la nuit vise un site à jour au
    # réveil. La minute 17 évite l'heure pile, la plus demandée - minuit
    # UTC surtout.
    - cron: '17 0 * * *'
    - cron: '17 1 * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      # OPT-1 : la case d'un lancement à la main (« Run workflow »). Cochée,
      # le passage publie ce qu'il a collecté, tel quel : il ne reprend pas
      # la veille d'une salle tombée et ne bloque pas une baisse de volume
      # (NOCTURNE_FORCER_ECRITURE, voir aggregate.py). Pour une perte RÉELLE
      # seulement - salle fermée, saison finie : une salle en panne
      # passagère ce jour-là ne serait pas reprise non plus.
      forcer:
        description: "Forcer la publication - perte réelle seulement (salle fermée, saison finie)"
        type: boolean
        default: false

# Lire, sans plus (audit A-42) : seul le job « update » reçoit le droit
# d'écrire, plus bas. Le job « creneau » n'a pas à pouvoir modifier le dépôt.
permissions:
  contents: read

# Un passage à la fois. Lancé à la main pendant le passage programmé, ou
# l'inverse, le second attend la fin du premier au lieu de tourner en même
# temps : sinon il repartait du fil d'AVANT, et sa publication butait sur
# celle du premier (« git pull --rebase » en conflit sur events.json,
# passage rouge). GitHub ne garde qu'UN passage en attente : un troisième
# lancement remplace celui qui attend - annulé, en gris - et fait le même
# travail, un peu plus tard.
concurrency:
  group: maj-du-fil
  cancel-in-progress: false

jobs:
  # Le créneau du jour (passage.py, audit A-25). Le premier passage
  # programmé arrivé travaille ; les suivants s'arrêtent en quelques
  # secondes si le programme publié est déjà du jour, à Paris. Un passage
  # abandonné par GitHub, ou tombé au rouge, est rattrapé par le suivant.
  # Un lancement à la main passe toujours. Le fil lu est celui de la
  # branche au départ de ce job : un passage qui a attendu la fin d'un
  # autre (voir concurrency) voit le programme que celui-ci a publié.
  creneau:
    # Le système écrit en clair (audit A-42) : « ubuntu-latest » est passé
    # de la 24.04 à la 26.04 le 4 novembre 2026 sans prévenir. Changer de
    # système est un geste voulu : changer le numéro ici et dans le job
    # suivant (et dans tests.yml), puis regarder un passage.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      lancer: ${{ steps.creneau.outputs.lancer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # Le Python du système suffit : passage.py n'emploie que la
      # bibliothèque standard.
      - id: creneau
        env:
          EVENEMENT: ${{ github.event_name }}
        run: python3 passage.py creneau

  update:
    needs: creneau
    if: needs.creneau.outputs.lancer == 'oui'
    runs-on: ubuntu-26.04
    # Sans limite, GitHub laisse un passage bloqué tourner six heures. Le
    # plus long des 214 passages connus a duré 12 minutes : une heure
    # absorbe les nouveaux essais réseau et un cache de pages à refaire, et
    # arrête un passage bloqué cinq heures plus tôt.
    timeout-minutes: 60
    # Écrire le fil (contents) et tenir les issues des salles en panne
    # (issues, voir la dernière étape).
    permissions:
      contents: write
      issues: write
    steps:
      # v7, et non plus v4 et v5 : ces versions visaient Node.js 20, que
      # GitHub abandonne et ne faisait plus tourner que de force, avec un
      # avertissement à chaque passage.
      # Chaque brique est désignée par l'EMPREINTE de son code, sa version
      # en commentaire (audit n° 16) : une étiquette comme « v7 » peut être
      # déplacée vers un autre code, une empreinte non. Pour passer à une
      # version plus récente, relever son empreinte - par exemple
      # git ls-remote --tags https://github.com/actions/checkout - et la
      # recopier ici, version comprise.
      # La branche telle qu'elle est au DÉPART du passage, et non telle
      # qu'elle était quand il a été demandé : un passage qui a attendu la
      # fin d'un autre (voir concurrency) repart du fil que celui-ci vient
      # de publier.
      # Sans ranger le jeton dans le dépôt (audit A-42) : les tests, la
      # collecte et les paquets installés pouvaient le lire. Il n'arrive
      # qu'à l'étape de publication.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # Chaque paquet à sa version et à son empreinte (requirements.txt,
      # audit A-42) : un paquet différent de celui qui a été éprouvé, même
      # sous le même numéro, est refusé.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      # Les tests de la logique, AVANT de collecter (voir tests/__init__.py).
      # Un échec arrête le passage : rien n'est publié, et le site garde sa
      # version de la veille plutôt que d'en publier une cassée.
      - name: Tests de la logique
        run: python -m unittest discover -s tests -t . -v

      - name: Run aggregator
        id: collecte
        run: python aggregate.py
        env:
          # « 1 » quand la case « Forcer la publication » est cochée, vide
          # sinon - et toujours vide pour le passage programmé.
          NOCTURNE_FORCER_ECRITURE: ${{ inputs.forcer && '1' || '' }}
          # L'état des sources du passage, pour l'alerte des salles en
          # panne : hors du dépôt, jamais publié.
          NOCTURNE_ETAT: ${{ runner.temp }}/etat_des_sources.json

      # Le fil frais, contrôlé avant de partir : sa forme, et la page qui
      # s'affiche avec. Même règle : un échec, et rien n'est publié.
      - name: Contrôle du fil avant publication
        run: python -m unittest tests.verif_fil tests.verif_page -v

      - name: Commit updated events.json
        env:
          # Le droit d'écrire, pour cette étape seule (voir le checkout).
          JETON: ${{ github.token }}
        run: |
          git config user.name "lyon-events-bot"
          git config user.email "actions@github.com"
          git add events.json venue_arrondissements.json detail_times.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update events ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Un commit poussé entre le checkout et l'envoi (une retouche
            # du code, un fichier téléversé à la main) faisait échouer
            # l'envoi. Trois essais, et la version du robot l'emporte sur
            # ses trois fichiers (passage.py, audit A-27). Deux passages,
            # eux, ne se croisent plus : voir concurrency.
            python passage.py publier
          fi

      # L'alerte des salles en panne (audit A-02). Un passage vert n'envoie
      # aucun e-mail : l'IAC, injoignable du 23 octobre au 9 novembre 2026,
      # a quitté le site au 7e jour sans que personne le sache. alertes.py
      # tient une issue GitHub par salle en panne depuis plus d'une nuit
      # (l'issue envoie l'e-mail), et la ferme quand la salle revient. Même
      # si le contrôle du fil a échoué, dès que la collecte a tourné ; elle
      # ne fait jamais échouer le passage.
      - name: Alerte des salles en panne
        if: always() && steps.collecte.outcome != 'skipped'
        run: python alertes.py
        env:
          NOCTURNE_ETAT: ${{ runner.temp }}/etat_des_sources.json
          GITHUB_TOKEN: ${{ github.token }}
