name: Update events daily

on:
  schedule:
    # 04:17 UTC : 6 h 17 à Paris l'été, 5 h 17 l'hiver (GitHub compte en
    # UTC). Programmé à l'heure pile (« 0 6 », 8 h à Paris), le passage
    # partait chaque jour 4 à 6 heures en retard : sur 154 passages de mai
    # à octobre 2026, entre 09:43 et 12:29 UTC. GitHub retarde les tâches
    # programmées en début d'heure, les plus demandées ; une minute creuse,
    # plus tôt, doit réduire ce retard, sans garantie (CI-2, 2 octobre 2026).
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Sans limite, GitHub laisse un passage bloqué tourner six heures. Le
    # plus long des 214 passages connus a duré 12 minutes : une heure
    # absorbe les attentes du Complexe, les nouveaux essais réseau et un
    # cache de pages à refaire, et arrête un passage bloqué cinq heures
    # plus tôt.
    timeout-minutes: 60
    steps:
      # v7, et non plus v4 et v5 : ces versions visaient Node.js 20, que
      # GitHub abandonne et ne faisait plus tourner que de force, avec un
      # avertissement à chaque passage.
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Les tests de la logique, AVANT de collecter (voir tests/__init__.py).
      # Un échec arrête le passage : rien n'est publié, et le site garde sa
      # version de la veille plutôt que d'en publier une cassée.
      - name: Tests de la logique
        run: python -m unittest discover -s tests -t . -v

      - name: Run aggregator
        run: python aggregate.py

      # Le fil frais, contrôlé avant de partir : sa forme, et la page qui
      # s'affiche avec. Même règle : un échec, et rien n'est publié.
      - name: Contrôle du fil avant publication
        run: python -m unittest tests.verif_fil tests.verif_page -v

      - name: Commit updated events.json
        run: |
          git config user.name "lyon-events-bot"
          git config user.email "actions@github.com"
          git add events.json venue_arrondissements.json detail_times.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update events ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Un commit poussé entre le checkout et le push (run manuel
            # croisant le cron, édition directe) ferait échouer le push.
            git pull --rebase
            git push
          fi
