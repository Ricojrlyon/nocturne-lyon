  spectacle: '#e08a5c', expo:       '#9fbd7f', cine:      '#8fa0b8',
  conference:'#37b7c8', atelier:    '#c49a72', jeux:      '#7fb8a8',
  sport:     '#a99829', autre:      '#9aa3ad',
};
function teinteDe(rawCategory) {
  return TEINTES[bucketOf(rawCategory)] || TEINTES.autre;
}
/* Même garde-fou que pour les familles : un bucket ajouté sans teinte
   retomberait sur le gris d'« autre » sans que rien ne le signale. */
{
  const sansTeinte = ALL_BUCKETS.map(b => b.key).filter(k => !TEINTES[k]);
  if (sansTeinte.length) {
    console.warn('[teintes] buckets sans teinte, repliés sur « autre » :',
                 sansTeinte.join(', '));
  }
}

/* Quatre familles au-dessus des buckets. Les buckets restent la maille
   fine — ils portent la catégorie affichée sur la carte — mais dix-huit
   sections dans une journée seraient illisibles : sur les jours chargés,
   quatre familles donnent 2,8 sections dont 0,5 seulement en dessous de
   trois cartes, là où cinq familles ajoutaient une section maigre par
   jour sans étoffer les autres. */
const FAMILLES = [
  { key: 'musique', label: 'musique',
    buckets: ['club', 'jazz', 'rock', 'rap', 'chanson', 'reggae',
              'classique', 'monde', 'musique'] },
  { key: 'scene',   label: 'scène',
    buckets: ['humour', 'theatre', 'danse', 'spectacle'] },
  { key: 'expos',   label: 'expos',   buckets: ['expo'] },
  // Le sport a sa famille. Il y a bien une cinquième section, et elle est
  // maigre — mesuré sur le fil du 2026-09-19 : 15 journées la portent, et
  // TOUJOURS avec une seule carte. Mais elle ne coûte presque rien à
  // l'ensemble : 548 sections deviennent 558, et la part des sections de
  // moins de trois cartes passe de 46 % à 47 %. Le fil en compte déjà
  // beaucoup, une de plus ne change pas sa nature.
  // C'est un arbitrage différent de celui qui avait fait annuler le
  // passage à cinq familles : là, la cinquième famille prenait des cartes
  // aux quatre autres et les affamait toutes. Ici elle apporte les
  // siennes, que rien d'autre ne revendique.
  { key: 'sport',   label: 'sport',   buckets: ['sport'] },
  { key: 'autres',  label: 'autres',
    buckets: ['cine', 'conference', 'atelier', 'jeux', 'autre'] },
];
const FAMILLE_DE_BUCKET = new Map();
for (const f of FAMILLES) for (const b of f.buckets) FAMILLE_DE_BUCKET.set(b, f.key);

/* Garde-fou : un bucket ajouté à TYPE_BUCKETS sans être rangé dans une
   famille tomberait silencieusement dans « autres ». Le repli est voulu
   — jamais d'événement perdu — mais il doit se voir. */
{
  const orphelins = ALL_BUCKETS.map(b => b.key).filter(k => !FAMILLE_DE_BUCKET.has(k));
  if (orphelins.length) {
    console.warn('[familles] buckets sans famille, versés dans « autres » :',
                 orphelins.join(', '));
  }
}

function familleOf(category) {
  return FAMILLE_DE_BUCKET.get(bucketOf(category)) || 'autres';
}

/* Famille d'une CARTE. Une grappe (lieu, jour) est une carte unique et
   prend la catégorie majoritaire de ses événements — la même que celle
   qu'elle affiche en pied, pour que le compte annoncé et l'étiquette
   lue racontent la même chose. */
function familleDeCarte(evs) {
  return familleOf(evs.length >= 2 ? majorityCategory(evs) : evs[0].category);
}

/* Comptes par famille pour une journée, en CARTES et non en événements :
   le regroupement par lieu est refait à l'identique de l'affichage. */
function comptesParFamille(list) {
  const n = new Map(FAMILLES.map(f => [f.key, 0]));
  // Groupé par (jour, lieu) et non par lieu seul : appelé sur une seule
  // journée les deux reviennent au même, mais l'état vide s'en sert sur
  // toute la période, où un même lieu deux soirs de suite fait bien deux
  // cartes.
  const parJour = new Map();
  for (const e of list) {
    const cle = e._date + '|' + (e.venue || '');
    if (!parJour.has(cle)) parJour.set(cle, []);
    parJour.get(cle).push(e);
  }
  for (const evs of parJour.values()) {
    const k = familleDeCarte(evs);
    n.set(k, (n.get(k) || 0) + 1);
  }
  return n;
}

/* Retire les événements dont la CARTE appartient à une famille éteinte.
   Le tri est préservé : on filtre la liste déjà triée plutôt que de la
   reconstruire depuis les grappes. */
function filtrerParFamille(list) {
  if (!state.famillesOff.size) return list;
  const garde = new Set();
  for (const [venue, evs] of groupByVenue(list)) {
    if (!state.famillesOff.has(familleDeCarte(evs))) garde.add(venue);
  }
  return list.filter(e => garde.has(e.venue || ''));
}

function famillesHtml(comptes) {
  const parts = FAMILLES.map(f => {
    const n = comptes.get(f.key) || 0;
    const eteinte = state.famillesOff.has(f.key);
    // Désactivée seulement quand il n'y a rien à masquer. Une famille
    // éteinte reste cliquable même à zéro, sans quoi on ne pourrait plus
    // la rallumer depuis une journée où elle est absente.
    const inerte = n === 0 && !eteinte;
    return '<button type="button" class="fam-chip" data-famille="' + f.key + '"'
         + ' aria-pressed="' + (!eteinte) + '"' + (inerte ? ' disabled' : '')
         + ' title="' + escapeHtml(f.label) + ' — ' + n + ' carte'
         + (n > 1 ? 's' : '') + (eteinte ? ', masquée' : '') + '">'
         + escapeHtml(f.label) + '<span class="fam-n">' + n + '</span></button>';
  });
  return '<div class="db-familles">' + parts.join('') + '</div>';
}

/* ---------- visuel de carte : l'enseigne du lieu ----------
   Quand aucune affiche n'est disponible, la carte porte le nom de son
   LIEU, composé en Bungee — la fonte d'affiche du site — répété en bandes
   qui se chevauchent jusqu'à couvrir la surface. Le fond dit donc quelque
   chose au lieu de décorer : une carte sans affiche montre sa salle. Elles
   sont 425 sur le fil, un peu moins d'une sur six.

   Il remplace trois motifs abstraits — ondes concentriques, rubans
   vrillés, éventails de hachures — dans trois couleurs fixes. Ces
   couleurs étaient les dernières de la carte à ne rien devoir à sa
   catégorie, et les plus étendues ; leur vocabulaire organique jurait
   avec une carte devenue géométrique et typographique. Le blanc à très
   basse opacité rend un gris parfaitement neutre sur le fond de carte,
   ce qui laisse toute la couleur aux dix-neuf teintes.

   Le tirage est déterministe (hash de lieu + titre) : une carte garde son
   apparence d'un rendu à l'autre — sinon le fond changerait à chaque
   frappe dans la recherche — et d'un jour à l'autre. Seul le hasard ENTRE
   événements est recherché.

   Rien n'est partagé entre les cartes : chaque fond est une quinzaine de
   <text> dans son propre <svg>, environ 1,4 Ko. Les trois motifs, eux,
   demandaient 271 Ko de <defs> communs au document, parce qu'une trame de
   3 000 cercles et des rubans de 2 500 points ne pouvaient pas être
   redessinés carte par carte. Le partage a donc disparu avec eux. */

/* Hash stable (djb2-ish) : même chaîne → même entier, à chaque rendu et
   à chaque chargement. Sert aux tirages sans Math.random(), qui ferait
   changer les fonds à chaque re-render. */
function stableHash(s) {
  let h = 5381;
  for (let i = 0; i < (s || '').length; i++) {
    h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  }
  return h;
}

/* Mélange final 32 bits. stableHash seul ne suffit pas d'amorce : ses bits
   bas restent corrélés sur des chaînes voisines, et deux titres qui ne
   diffèrent que par leur dernier caractère amorçaient des suites presque
   identiques — donc deux cartes voisines d'une même salle au fond
   superposable. */
function mix32(h) {
  h = (h ^ (h >>> 16)) >>> 0;
  h = Math.imul(h, 0x7feb352d) >>> 0;
  h = (h ^ (h >>> 15)) >>> 0;
  h = Math.imul(h, 0x846ca68b) >>> 0;
  h = (h ^ (h >>> 16)) >>> 0;
  return h;
}

/* Générateur reproductible : xorshift32 amorcé par le hash de la graine.
   Il faut une SUITE et non un tirage par clé comme avant : une bande
   demande son corps, son opacité et son décalage — trois valeurs
   indépendantes — là où les motifs ne tiraient qu'un rayon par
   coordonnée. */
function deSuite(seed) {
  let x = mix32(stableHash(seed)) || 1;
  return function () {
    x ^= x << 13; x >>>= 0;
    x ^= x >>> 17;
    x ^= x << 5;  x >>>= 0;
    return x / 4294967296;
  };
}

/* Le mot qui identifie le lieu. Beaucoup de salles lyonnaises commencent
   par un nom de genre — « Théâtre des Marronniers », « Chapelle de la
   Trinité », « Espace Albert Camus » — et garder le premier mot donnait
   trois cartes « THÉÂTRE » côte à côte dans la même journée. On jette
   donc le générique de tête et on garde le mot le plus long de ce qui
   reste, qui est presque toujours le nom propre.
   nomDePlaque(), qui sert au cartouche typographique des salles scrappées
   sans fichier de logo, coupe autrement : il garde le DÉBUT du nom pour
   qu'on lise « TNP » ou « Célestins ». Les deux règles diffèrent parce
   qu'elles ne montrent pas la même chose — une marque là, un mot ici. */
const ENSEIGNE_GENERIQUE = new Set([
  'theatre', 'théâtre', 'espace', 'chapelle', 'salle', 'musee', 'musée',
  'cinema', 'cinéma', 'bibliotheque', 'bibliothèque', 'maison', 'centre',
  'galerie', 'institut', 'parc', 'auditorium', 'opera', 'opéra',
  'les', 'des', 'the', 'bar', 'cafe', 'café',
  /* Adjectifs de genre, aussi peu distinctifs que les noms ci-dessus, et
     « lyon » avec eux : dans un agenda lyonnais, la ville ne distingue
     rien. Sans cette ligne, « Opéra national de Lyon » rendait NATIONAL. */
  'national', 'nationale', 'populaire', 'municipal', 'municipale',
  'nouveau', 'nouvelle', 'grand', 'grande', 'petit', 'petite', 'lyon',
]);
function nomDEnseigne(venue) {
  /* On coupe au séparateur, pas au trait d'union : le tiret ENTOURÉ
     D'ESPACES sépare deux appellations — « TNP - Théâtre National
     Populaire » — alors que le trait d'union collé appartient au nom
     propre. Les couper donnait BEAUX pour Beaux-Arts, PART pour
     Part-Dieu, CROIX pour Croix-Rousse. Même raison pour l'apostrophe,
     qu'on ne coupe plus : elle rendait AGEND pour Agend'arts. */
  const base = (venue || '').split(/,|\s[-–—]\s|\(/)[0];
  const mots = base.split(/\s+/).filter(m => m.length > 2);
  const utiles = mots.filter(m =>
    !ENSEIGNE_GENERIQUE.has(m.toLowerCase().replace(/\.$/, '')));
  /* Le mot le plus long de ce qui reste : c'est presque toujours le nom
     propre. Mais si le tri ne laisse RIEN, on prend le premier mot du nom
     plutôt que le plus long — quand une salle n'est qu'un générique et des
     adjectifs, c'est le générique qui la nomme. L'Opéra s'appelle OPÉRA,
     pas NATIONAL. */
  if (utiles.length) {
    return utiles.reduce((a, b) => (b.length > a.length ? b : a)).toUpperCase();
  }
  return (mots.length ? mots[0] : (venue || '')).toUpperCase();
}

/* Avance moyenne d'un caractère de Bungee, en em : MESURÉE au navigateur
   sur six noms de salle, de 0,667 à 0,723 selon le mot. 0,71 plus une
   gouttière du quart du corps garantit que deux répétitions d'une même
   bande ne se chevauchent jamais par accident. Le chevauchement doit être
   voulu, et il l'est entre BANDES — pas au sein d'une bande. */
const ENSEIGNE_AVANCE = 0.71;
const ENSEIGNE_W = 320, ENSEIGNE_H = 160;

function patternSVG(seed, venue) {
  const de = deSuite(seed + '|enseigne');
  const entre = (a, b) => a + (b - a) * de();
  const n = nomDEnseigne(venue);
  let t = '';
  let y = entre(14, 22);
  while (y < ENSEIGNE_H * 1.1) {
    const corps = entre(26, 46);
    /* Opacité décroissante vers le bas, que le masque de .visual-bg
       prolonge ensuite jusqu'à l'extinction : le texte de la carte tombe
       donc sur une zone où il ne reste presque rien. Mesuré au pixel sur
       le bloc rastérisé, le titre blanc tient 10,7 à 14,2:1 sur son pire
       pixel. Le plafond de 0,42 ne borne qu'un cumul improbable. */
    const op = Math.min(
      (0.036 + (1 - Math.min(y, ENSEIGNE_H) / ENSEIGNE_H) * entre(0.030, 0.055)) * 2,
      0.42);
    const pas = n.length * corps * ENSEIGNE_AVANCE + corps * 0.25;
    for (let x = -entre(0, pas); x < ENSEIGNE_W; x += pas) {
      /* Coordonnees ARRONDIES : le viewBox de 320 unites est mis a
         l'echelle de la carte, un dixieme d'unite vaut donc un huitieme de
         pixel et ne se voit pas. Trois decimales d'opacite non plus. Sur
         les 1056 enseignes, l'arrondi rend 340 Ko de DOM. */
      t += '<text x="' + Math.round(x) + '" y="' + Math.round(y)
         + '" font-size="' + Math.round(corps) + '" opacity="' + op.toFixed(2)
         + '">' + escapeHtml(n) + '</text>';
    }
    /* Pas vertical INFÉRIEUR à la hauteur de capitale, qui vaut 0,73 du
       corps : c'est ce recouvrement d'une bande sur l'autre qui fait la
       matière, et non le nombre d'occurrences. */
    y += corps * entre(0.58, 0.70);
  }
  return '<svg class="enseigne" viewBox="0 0 ' + ENSEIGNE_W + ' ' + ENSEIGNE_H
       + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'
       + '<g font-family="Bungee, system-ui" fill="#fff" letter-spacing="-1">'
       + t + '</g></svg>';
}

/* Nom composé sur le cartouche typographique. On coupe à la première
   virgule ou au premier tiret séparateur : « TNP - Théâtre National
   Populaire » se compose « TNP », « Célestins, théâtre de Lyon » se
   compose « Célestins ». Partout ailleurs le nom entier tient en deux
   ou trois lignes. */
function nomDePlaque(venue) {
  return (venue || '').split(/\s+[-–—]\s+|,/)[0].trim() || venue || '';
}

/* Corps du cartouche. Compter les caractères ne suffit pas : Bungee est
   une grasse d'affiche aux chasses très inégales, et c'est la CÉSURE qui
   décide du rendu — « Théâtre de la Croix-Rousse » et « Maison de la
   Danse » ont des longueurs voisines et se composent, l'un sur deux
   lignes étriquées, l'autre sur une ligne pleine.

   Simuler ce découpage au canvas ne marche pas non plus : text-wrap
   balance et l'interlettrage déplacent les coupures, et l'estimation se
   trompait de toute une ligne sur « Le Transbordeur ». On MESURE donc
   l'élément réel, dans une sonde hors écran qui porte exactement la même
   règle CSS. Seize noms distincts, dichotomie, résultat mémorisé : une
   poignée de reflows sur une boîte minuscule, une seule fois.

   Tant que Bungee n'est pas chargée la mesure porterait sur la fonte de
   repli : on s'en tient alors aux paliers, sans mémoriser, et la page se
   recompose quand la fonte est prête. */
const CARTE_L = Math.round(392 * 0.82);  /* la carte moins ses marges */
const CARTE_H = 96;          /* bande sûre entre les deux fondus du masque */
const CORPS_MIN = 15, CORPS_MAX = 52;
const _corps = new Map();
let _sonde = null;

function corpsParPaliers(nom) {
  const n = nom.length;
  if (n <= 5)  return 52;
  if (n <= 10) return 38;
  if (n <= 18) return 27;
  return 21;
}

function corpsDePlaque(nom) {
  if (_corps.has(nom)) return _corps.get(nom);
  if (!(document.fonts && document.fonts.check('16px Bungee'))) {
    return corpsParPaliers(nom);
  }
  if (!_sonde) {
    // La règle est « .visual-bg .logo-mot », un sélecteur DESCENDANT :
    // une sonde posée sur <body> n'en hériterait rien et mesurerait la
    // fonte par défaut. Elle vit donc dans un calque du même nom.
    const etui = document.createElement('div');
    etui.className = 'visual-bg';
    etui.setAttribute('aria-hidden', 'true');
    etui.style.cssText = 'position:fixed;left:-9999px;top:0;inset:auto;'
      + 'width:' + CARTE_L + 'px;height:' + CARTE_H + 'px;'
      + 'mask-image:none;-webkit-mask-image:none;visibility:hidden';
    _sonde = document.createElement('div');
    _sonde.className = 'logo-mot';
    etui.appendChild(_sonde);
    document.body.appendChild(etui);
    // La sonde reçoit la largeur utile SANS les marges, que la règle
    // exprime en pourcentage : les compter deux fois la rétrécirait.
    // Et elle passe en BLOC à hauteur libre : en flex centré, un texte
    // qui déborde ne fait pas grandir scrollHeight — il déborde de part
    // et d'autre — et toute mesure de hauteur y répondait « ça tient ».
    // La césure, elle, ne dépend pas du mode d'affichage.
    _sonde.style.cssText = 'position:static;inset:auto;'
      + 'display:block;padding:0;width:' + CARTE_L + 'px;height:auto';
  }
  _sonde.textContent = nom;
  const tient = px => {
    _sonde.style.setProperty('--fs', px + 'px');
    return _sonde.scrollWidth <= CARTE_L + 1
        && _sonde.offsetHeight <= CARTE_H;
  };
  let bas = CORPS_MIN, haut = CORPS_MAX;
  while (bas < haut) {
    const mid = Math.ceil((bas + haut) / 2);
    if (tient(mid)) bas = mid; else haut = mid - 1;
  }
  _corps.set(nom, bas);
  return bas;
}

function plaqueTypo(venue) {
  const nom = nomDePlaque(venue);
  return '<span class="logo-mot" style="--fs:' + corpsDePlaque(nom) + 'px">'
       + escapeHtml(nom) + '</span>';
}

/* Repli d'un logo de salle manquant : le fichier a disparu ou n'a jamais
   été fourni. On ne retombe PAS sur l'enseigne nue — c'est justement
   ce qu'on cherche à éviter sur les cartes groupées — mais sur le
   cartouche typographique, qui occupe la même plaque et hérite du même
   filtre. Le nom se relit sur la carte elle-même. */
/* Construit l'enseigne d'une couche visuelle qui n'en portait pas, et la
   glisse en PREMIÈRE position pour qu'elle passe sous tout le reste.
   Idempotent : deux échecs sur la même carte — l'affiche puis le logo —
   ne doivent pas empiler deux enseignes. */
function enseigneDeSecours(couche) {
  if (!couche || couche.querySelector('svg.enseigne')) return;
  couche.insertAdjacentHTML('afterbegin',
    patternSVG(couche.dataset.graine || '', couche.dataset.lieu || ''));
}

/* L'affiche n'a pas chargé — hotlink bloqué, 404, domaine mort. On masque
   la photo et on construit l'enseigne, qui n'avait pas été émise. */
function afficheIntrouvable(img) {
  const enveloppe = img.parentElement;
  if (enveloppe) enveloppe.style.display = 'none';
  enseigneDeSecours(img.closest('.visual-bg'));
}

function logoIntrouvable(img) {
  const plaque = img.closest('.logo-plate');
  const venue = img.closest('.event')
    ?.querySelector('.event-venue')?.textContent || '';
  if (plaque) {
    plaque.innerHTML = plaqueTypo(venue);
    return;
  }
  // Sans cartouche il ne reste rien à habiller : on rallume l'enseigne.
  const couche = img.closest('.visual-bg');
  if (couche) {
    couche.classList.remove('has-logo');
    enseigneDeSecours(couche);
  }
  img.remove();
}

/* Couche visuelle d'une carte : affiche si disponible, enseigne sinon.
   L'enseigne n'est PAS émise sous une affiche. C'est une rupture avec
   l'invariant d'avant — la couche de secours était toujours dans le DOM —
   et elle est justifiée par une mesure : à une vingtaine de <text> par
   carte, émettre l'enseigne partout pesait 4,94 Mo, soit 63 % du document
   et 63 000 nœuds sur 120 000, dont 2 123 enseignes sur 3 179 que rien ne
   laissait voir. Les anciens motifs pouvaient se le permettre : un <use>
   vers des <defs> partagés coûtait deux nœuds.
   La couche de secours reste GARANTIE, seulement différée : la graine et
   le lieu voyagent dans des attributs data, et enseigneDeSecours() la
   construit au moment où l'affiche ou le logo échoue. */
function visualLayerHtml(e, seedOverride) {
  // Graine des tirages : (lieu + titre) est stable d'un run à l'autre —
  // contrairement à e.id, qui dépend de l'heure et change si la dédup
  // l'enrichit depuis une autre source. Les occurrences d'un même
  // événement multi-jours partagent donc forme et couleur.
  // seedOverride sert aux cartes d'un groupe déplié : elles reçoivent la
  // graine de la CARTE GROUPÉE, donc l'enseigne du lieu. Sans ça le
  // dépliage défaisait visuellement le groupe qu'il venait d'ouvrir —
  // quatre cartes d'un même lieu affichaient trois trames et trois
  // teintes différentes.
  const seed = seedOverride || ((e.venue || '') + '|' + (e.title || ''));
  const affiche = e.image && /^https?:\/\//.test(e.image);
  let html = '<div class="visual-bg" data-graine="' + escapeHtml(seed)
           + '" data-lieu="' + escapeHtml(e.venue || '') + '">';
  html += affiche ? '' : patternSVG(seed, e.venue);
  if (affiche) {
    html += '<div class="photo-wrap">'
          + '<img src="' + escapeHtml(e.image) + '" alt="" loading="lazy" '
          + 'decoding="async" referrerpolicy="no-referrer" '
          + 'onerror="afficheIntrouvable(this)">'
          + '<div class="scrim"></div></div>';
  }
  html += '</div>';
  return html;
}

/* ---------- state ---------- */
const state = {
  when: 'all',
  customRange: null,
  arrondissements: new Set(),
  // Listes à cocher. VIDE = tout s'affiche ; dès qu'une case est cochée,
  // SEULES les cases cochées s'affichent. C'est l'inverse des familles,
  // qui partent toutes allumées et qu'on éteint — l'une sert à isoler,
  // l'autre à dégrossir.
  lieux: new Set(),
  tags: new Set(),
  // Familles ÉTEINTES. Vide = tout s'affiche. L'état est global et non
  // par journée : éteindre « autres » le 12 septembre le garde éteint le
  // 13, ce qui est ce qu'on attend d'un tri qu'on vient de faire.
  famillesOff: new Set(),
  search: '',          // free text search: venue name or event title
  events: [],
  occurrences: [],     // expandOccurrences(events), calculé une fois au load
  // Grappes (lieu, jour) dépliées, clés « AAAA-MM-JJ|Lieu ». Gardé en état
  // plutôt qu'en DOM : le feed est reconstruit à chaque filtre ou frappe,
  // une manipulation directe du DOM serait effacée. Les clés qui ne
  // correspondent plus à rien après un changement de filtre sont ignorées.
  expanded: new Set(),
};

/* Listes d'événements par journée, telles que triées au dernier rendu.
   Le dépliage ne reconstruit qu'une journée : il n'a donc ni à refiltrer
   ni à retrier, il lui suffit de relire la liste d'ici. */
const lastRenderDays = new Map();

function isoOf(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}
function parseIso(s) { return new Date(s + 'T00:00:00'); }

/* ---------- date picker ---------- */
let dpMonth = (() => { const d = new Date(); d.setDate(1); return d; })();
let dpRangeAnchor = null;

function renderDatepicker() {
  const dp = document.getElementById('datepicker');
  const ref = new Date(dpMonth);
  const year = ref.getFullYear();
  const month = ref.getMonth();
  const today = new Date(); today.setHours(0,0,0,0);

  const monthName = FR_MONTHS[month] + ' ' + year;
  const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const rangeStart = state.customRange ? parseIso(state.customRange.start) : null;
  const rangeEnd   = state.customRange ? parseIso(state.customRange.end)   : null;

  const cells = [];
  for (let i = firstWeekday; i > 0; i--) {
    const day = daysInPrevMonth - i + 1;
    const d = new Date(year, month - 1, day);
    cells.push({ d, muted: true, disabled: d < today });
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    cells.push({ d, muted: false, disabled: d < today });
  }
  while (cells.length % 7 !== 0) {
    const last = cells[cells.length - 1].d;
    const d = new Date(last); d.setDate(last.getDate() + 1);
    cells.push({ d, muted: true, disabled: false });
  }

  let html = '';
  html += '<div class="datepicker-head">';
  html += '  <button class="datepicker-nav" data-nav="prev" aria-label="mois précédent">‹</button>';
  html += '  <span>' + monthName + '</span>';
  html += '  <button class="datepicker-nav" data-nav="next" aria-label="mois suivant">›</button>';
  html += '</div>';
  html += '<div class="datepicker-grid">';
  for (const dow of ['lu','ma','me','je','ve','sa','di']) {
    html += '<div class="datepicker-dow">' + dow + '</div>';
  }
  for (const cell of cells) {
    const cls = ['datepicker-day'];
    if (cell.muted) cls.push('muted');
    if (cell.disabled) cls.push('disabled');
    if (cell.d.getTime() === today.getTime()) cls.push('today');
    if (rangeStart && rangeEnd) {
      const sameStart = cell.d.getTime() === rangeStart.getTime();
      const sameEnd = cell.d.getTime() === rangeEnd.getTime();
      if (sameStart) cls.push('range-start');
      if (sameEnd) cls.push('range-end');
      if (cell.d > rangeStart && cell.d < rangeEnd) cls.push('in-range');
      if (sameStart && sameEnd) cls.push('selected');
    } else if (dpRangeAnchor && cell.d.getTime() === dpRangeAnchor.getTime()) {
      cls.push('range-start');
    }
    const iso = isoOf(cell.d);
    const dis = cell.disabled ? 'disabled' : '';
    html += '<button class="' + cls.join(' ') + '" data-day="' + iso + '" ' + dis + '>'
          + cell.d.getDate() + '</button>';
  }
  html += '</div>';
  html += '<div class="datepicker-foot">';
  if (state.customRange) {
    const s = parseIso(state.customRange.start);
    const e = parseIso(state.customRange.end);
    if (state.customRange.start === state.customRange.end) {
      html += '<span>' + s.getDate() + ' ' + FR_MONTHS[s.getMonth()].slice(0,4) + '</span>';
    } else {
      html += '<span>' + s.getDate() + ' ' + FR_MONTHS[s.getMonth()].slice(0,4)
            + ' → ' + e.getDate() + ' ' + FR_MONTHS[e.getMonth()].slice(0,4) + '</span>';
    }
    html += '<button data-action="clear">effacer</button>';
  } else if (dpRangeAnchor) {
    html += '<span>début : ' + dpRangeAnchor.getDate() + ' '
          + FR_MONTHS[dpRangeAnchor.getMonth()].slice(0,4) + '</span>';
    html += '<button data-action="cancel">annuler</button>';
  } else {
    html += '<span>1 jour ou 2 clics</span>';
    html += '<button data-action="close">fermer</button>';
  }
  html += '</div>';

  dp.innerHTML = html;
}

function openDatepicker() {
  document.getElementById('datepicker').classList.add('open');
  dpRangeAnchor = null;
  renderDatepicker();
}
function closeDatepicker() {
  document.getElementById('datepicker').classList.remove('open');
  dpRangeAnchor = null;
}
function isDatepickerOpen() {
  return document.getElementById('datepicker').classList.contains('open');
}

document.getElementById('dateBtn').addEventListener('click', e => {
  e.stopPropagation();
  if (isDatepickerOpen()) closeDatepicker();
  else openDatepicker();
});

document.getElementById('datepicker').addEventListener('click', e => {
  e.stopPropagation();
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) {
    const dir = navBtn.dataset.nav === 'prev' ? -1 : 1;
    dpMonth = new Date(dpMonth.getFullYear(), dpMonth.getMonth() + dir, 1);
    renderDatepicker();
    return;
  }
  const dayBtn = e.target.closest('[data-day]:not([disabled])');
  if (dayBtn) {
    const isoStr = dayBtn.dataset.day;
    const d = parseIso(isoStr);
    if (!dpRangeAnchor) {
      dpRangeAnchor = d;
      renderDatepicker();
    } else {
      let start = dpRangeAnchor, end = d;
      if (end < start) { [start, end] = [end, start]; }
      state.customRange = { start: isoOf(start), end: isoOf(end) };
      state.when = 'custom';
      document.querySelectorAll('#filterWhen .chip[data-when]').forEach(c => c.classList.remove('active'));
      document.getElementById('dateBtn').classList.add('active');
      dpRangeAnchor = null;
      renderDatepicker();
      setTimeout(closeDatepicker, 250);
      render();
    }
    return;
  }
  const action = e.target.closest('[data-action]');
  if (action) {
    if (action.dataset.action === 'clear') {
      state.customRange = null;
      state.when = 'all';
      document.querySelectorAll('#filterWhen .chip[data-when]').forEach(c => c.classList.remove('active'));
      document.querySelector('#filterWhen .chip[data-when="all"]').classList.add('active');
      document.getElementById('dateBtn').classList.remove('active');
      renderDatepicker();
      render();
    } else if (action.dataset.action === 'cancel') {
      dpRangeAnchor = null;
      renderDatepicker();
    } else if (action.dataset.action === 'close') {
      closeDatepicker();
    }
  }
});

document.addEventListener('click', e => {
  if (!isDatepickerOpen()) return;
  if (e.target.closest('#dateBtn') || e.target.closest('#datepicker')) return;
  closeDatepicker();
});

/* ---------- main load ---------- */
async function load() {
  // Fetch events and auto-geocoded arrondissements in parallel.
  // venue_arrondissements.json is generated by aggregate.py (scrapers/geo.py).
  // It only contains venues NOT already in the hardcoded VENUE_ARRONDISSEMENT
  // map above. If the file is missing (first run, local dev), we silently
  // ignore it — the hardcoded map is still fully functional.
  const [eventsRes, geoRes] = await Promise.allSettled([
    fetch('events.json', { cache: 'no-store' }),
    fetch('venue_arrondissements.json', { cache: 'no-store' }),
  ]);

  if (eventsRes.status === 'rejected') throw eventsRes.reason;
  const data = await eventsRes.value.json();
  state.events = data.events || [];
  // Les occurrences ne dépendent que de state.events : calculées une seule
  // fois ici au lieu d'être recalculées à chaque render() (chaque frappe,
  // chaque clic de chip).
  state.occurrences = expandOccurrences(state.events);

  // Merge geocoded arrondissements into VENUE_ARRONDISSEMENT.
  // Hardcoded entries win on conflict (they've been manually verified).
  if (geoRes.status === 'fulfilled' && geoRes.value.ok) {
    try {
      const geo = await geoRes.value.json();
      for (const [venue, entry] of Object.entries(geo)) {
        // La commune se prend même quand la carte codée en dur gagne sur
        // l'arrondissement : les deux ne se contredisent pas, l'une dit
        // le quartier et l'autre le nom de la ville.
        if (entry.commune && !VENUE_COMMUNE[venue]) {
          VENUE_COMMUNE[venue] = entry.commune;
        }
        if (VENUE_ARRONDISSEMENT[venue]) continue;  // hardcoded wins
        if (entry.arr) VENUE_ARRONDISSEMENT[venue] = entry.arr;
      }
    } catch (_) { /* malformed JSON — ignore */ }
  }

  buildVenueHomepages();

  // Chiffres et date de mise à jour : en pied de page, pas dans le
  // masthead — l'information est utile mais n'a pas à occuper le haut.
  document.getElementById('footerIndex').textContent = state.events.length;
  document.getElementById('footerVenues').textContent =
    new Set(state.events.map(e => e.venue)).size;
  document.getElementById('lastUpdated').textContent = formatUpdated(data.generated_at);

  classerLieux();
  buildArrondissementFilters();
  buildLieuxFilters();
  buildTagsFilters();
  buildDaystrip();
  render();
}

/* ---------- bandeau de jours ----------
   Les 14 prochains jours ; ceux qui ont des événements affichent leur
   compte et défilent jusqu'à leur section, les autres restent grisés. */
function buildDaystrip() {
  const strip = document.getElementById('daystrip');
  if (!strip) return;
  strip.innerHTML = '';
  const counts = new Map();
  for (const occ of state.occurrences) {
    counts.set(occ._date, (counts.get(occ._date) || 0) + 1);
  }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  for (let i = 0; i < 14; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const iso = isoOf(d);
    const n = counts.get(iso) || 0;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'day-pill' + (n === 0 ? ' empty' : '') + (i === 0 ? ' today' : '');
    // Mois affiché uniquement au premier jour de chaque mois, et sur la
    // première pastille de la bande — sans elle, une fenêtre entièrement
    // contenue dans un mois n'indiquerait aucun mois du tout.
    const moisVisible = (i === 0 || d.getDate() === 1);
    btn.innerHTML = '<span class="dp-dow">' + FR_DAYS_SHORT[d.getDay()] + '</span>'
                  + '<span class="dp-num">' + d.getDate()
                  + '<i class="dp-mon' + (moisVisible ? '' : ' muet') + '">/'
                  + String(d.getMonth() + 1).padStart(2, '0')
                  + '</i></span>'
                  + '<span class="dp-count">' + (n ? n : '·') + '</span>';
    if (n) {
      btn.title = n + (n > 1 ? ' événements' : ' événement');
      btn.addEventListener('click', () => {
        const target = document.getElementById('day-' + iso);
        if (!target) return;
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      });
    } else {
      btn.disabled = true;
    }
    strip.appendChild(btn);
  }
}

/* ---------- tiroir des filtres secondaires ---------- */
(function () {
  const toggle = document.getElementById('drawerToggle');
  const drawer = document.getElementById('filterDrawer');
  if (!toggle || !drawer) return;
  toggle.addEventListener('click', () => {
    const open = drawer.hidden;
    drawer.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
    toggle.textContent = open ? '− filtres' : '+ filtres';
  });
})();

function formatUpdated(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })
       + ' · ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

/* ---------- source detection (Petit Bulletin / Ville Morte / venue scraper) ---------- */
function eventSource(e) {
  const url = (e.url || '').toLowerCase();
  if (url.includes('petit-bulletin.fr')) return 'pb';
  if (url.includes('villemorte.fr')) return 'vm';
  return 'venue';
}

function sourceSortIndex(e) {
  const s = eventSource(e);
  if (s === 'venue') return 0;
  if (s === 'pb') return 1;
  if (s === 'vm') return 2;
  return 3;
}

function sourceBadgeHtml(e) {
  // If this event happens at a venue we scrape directly, the card links to the
  // venue's own site (see eventHref) and is shown as a venue card — so we don't
  // tag it "petit bulletin" / "ville morte", even when the data originally came
  // from an aggregator. Only events at venues we DON'T scrape keep their badge.
  if (venueHomepage[e.venue]) return '';
  const s = eventSource(e);
  /* Abrégé en deux lettres : le nom entier occupait jusqu'à 71 px du pied,
     pris à la catégorie qui est le seul élément à se tronquer. Le titre
     natif rend le nom complet au survol, et il est lu par les lecteurs
     d'écran — l'information n'est pas perdue, seulement repliée. */
  if (s === 'pb') return '<span class="event-source pb" title="petit bulletin">PB</span>';
  if (s === 'vm') return '<span class="event-source vm" title="ville morte">VM</span>';
  return '';
}

/* ---------- prefer the scraped venue's own site over aggregator links ----------
   Built at load time: for each venue we scrape directly, record the homepage
   (scheme://host) taken from any of its scraper events. Then, when an event is
   sourced from an aggregator (Petit Bulletin / Ville Morte) but happens at a
   venue we also scrape, the card links to the venue's own site instead of the
   aggregator's event page. Venues we don't scrape keep their aggregator link
   (it's the best/only URL we have for them). */
const venueHomepage = {};
function buildVenueHomepages() {
  for (const e of state.events) {
    if (eventSource(e) !== 'venue') continue;       // only real scraper events
    if (venueHomepage[e.venue]) continue;           // first one wins
    try {
      const u = new URL(e.url);
      venueHomepage[e.venue] = u.protocol + '//' + u.host + '/';
    } catch (_) { /* ignore malformed URLs */ }
  }
}

function eventHref(e) {
  // Aggregator-sourced event at a venue we scrape -> link to the venue's site.
  if (eventSource(e) !== 'venue' && venueHomepage[e.venue]) {
    return venueHomepage[e.venue];
  }
  return e.url;
}

/* ---------- build venue groups ---------- */

/* Auto-promotion: when a new venue from aggregators contains certain
   keywords in its name (accents/case-insensitive), it goes to the matching
   group instead of falling into 'autre'.
   - musée / musee / galerie / institut → musées & galeries
   Seuls ces mots-clés sont routés ; tout autre lieu inconnu (y compris
   les théâtres venant de Ville Morte, qui ne les bloque plus) tombe
   dans 'autre'. */
function inferGroupForVenue(venueName) {
  const norm = (venueName || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
  if (norm.includes('musee') || norm.includes('galerie') || norm.includes('institut')) {
    return 'musées & galeries';
  }
  return null;
}

/* Rebuilds VENUE_GROUP_ORDER_INDEX from VENUE_GROUPS — call this after any
   dynamic mutation (auto-promotion or autre population) so card sorting
   picks up the new venues. */
function rebuildVenueGroupOrderIndex() {
  VENUE_GROUP_ORDER_INDEX.clear();
  VENUE_DISPLAY_ORDER.forEach((groupName, idx) => {
    const group = VENUE_GROUPS.find(g => g.name === groupName);
    if (group) {
      for (const venue of group.venues) {
        VENUE_GROUP_ORDER_INDEX.set(venue, idx);
      }
    }
  });
}

/* Classe chaque lieu dans un VENUE_GROUP, puis rafraîchit l'index de tri.
   Cette fonction dessinait aussi les puces du filtre « où », supprimé ;
   il ne reste que le travail STRUCTUREL, dont dépend le tri de chaque
   journée — VENUE_GROUPS sert des deux côtés, et c'est pour ça qu'on ne
   peut pas le retirer avec son filtre. */
function classerLieux() {
  // Step 1: collect all venues currently known (static groups, NOT including 'autre').
  const knownVenues = new Set();
  for (const g of VENUE_GROUPS) {
    if (g.name === 'autre') continue;
    for (const v of g.venues) knownVenues.add(v);
  }

  // Step 2: auto-promote unknown venues whose name implies a specific group
  // (e.g. anything with "musée" -> musées & galeries). This must happen
  // BEFORE we compute 'autre', so promoted venues don't double-appear.
  const unknownInEvents = new Set();
  for (const e of state.events) {
    if (e.venue && !knownVenues.has(e.venue)) unknownInEvents.add(e.venue);
  }
  for (const v of unknownInEvents) {
    const targetGroupName = inferGroupForVenue(v);
    if (!targetGroupName) continue;
    const targetGroup = VENUE_GROUPS.find(g => g.name === targetGroupName);
    if (targetGroup && !targetGroup.venues.includes(v)) {
      targetGroup.venues.push(v);
      knownVenues.add(v);
    }
  }

  // Step 3: everything still unknown falls into 'autre'. Threshold: >= 1 event.
  const autreVenueCounts = new Map();
  for (const e of state.events) {
    if (!e.venue || knownVenues.has(e.venue)) continue;
    autreVenueCounts.set(e.venue, (autreVenueCounts.get(e.venue) || 0) + 1);
  }
  const autreGroup = VENUE_GROUPS.find(g => g.name === 'autre');
  if (autreGroup) {
    // Sorted by event count desc, then by name asc
    autreGroup.venues = [...autreVenueCounts.entries()]
      .filter(([, count]) => count >= 1)
      .sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]))
      .map(([name]) => name);
  }

  // Step 4: refresh the venue-to-group sort index so dynamically added
  // venues sort correctly in the day-by-day card listing.
  rebuildVenueGroupOrderIndex();
}

/* Liste à cocher générique. Construite UNE fois au chargement : cocher
   une case ne touche que l'état et relance le rendu, sans reconstruire
   les 173 lignes. */
function construireListe(idConteneur, entrees, ensemble) {
  const c = document.getElementById(idConteneur);
  c.innerHTML = '';
  for (const { cle, nom, n } of entrees) {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = ensemble.has(cle);
    box.addEventListener('change', () => {
      if (box.checked) ensemble.add(cle); else ensemble.delete(cle);
      render();
    });
    const nomEl = document.createElement('span');
    nomEl.className = 'fl-nom';
    nomEl.textContent = nom;
    const nEl = document.createElement('span');
    nEl.className = 'fl-n';
    nEl.textContent = n;
    label.append(box, nomEl, nEl);
    label.title = nom + ' — ' + n + ' événement' + (n > 1 ? 's' : '');
    c.appendChild(label);
  }
}

function buildLieuxFilters() {
  const n = new Map();
  for (const e of state.events) {
    if (!e.venue) continue;
    n.set(e.venue, (n.get(e.venue) || 0) + 1);
  }
  const entrees = [...n.entries()]
    .sort((a, b) => a[0].localeCompare(b[0], 'fr'))
    .map(([v, c]) => ({ cle: v, nom: v, n: c }));
  construireListe('filterLieux', entrees, state.lieux);
}

function buildTagsFilters() {
  const n = new Map();
  for (const e of state.events) {
    const b = bucketOf(e.category);
    n.set(b, (n.get(b) || 0) + 1);
  }
  const entrees = ALL_BUCKETS
    .filter(b => n.has(b.key))
    .map(b => ({ cle: b.key, nom: b.label, n: n.get(b.key) }))
    .sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  construireListe('filterTags', entrees, state.tags);
}

/* ---------- build arrondissement chips ---------- */
function buildArrondissementFilters() {
  const container = document.getElementById('filterArr');
  container.innerHTML = '';
  // Only show arrondissements that actually have events
  const present = new Set();
  for (const e of state.events) present.add(eventArrondissement(e));

  for (const arr of ARRONDISSEMENT_ORDER) {
    if (!present.has(arr)) continue;
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = arr;
    btn.dataset.arr = arr;
    btn.addEventListener('click', () => {
      if (state.arrondissements.has(arr)) {
        state.arrondissements.delete(arr);
        btn.classList.remove('active');
      } else {
        state.arrondissements.add(arr);
        btn.classList.add('active');
      }
      render();
    });
    container.appendChild(btn);
  }
}

/* ---------- search input ---------- */
/* Forme minuscule sans accents pour la recherche : « theatre » doit
   trouver « Théâtre ». Même logique NFD que inferGroupForVenue. */
function normSearch(s) {
  return (s || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

(function () {
  const searchEl = document.getElementById('filterSearch');
  const clearBtn = document.getElementById('filterSearchClear');
  let debounceTimer;

  searchEl.addEventListener('input', () => {
    state.search = normSearch(searchEl.value.trim());
    clearBtn.style.display = state.search ? '' : 'none';
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 180);
  });

  searchEl.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      state.search = '';
      searchEl.value = '';
      clearBtn.style.display = 'none';
      render();
      searchEl.blur();
    }
  });

  clearBtn.addEventListener('click', () => {
    state.search = '';
    searchEl.value = '';
    clearBtn.style.display = 'none';
    render();
    searchEl.focus();
  });
})();

/* ---------- when matching ---------- */
function withinWhen(dateStr) {
  const d = parseIso(dateStr);
  const now = new Date(); now.setHours(0,0,0,0);
  if (state.when === 'all') return true;

  if (state.when === 'weekend') {
    // Le weekend court du VENDREDI au dimanche. Le vendredi de ce
    // weekend-ci : si on est samedi ou dimanche, il est derrière nous
    // (les jours passés sont de toute façon écartés en amont) ; sinon
    // c'est le vendredi à venir.
    const day = now.getDay();                 // 0 = dimanche
    const fri = new Date(now);
    if (day === 0)      fri.setDate(now.getDate() - 2);
    else if (day === 6) fri.setDate(now.getDate() - 1);
    else                fri.setDate(now.getDate() + (5 - day));
    const sun = new Date(fri); sun.setDate(fri.getDate() + 2);
    return d >= fri && d <= sun;
  }

  if (state.when === 'nextweek') {
    // Semaine prochaine : du lundi au dimanche suivants.
    const day = now.getDay();
    const offset = (8 - day) % 7 || 7;        // lundi → +7, dimanche → +1
    const mon = new Date(now); mon.setDate(now.getDate() + offset);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return d >= mon && d <= sun;
  }

  if (state.when === 'custom' && state.customRange) {
    const start = parseIso(state.customRange.start);
    const end = parseIso(state.customRange.end);
    return d >= start && d <= end;
  }
  return true;
}

/* ---------- expand multi-day ---------- */
/* Horizon d'affichage. Il n'en existait pas : inutile tant qu'une plage
   de plus de trente jours ne pesait qu'une carte. Maintenant qu'on les
   déploie toutes, « Papillons » — ouverte jusqu'au 22 octobre 2028 —
   fabriquerait à elle seule six cent soixante-quinze journées. La valeur
   reprend celle des scrapers (HORIZON_DAYS = 180) : c'est déjà l'horizon
   réel du feed, les agrégateurs seuls annonçant plus loin. */
const HORIZON_JOURS = 180;

/* Toutes les occurrences d'un événement, un par jour de sa durée.
   L'ancien seuil LONG_RUN_THRESHOLD repliait les séries de plus de trente
   jours en UNE carte, datée d'aujourd'hui : une exposition de cinq mois
   n'apparaissait qu'une fois puis disparaissait. Décision de septembre
   2026 : on affiche tout, tous les jours, et les arts plastiques du Petit
   Bulletin sont écartés en amont pour que le volume reste tenable. */
function expandOccurrences(events) {
  const out = [];
  const dayMs = 86400000;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const horizon = new Date(today.getTime() + HORIZON_JOURS * dayMs);
  const horizonIso = isoOf(horizon);
  for (const e of events) {
    const start = parseIso(e.date_start);
    const end = e.date_end ? parseIso(e.date_end) : start;
    const totalDays = Math.round((end - start) / dayMs) + 1;
    // On ne déploie que la partie utile : le passé est de toute façon
    // filtré plus loin, et l'au-delà de l'horizon n'a pas de journée.
    const depuis = start < today ? today : start;
    if (depuis > horizon) {
      // Série entièrement au-delà de l'horizon — un agrégateur annonce
      // parfois à deux ans. Une carte à sa date d'ouverture, pour ne pas
      // la faire disparaître du feed.
      out.push({ ...e, _date: e.date_start, _totalDays: totalDays,
                 _isLast: totalDays === 1 });
      continue;
    }
    for (let d = new Date(depuis); d <= end && isoOf(d) <= horizonIso;
         d.setDate(d.getDate() + 1)) {
      const iso = isoOf(d);
      out.push({ ...e, _date: iso, _totalDays: totalDays,
                 _isLast: iso === (e.date_end || e.date_start) });
    }
  }
  return out;
}

function filtered() {
  const now = new Date(); now.setHours(0,0,0,0);
  // state.occurrences est pré-calculé au load ; les occurrences passées
  // sont écartées par le check occDate < now ci-dessous.
  return state.occurrences.filter(occ => {
    const occDate = parseIso(occ._date);
    if (occDate < now) return false;
    if (!withinWhen(occ._date)) return false;
    if (state.arrondissements.size && !state.arrondissements.has(eventArrondissement(occ))) return false;
    if (state.lieux.size && !state.lieux.has(occ.venue)) return false;
    if (state.tags.size && !state.tags.has(bucketOf(occ.category))) return false;
    if (state.search) {
      const q = state.search;
      const titleMatch = normSearch(occ.title).includes(q);
      const venueMatch = normSearch(occ.venue).includes(q);
      // subtitle porte les line-ups d'artistes (ex. Le Sucre) — cherchable
      const subtitleMatch = normSearch(occ.subtitle).includes(q);
      if (!titleMatch && !venueMatch && !subtitleMatch) return false;
    }
    return true;
  });
}

/* ---------- render ----------
   render() enrobe renderFeed() dans une View Transition : au changement
   de filtre, l'ancienne et la nouvelle liste se fondent l'une dans
   l'autre au lieu d'être remplacées d'un coup. Dégradation propre là où
   l'API n'existe pas, et désactivé si l'utilisateur demande moins
   d'animations.
   Choix délibéré : pas de view-transition-name par carte. Nommer 700
   éléments ferait autant d'instantanés à calculer ; le fondu global
   suffit et reste fluide. */
let firstRenderDone = false;
function render() {
  const animate = firstRenderDone
    && typeof document.startViewTransition === 'function'
    // Indispensable : dans un onglet masqué, startViewTransition attend une
    // occasion de rendu qui n'arrive jamais et son callback n'est jamais
    // appelé — le feed se figerait silencieusement sur l'état précédent.
    && document.visibilityState === 'visible'
    && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  firstRenderDone = true;
  if (!animate) { renderFeed(); return; }
  try {
    document.startViewTransition(() => renderFeed());
  } catch (_) {
    renderFeed();   // jamais de mise à jour perdue à cause de l'animation
  }
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const events = filtered();

  if (events.length === 0) {
    feed.innerHTML = '<div class="empty-state"><p>rien dans ce filtre</p></div>';
    return;
  }

  const groups = new Map();
  for (const e of events) {
    if (!groups.has(e._date)) groups.set(e._date, []);
    groups.get(e._date).push(e);
  }
  const sortedDates = Array.from(groups.keys()).sort();
  const today = new Date(); today.setHours(0,0,0,0);
  const html = [];
  lastRenderDays.clear();

  for (const iso of sortedDates) {
    const list = groups.get(iso);
    // Sort within a day:
    //   1. by venue group (concerts → soirée → hybrides → spectacles & musiques → théâtre)
    //   2. by source (venue scraper first, then Petit Bulletin, then Ville Morte)
    //   3. then by time (events without a time go last, sorted alphabetically by venue)
    list.sort((a, b) => {
      const ga = VENUE_GROUP_ORDER_INDEX.get(a.venue);
      const gb = VENUE_GROUP_ORDER_INDEX.get(b.venue);
      // venues not found in any group fall to the end (large index)
      const pa = VENUES_PINNED_LAST.get(a.venue);
      const pb = VENUES_PINNED_LAST.get(b.venue);
      const ia = pa !== undefined ? pa : (ga === undefined ? 999 : ga);
      const ib = pb !== undefined ? pb : (gb === undefined ? 999 : gb);
      if (ia !== ib) return ia - ib;
      // same group: scraped venues first, then aggregators
      const sa = sourceSortIndex(a);
      const sb = sourceSortIndex(b);
      if (sa !== sb) return sa - sb;
      // same group + same source: compare time (missing time = 99:99 = last)
      const ta = a.time || '99:99';
      const tb = b.time || '99:99';
      if (ta !== tb) return ta.localeCompare(tb);
      // same time: alphabetical by venue then title for stable ordering
      const va = (a.venue || '').localeCompare(b.venue || '');
      if (va !== 0) return va;
      return (a.title || '').localeCompare(b.title || '');
    });
    // Comptes pris AVANT le filtre par famille : un bouton éteint doit
    // continuer d'annoncer ce qu'il rallumerait.
    const comptes = comptesParFamille(list);
    const visibles = filtrerParFamille(list);
    if (!visibles.length) continue;      // journée entièrement éteinte

    const d = parseIso(iso);
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const n = visibles.length;

    html.push('<section class="day" id="day-' + iso + '">');
    html.push('  <div class="day-bar">');
    html.push('    <span class="db-date">' + dd + '/' + mm + '</span>');
    html.push('    <span class="db-label">' + FR_DAYS_FULL[d.getDay()] + ' '
                 + d.getDate() + ' ' + FR_MONTHS[d.getMonth()] + '</span>');
    html.push('    ' + famillesHtml(comptes));
    html.push('    <span class="db-count">' + String(n).padStart(2, '0')
                 + ' évt' + (n > 1 ? 's' : '') + '</span>');
    html.push('  </div>');
    html.push('  <div class="day-body">');
    html.push(dayCardsHtml(iso, visibles));
    html.push('  </div>');
    html.push('</section>');
    // Mémorisé pour le dépliage : il ne reconstruit qu'une journée et n'a
    // donc pas à refaire le filtrage ni le tri (voir toggleGroup).
    lastRenderDays.set(iso, visibles);
  }
  // Toutes les familles éteintes : la boucle n'a rien produit, et le
  // garde-fou du début — qui compte les ÉVÉNEMENTS, avant regroupement —
  // ne pouvait pas le voir.
  if (!html.length) {
    // Les boutons vivent dans les barres de journée : sans journée, plus
    // de boutons, et donc aucun moyen de revenir en arrière. L'état vide
    // porte donc ses propres boutons, avec les comptes de TOUTE la
    // période plutôt que d'un jour.
    const total = comptesParFamille(events);
    feed.innerHTML = '<div class="empty-state">'
                   + '<p>toutes les familles sont masquées</p>'
                   + '<div class="empty-familles">' + famillesHtml(total) + '</div>'
                   + '</div>';
    return;
  }
  feed.innerHTML = html.join('\n');
}

/* Cartes d'une journée. Regroupement (lieu, jour) : la grappe prend la
   position de son PREMIER membre dans la liste déjà triée, sinon
   regrouper réordonnerait le jour. Une grappe dépliée rend ses cartes
   normales dans un bloc encadré, suivies du bouton de repli. */
/* Au-delà de ce nombre de cartes, la journée se découpe en sections de
   famille ; en deçà elle reste une grille continue. La journée médiane
   fait 5 cartes, et trois titres au-dessus d'une ou deux cartes chacune
   coûteraient plus qu'ils ne rapportent. Mesuré à ce seuil : 28 % des
   jours sont découpés, en 3,6 sections dont 0,7 seulement en dessous de
   trois cartes. */
const SEUIL_SECTIONS = 10;

function dayCardsHtml(iso, list) {
  const grappes = [...groupByVenue(list)];
  // Le seuil compte les CARTES, donc les grappes : une salle qui joue
  // quatre fois le même soir n'occupe qu'une carte tant qu'elle est
  // repliée, et ne doit pas à elle seule faire basculer la journée.
  if (grappes.length < SEUIL_SECTIONS) return grilleHtml(iso, grappes);

  const out = [];
  for (const f of FAMILLES) {
    const dedans = grappes.filter(([, evs]) => familleDeCarte(evs) === f.key);
    if (!dedans.length) continue;          // pas de section vide
    out.push('<section class="fam-section">');
    out.push('<h3 class="fam-titre">' + escapeHtml(f.label)
           + '<span class="ft-n">' + dedans.length + '</span></h3>');
    out.push(grilleHtml(iso, dedans));
    out.push('</section>');
  }
  return out.join('\n');
}

/* Rend une suite de grappes (lieu, événements) : sert à une journée
   entière comme à une seule section. */
function grilleHtml(iso, grappes) {
  // On empile des conteneurs : une grille .events tant que les cartes se
  // suivent normalement, refermée dès qu'un groupe déplié s'intercale.
  const out = [];
  let grille = [];
  const fermer = () => {
    if (!grille.length) return;
    out.push('<div class="events">' + grille.join('\n') + '</div>');
    grille = [];
  };

  for (const [venue, evs] of grappes) {
    if (evs.length < 2) { grille.push(eventCard(evs[0])); continue; }
    const key = iso + '|' + venue;
    if (!state.expanded.has(key)) { grille.push(groupCard(venue, evs, key)); continue; }
    fermer();
    out.push('<div class="group-block">');
    out.push('<div class="group-cards">');
    // Même graine que la carte groupée : les cartes ouvertes héritent du
    // enseigne du lieu et se lisent donc comme un ensemble.
    for (const e of evs) out.push(eventCard(e, venue + '|·groupe'));
    out.push('</div>');
    out.push('<button type="button" class="collapse-card" data-collapse="'
           + escapeHtml(key) + '">replier</button>');
    out.push('</div>');
  }
  fermer();
  return out.join('\n');
}

function escapeHtml(s) {
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Groupe les événements d'un jour par lieu, en conservant l'ordre de
   première apparition — la liste reçue est déjà triée (groupe de lieux,
   source, heure) et regrouper ne doit pas la réordonner. */
function groupByVenue(list) {
  const map = new Map();
  for (const e of list) {
    const v = e.venue || '';
    if (!map.has(v)) map.set(v, []);
    map.get(v).push(e);
  }
  return map;
}

/* Catégorie majoritaire d'une grappe. À égalité, ordre alphabétique :
   déterministe, donc stable d'un rendu à l'autre. */
function majorityCategory(evs) {
  const n = new Map();
  for (const e of evs) {
    if (!e.category) continue;
    n.set(e.category, (n.get(e.category) || 0) + 1);
  }
  if (!n.size) return '';
  return [...n.keys()].sort((a, b) => (n.get(b) - n.get(a)) || a.localeCompare(b))[0];
}

/* Nombre de lignes tenant dans une carte de 160 px : la piste centrale
   fait 83,6 px une fois l'en-tête (18), le pied (18) et les gouttières
   (12) retranchés des 132 px de contenu ; quatre rangées de 18 px plus
   trois gouttières de 3 en occupent 81. Au-delà, on montre les trois
   premières et une ligne de report. */
/* Date de fin d'un événement qui dure, en JJ/MM — l'année n'apparaît que
   si elle diffère de celle de la carte. Les agrégateurs annoncent des
   accrochages à deux ans, et « jusqu'au 22/10 » lu un 9 septembre 2026 se
   comprend comme 2026 quand l'exposition ferme en 2028. Sert au badge des
   cartes simples comme à la colonne de droite des cartes groupées, pour
   qu'elles ne divergent pas. */
function finCourte(e) {
  const f = parseIso(e.date_end || e.date_start);
  const dd = String(f.getDate()).padStart(2, '0');
  const mm = String(f.getMonth() + 1).padStart(2, '0');
  const meme = f.getFullYear() === parseIso(e._date).getFullYear();
  return dd + '/' + mm + (meme ? '' : '/' + String(f.getFullYear()).slice(-2));
}

const GROUP_MAX_LINES = 4;

function groupCard(venue, evs, key) {
  const shown = evs.length > GROUP_MAX_LINES ? evs.slice(0, GROUP_MAX_LINES - 1) : evs;
  const rest = evs.length - shown.length;

  let lines = '';
  for (const e of shown) {
    const t = (e.title && e.title.trim()) ? e.title.trim() : 'titre non précisé';
    // Une exposition n'a pas d'heure : la colonne affichait « — » et
    // l'échéance, portée par le badge d'une carte simple, disparaissait
    // du groupe. On y met la fin, dans la même convention.
    const droite = e.time
      || (e.date_end && e.date_end !== e.date_start
          ? (e._isLast ? 'dernière' : '→ ' + finCourte(e)) : '—');
    lines += '<span class="event-line"><span class="t">' + escapeHtml(t)
           + '</span><span class="h">' + escapeHtml(droite) + '</span></span>';
  }
  if (rest > 0) {
    lines += '<span class="event-line"><span class="t more">+' + rest
           + ' autres</span><span class="h"></span></span>';
  }

  const cat = majorityCategory(evs);
  // Badge de source seulement si toute la grappe vient de la même : sinon
  // il attribuerait à l'ensemble l'origine d'une partie.
  const badges = new Set(evs.map(e => sourceBadgeHtml(e)));
  const sourceBadge = badges.size === 1 ? [...badges][0] : '';

  /* Une grappe peut mélanger des soirs chez soi et hors les murs : le
     14 octobre, l'Opéra affiche un concert dans son Amphi et deux au
     Théâtre de La Renaissance. Aucune étiquette n'est alors juste pour
     l'ensemble, et on retombe sur l'arrondissement de la salle qui
     PROGRAMME — la grappe représente sa soirée. Le détail réapparaît au
     dépliage, chaque carte portant alors la sienne. */
  const etiquettes = new Set(evs.map(etiquetteLieu));
  const arr = etiquettes.size === 1
    ? [...etiquettes][0]
    : (VENUE_ARRONDISSEMENT[venue] || 'Autre');
  // Graine de l'enseigne : le lieu seul, pour que la grappe garde la même
  // apparence d'un jour à l'autre. Le suffixe évite de tomber sur la
  // graine d'un vrai événement.
  // Le logo du lieu s'il y en a un, l'enseigne seule sinon.
  // Un .photo-wrap VIDE accompagnait le cartouche pour que la trame
  // sérigraphie couvre toute la carte ; la trame ayant été retirée, il
  // n'avait plus d'objet et est parti avec elle.
  // Marque du lieu si on a le fichier, cartouche typographique sinon —
  // mais pour les seules salles qu'on scrappe en direct : elles portent
  // une identité que le site revendique, là où un lieu vu à travers un
  // agrégateur n'est qu'un nom de passage, et garde l'enseigne.
  // venueHomepage[] est déjà l'index des lieux scrappés (cf. eventHref).
  const logo = VENUE_LOGOS.get(venue);
  const marque = logo
    ? '<img class="logo-img" src="' + escapeHtml(logo.f) + '" alt=""'
      + ' loading="lazy" decoding="async" style="--k:' + logo.k + '%"'
      + ' onerror="logoIntrouvable(this)">'
    : (venueHomepage[venue] ? plaqueTypo(venue) : '');
  const visual = marque
    ? '<div class="visual-bg has-logo" data-graine="'
      + escapeHtml(venue + '|·groupe') + '" data-lieu="' + escapeHtml(venue) + '">'
      + '<div class="logo-plate">' + marque + '</div>'
      + '<div class="scrim"></div></div>'
    : '<div class="visual-bg">' + patternSVG(venue + '|·groupe', venue) + '</div>';

  return [
    '<button type="button" class="event" data-venue-day="' + escapeHtml(key) + '"',
    '        style="--t:' + teinteDe(cat) + '"',
    '        aria-expanded="false" aria-label="' + escapeHtml(venue + ', '
      + evs.length + ' événements — déplier') + '">',
    '  ' + visual,
    '  <div class="event-head">',
    '    <span class="event-venue">' + escapeHtml(venue) + '</span>',
    '    <span class="event-arr">' + escapeHtml(arr) + '</span>',
    '  </div>',
    '  <div class="event-list">' + lines + '</div>',
    '  <div class="event-foot">',
    '    <span class="event-cat">' + escapeHtml(cat) + '</span>',
    '    <div class="event-foot-right">' + sourceBadge + '</div>',
    '  </div>',
    '</button>'
  ].join('\n');
}

/* seedOverride : passé uniquement pour les cartes d'un groupe déplié, qui
   héritent alors de l'enseigne du lieu au lieu de tirer la leur. */
function eventCard(e, seedOverride) {
  /* Le tiret de l'heure inconnue ne se dessine PAS quand la carte porte
     déjà un badge d'échéance : il n'apprend rien à côté de « jusqu'au
     18/10 », et il coûte vingt pixels au pied — pris à la catégorie, qui
     est le seul élément du pied à se tronquer. C'est le cas serré du
     site : une exposition d'agrégateur cumule la source, l'échéance et
     l'heure, et « Art graphique » s'y réduisait à cinq lettres. */
  const dureeConnue = !!(e._totalDays && e._totalDays > 1);
  const time = e.time
    ? '<span class="event-time">' + escapeHtml(e.time) + '</span>'
    : (dureeConnue ? '' : '<span class="event-time empty">—</span>');

  // Title fallback: drop discreet placeholder if missing.
  const hasTitle = !!(e.title && e.title.trim());
  const titleHtml = hasTitle
    ? '<h3 class="event-title">' + escapeHtml(e.title.trim()) + '</h3>'
    : '<h3 class="event-title placeholder">titre non précisé</h3>';

  const cat = e.category
    ? '<span class="event-cat">' + escapeHtml(e.category) + '</span>'
    : '<span class="event-cat"></span>';

  let runBadge = '';
  /* Un événement qui dure porte sa fin, pas son rang : « 12/29 » ne dit
     rien d'utile à qui lit la carte, « → 30/10 » dit s'il reste du temps.
     Le dernier jour est nommé — « dernière », comme la dernière séance —,
     c'est la seule information qui presse.
     La flèche plutôt que « jusqu'au » : c'est la convention que la colonne
     de droite des cartes groupées emploie déjà, et une carte simple et une
     carte groupée qui montrent le même événement doivent l'écrire pareil.
     Elle est aussi trois fois plus courte, dans un pied où la catégorie
     est le seul élément qui se tronque. */
  if (dureeConnue) {
    if (e._isLast) {
      runBadge = '<span class="event-run">dernière</span>';
    } else {
      runBadge = '<span class="event-run">→ ' + finCourte(e) + '</span>';
    }
  }

  const sourceBadge = sourceBadgeHtml(e);

  const href = eventHref(e);
  const isHttpUrl = typeof href === 'string'
    && (href.startsWith('http://') || href.startsWith('https://'));
  const tag = isHttpUrl ? 'a' : 'div';
  const linkAttrs = isHttpUrl
    ? ' href="' + escapeHtml(href) + '" target="_blank" rel="noopener"'
    : '';

  const arr = etiquetteLieu(e);
  const arrLabel = '<span class="event-arr">' + escapeHtml(arr) + '</span>';

  // Layout = 3 grid rows: head / title / foot — précédés de la couche
  // visuelle en fond (affiche réelle ou enseigne du lieu, en fondu)
  const visual = visualLayerHtml(e, seedOverride);

  return [
    '<' + tag + ' class="event" style="--t:' + teinteDe(e.category) + '"'
      + linkAttrs + '>',
    '  ' + visual,
    '  <div class="event-head">',
    '    <span class="event-venue">' + escapeHtml(e.venue) + '</span>',
    '    ' + arrLabel,
    '  </div>',
    '  ' + titleHtml,
    // L'heure a quitté l'en-tête pour le pied : elle y tombe au même
    // pixel sur toutes les cartes, ce qui en fait une colonne que l'œil
    // descend d'un seul balayage. En haut, sa position dépendait de la
    // longueur du nom du lieu — donc elle se déplaçait d'une carte à
    // l'autre. Dernière du groupe de droite, elle est contre le bord.
    '  <div class="event-foot">',
    '    ' + cat,
    '    <div class="event-foot-right">',
    '      ' + sourceBadge,
    '      ' + runBadge,
    '      ' + time,
    '    </div>',
    '  </div>',
    '</' + tag + '>'
  ].join('\n');
}

/* Dépliage des grappes.
   NE PAS repasser par render(), qui remplace le feed entier : les
   journées portent content-visibility:auto avec contain-intrinsic-size en
   mode « auto », si bien que le navigateur MÉMORISE la hauteur réelle de
   chacune une fois rendue. Reconstruire tout le feed détruit ces nœuds,
   donc toutes les hauteurs mémorisées, et le document se ré-estime à
   420 px par journée : la hauteur totale change brutalement et le
   défilement saute. On ne reconstruit donc que la journée concernée — les
   autres gardent leur nœud, donc leur mesure.
   L'ancrage sur l'élément cliqué est la ceinture par-dessus les
   bretelles : même si une hauteur bouge malgré tout, la carte reste
   immobile sous le curseur. Utile aussi au repli, où le contenu se
   contracte au-dessus du point de clic. */
function toggleGroup(key, deplier) {
  const iso = key.slice(0, key.indexOf('|'));
  const section = document.getElementById('day-' + iso);
  const list = lastRenderDays.get(iso);
  const corps = section && section.querySelector('.day-body');
  if (!corps || !list) { render(); return; }    // état inattendu : repli sûr

  // Position, dans la fenêtre, de ce sur quoi on veut rester ancré.
  const avantEl = deplier
    ? section.querySelector('[data-venue-day="' + CSS.escape(key) + '"]')
    : section.querySelector('[data-collapse="' + CSS.escape(key) + '"]');
  const avantY = avantEl ? avantEl.getBoundingClientRect().top : null;

  if (deplier) state.expanded.add(key); else state.expanded.delete(key);
  corps.innerHTML = dayCardsHtml(iso, list);

  // Après dépliage on s'ancre sur la première carte ouverte, après repli
  // sur la carte groupée reformée : dans les deux cas, l'élément qui
  // occupe la place de celui qu'on vient de quitter.
  const apresEl = deplier
    ? corps.querySelector('.group-block .event')
    : corps.querySelector('[data-venue-day="' + CSS.escape(key) + '"]');
  if (avantY !== null && apresEl) {
    const delta = apresEl.getBoundingClientRect().top - avantY;
    if (delta) window.scrollBy(0, delta);
  }
  if (apresEl) apresEl.focus({ preventScroll: true });
}

document.getElementById('feed').addEventListener('click', ev => {
  const fam = ev.target.closest('.fam-chip');
  if (fam) {
    const k = fam.dataset.famille;
    if (state.famillesOff.has(k)) state.famillesOff.delete(k);
    else state.famillesOff.add(k);
    render();
    return;
  }
  const open = ev.target.closest('[data-venue-day]');
  if (open) { toggleGroup(open.getAttribute('data-venue-day'), true); return; }
  const close = ev.target.closest('[data-collapse]');
  if (close) toggleGroup(close.getAttribute('data-collapse'), false);
});

/* Les cartouches typographiques se dimensionnent en mesurant Bungee. Si
   la fonte arrive après le premier rendu — cas ordinaire, elle vient de
   Google Fonts — les corps posés d'après les paliers sont approximatifs.
   On recompose une fois, quand elle est prête. Sans garde sur le feed
   déjà rempli, ce serait un rendu de trop au chargement à froid. */
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    if (state.events.length && document.querySelector('.logo-mot')) render();
  });
}

load().catch(err => {
  document.getElementById('feed').innerHTML =
    '<div class="empty-state"><p>erreur de chargement</p><p style="font-family:monospace;font-size:12px;text-transform:none;color:#a59f86">' + err + '</p></div>';
});
</script>
