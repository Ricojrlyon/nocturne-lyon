<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>*nocturne · lyon</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-16 -16 32 32'><g fill='%23d4a574'><rect x='-2' y='-13' width='4' height='26' rx='2'/><rect x='-2' y='-13' width='4' height='26' rx='2' transform='rotate(60)'/><rect x='-2' y='-13' width='4' height='26' rx='2' transform='rotate(120)'/></g></svg>">
<meta name="description" content="Guide nocturne — concerts, théâtre, danse, clubs à Lyon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #161f25;
    --bg-elev:      #1c272f;
    --bg-elev-2:    #243038;
    /* Fond des cartes, en CREUX sous la page et non en relief au-dessus.
       Elles étaient à --bg-elev, un cran au-dessus du fond : onze points
       de luminance d'écart, assez pour que le bas de carte ne se confonde
       pas avec la page, trop peu pour que la grille se lise comme une
       grille. En descendant à #0d1317 l'écart passe à quatorze points
       dans l'autre sens, et surtout le fond de carte devient le point le
       plus sombre de l'écran — donc le blanc du titre et le crème de
       l'heure y gagnent, là où un fond plus clair les aurait rognés.
       C'est la valeur de la maquette, où la carte était noire sur un fond
       gris-bleu.
       Ces deux teintes sont propres aux cartes : --bg-elev continue de
       servir la barre de filtres et le ruban des journées, qui doivent
       bien rester en relief. */
    --bg-carte:     #0d1317;
    --bg-carte-2:   #18222a;      /* survol : la carte s'allume */
    --ink:          #e7dfbe;        /* cream — main text */
    --ink-soft:     #a59f86;        /* faded cream — secondary */
    --ink-mute:     #5e6973;        /* muted blue-gray — tertiary */
    --rule:         #2a363f;        /* very subtle line */
    --rule-strong:  #3a4853;
    --accent:       #e7dfbe;        /* cream accent (same as ink) */
    --accent-glow:  rgba(231, 223, 190, 0.12);
    --warm:         #d4a574;        /* warm tan for badges/highlights */
    /* Corail adouci : il ne sert plus au badge de durée, passé en crème
       filaire comme l'étiquette d'arrondissement, mais reste la couleur
       d'INTERFACE du site — filtre coché, cadre d'un groupe déplié. Son
       filet compagnon --hot-line est parti avec le badge. */
    --hot:          #e08d70;        /* coral adouci — signaux d'interface */
    /* Angles très légèrement adoucis — validé sur maquette (3 px). */
    --radius:       3px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter Tight', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
    font-feature-settings: 'ss01' on, 'cv11' on;
  }
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px;
  }
  @media (max-width: 720px) {
    .container { padding: 0 20px; }
  }

  /* ---------- type primitives ---------- */
  .mono {
    font-family: 'JetBrains Mono', monospace;
    font-feature-settings: 'ss03' on;
  }

  /* ---------- masthead : bloc plein ----------
     Le wordmark vit dans un bloc crème, texte en négatif (device
     emprunté à Aspen Search / State of AI). Rien à côté : le relevé de
     données a été retiré, il n'apportait pas d'information utile et
     s'empilait mal sur téléphone. */
  header.masthead {
    border-bottom: 1px solid var(--rule-strong);
  }
  /* Le conteneur garde le padding standard (32 px, 20 px sur mobile) :
     le bord gauche du bloc crème s'aligne ainsi exactement sur le reste
     du contenu — filtres, bandeau de jours, cartes. */
  .masthead .container {
    display: flex;
    align-items: stretch;
  }
  .wordmark {
    margin: 0;
    background: var(--ink);
    color: var(--bg);
    font-family: 'Bungee', system-ui, sans-serif;
    font-size: 20px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.01em;
    padding: 13px 22px 12px;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }
  .wordmark .ast {
    color: var(--warm);
    animation: ast-pulse 3.6s ease-in-out infinite;
  }
  @keyframes ast-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  @media (max-width: 720px) {
    .wordmark { font-size: 17px; padding: 11px 18px 10px; }
  }

  /* ---------- filters bar ---------- */
  .filters {
    border-bottom: 1px solid var(--rule);
    padding: 14px 0;
  }

  .filter-row {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    align-items: center;
    padding: 4px 0;
  }
  /* Le tiroir des filtres secondaires : replié par défaut, il libère
     ~120 px avant le premier événement. */
  .filter-drawer {
    border-top: 1px dashed var(--rule);
    margin-top: 8px;
    padding-top: 6px;
  }
  .filter-drawer[hidden] { display: none; }
  .filter-drawer .filter-row + .filter-row {
    border-top: 1px dashed var(--rule);
    padding-top: 10px;
    margin-top: 6px;
  }
  /* Rangée principale. Ordre du DOM : recherche, bouton du tiroir, chips
     de temps — ainsi l'ordre de tabulation suit l'ordre visuel. Sur
     téléphone la recherche et le bouton partagent la première ligne et
     les chips occupent la seconde ; le bouton ne se retrouve plus seul
     sur sa propre ligne, décalé du reste. */
  .filter-row.primary {
    gap: 8px 6px;
    align-items: center;
  }
  .filter-row.primary .filter-search-wrap { flex: 1 1 220px; }
  .filter-row.primary .filter-group { flex: 1 1 auto; }
  @media (max-width: 720px) {
    .filter-row.primary .filter-group { flex: 1 0 100%; }
  }
  .drawer-toggle { border-style: dashed; flex: 0 0 auto; }
  .drawer-toggle[aria-expanded="true"] {
    border-style: solid;
    border-color: var(--warm);
    color: var(--warm);
  }
  /* Listes à cocher : lieux et tags. Une liste plutôt que des puces
     parce qu'il y a 173 lieux — en puces la rangée ferait dix lignes et
     on n'y retrouverait rien. Triée alphabétiquement : c'est une liste
     où l'on CHERCHE un nom, pas où l'on découvre. */
  .filter-liste {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
    gap: 1px 16px;
    align-content: start;
    max-height: 188px;
    overflow-y: auto;
    flex: 1 1 100%;
    padding: 2px 8px 2px 0;
    border-left: 1px solid var(--rule);
    padding-left: 12px;
  }
  .filter-liste label {
    display: flex;
    align-items: baseline;
    gap: 7px;
    padding: 2px 0;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    min-width: 0;
  }
  .filter-liste label:hover { color: var(--ink); }
  .filter-liste input {
    accent-color: var(--hot);
    margin: 0;
    flex: 0 0 auto;
    align-self: center;
  }
  .filter-liste .fl-nom {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .filter-liste .fl-n {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
    flex: 0 0 auto;
  }
  .filter-liste label:has(input:checked) { color: var(--hot); }
  .filter-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: lowercase;
    letter-spacing: 0.06em;
    color: var(--ink-mute);
    flex: 0 0 auto;
    align-self: center;
    min-width: 64px;
  }
  .filter-label::before { content: "("; color: var(--ink-mute); }
  .filter-label::after { content: ")"; color: var(--ink-mute); }

  .filter-group { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0; }

  /* chips */
  /* Search input in filter bar */
  .filter-search-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
  }
  .filter-search {
    width: 100%;
    box-sizing: border-box;
    background: transparent;
    border: 1px solid var(--rule-strong);
    color: var(--ink);
    padding: 6px 28px 6px 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    border-radius: var(--radius);
    outline: none;
    letter-spacing: 0.04em;
    transition: border-color 0.16s ease;
    -webkit-appearance: none;
  }
  .filter-search::placeholder { color: var(--ink-mute); }
  .filter-search:focus { border-color: var(--ink); }
  .filter-search-clear {
    position: absolute;
    right: 9px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-mute);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0;
    display: none;
  }
  .filter-search-clear:hover { color: var(--ink); }

  .chip {
    border: 1px solid var(--rule-strong);
    background: transparent;
    color: var(--ink-soft);
    padding: 5px 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.16s ease;
    text-transform: lowercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    line-height: 1.5;
  }
  .chip:hover {
    border-color: var(--ink);
    color: var(--ink);
  }
  .chip.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .chip.partial {
    border-color: var(--warm);
    color: var(--warm);
    background: transparent;
  }
  .chip-group {
    font-weight: 700;
    text-transform: lowercase;
  }
  .chip-group::after {
    content: "↘";
    margin-left: 6px;
    font-size: 10px;
    display: inline-block;
    transition: transform 0.18s ease;
    opacity: 0.6;
  }
  .venue-group.expanded .chip-group::after {
    transform: rotate(45deg);
    opacity: 1;
  }
  .chip-sub { font-size: 10px; padding: 4px 10px; font-weight: 400; }

  /* venue groups */
  .venue-groups {
    display: flex; flex-wrap: wrap; gap: 5px;
    flex: 1;
  }
  .venue-group { display: contents; }
  .venue-sublist {
    display: none;
    flex-wrap: wrap;
    gap: 4px;
    padding: 9px 12px;
    background: var(--bg-elev);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    width: 100%;
    margin: 4px 0 2px;
  }
  .venue-group.expanded .venue-sublist { display: flex; }

  /* date picker */
  .datepicker-wrap { position: relative; display: inline-block; }
  .datepicker {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 30;
    background: var(--bg-elev);
    border: 1px solid var(--ink-mute);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: 0 6px 32px rgba(0,0,0,0.5);
    min-width: 280px;
  }
  .datepicker.open { display: block; }
  .datepicker-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink);
  }
  .datepicker-nav {
    background: transparent;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
    width: 26px; height: 26px;
    cursor: pointer;
    color: var(--ink);
    font-size: 14px;
    line-height: 1;
    transition: all 0.14s ease;
  }
  .datepicker-nav:hover {
    border-color: var(--ink);
    background: var(--bg-elev-2);
  }
  .datepicker-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .datepicker-dow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    color: var(--ink-mute);
    text-align: center;
    padding: 4px 0;
    letter-spacing: 0.1em;
  }
  .datepicker-day {
    background: transparent;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink);
    padding: 6px 0;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .datepicker-day:hover:not(.disabled) {
    background: var(--bg-elev-2);
  }
  .datepicker-day.disabled { color: var(--ink-mute); cursor: not-allowed; opacity: 0.5; }
  .datepicker-day.muted { color: var(--ink-mute); }
  .datepicker-day.selected,
  .datepicker-day.range-start,
  .datepicker-day.range-end {
    background: var(--ink);
    color: var(--bg);
  }
  .datepicker-day.in-range {
    background: var(--bg-elev-2);
    color: var(--ink);
    border-radius: 0;
  }
  .datepicker-day.range-start { border-radius: var(--radius) 0 0 var(--radius); }
  .datepicker-day.range-end { border-radius: 0 var(--radius) var(--radius) 0; }
  .datepicker-day.range-start.range-end { border-radius: var(--radius); }
  .datepicker-day.today {
    box-shadow: inset 0 0 0 1px var(--warm);
  }
  .datepicker-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: lowercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    gap: 8px;
  }
  .datepicker-foot span { flex: 1; }
  .datepicker-foot button {
    background: transparent;
    border: none;
    color: var(--warm);
    font-family: inherit;
    font-size: inherit;
    text-transform: inherit;
    letter-spacing: inherit;
    cursor: pointer;
    padding: 0;
  }
  .datepicker-foot button:hover { text-decoration: underline; }

  .clear-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: lowercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
    margin-left: auto;
    transition: color 0.14s ease;
  }
  .clear-link:hover { color: var(--ink); }
  .clear-link::after {
    content: " →";
    color: var(--warm);
  }

  /* ---------- feed / day blocks ---------- */
  /* ---------- bandeau de jours ---------- */
  .daystrip-wrap {
    border-bottom: 1px solid var(--rule);
  }
  .daystrip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 0 12px;
    scrollbar-width: thin;
    scroll-snap-type: x proximity;
  }
  .day-pill {
    flex: 0 0 auto;
    min-width: 62px;
    text-align: center;
    cursor: pointer;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 6px 9px 5px;
    font-family: 'JetBrains Mono', monospace;
    scroll-snap-align: start;
    transition: border-color 0.14s ease, background 0.14s ease;
  }
  .day-pill:hover { border-color: var(--ink-soft); }
  .day-pill:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
  .day-pill .dp-dow {
    display: block;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-mute);
  }
  .day-pill .dp-num {
    display: block;
    font-size: 15px;
    line-height: 1.2;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .day-pill .dp-mon {
    font-style: normal;
    font-size: 8.5px;
    letter-spacing: 0.04em;
    color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
  }
  /* Le mois n'est affiché qu'aux changements de mois, mais sa place reste
     RÉSERVÉE partout : le contenu de la pastille est centré, donc le
     supprimer décalerait le numéro d'environ 5 px sur les pastilles sans
     mois. visibility:hidden garde tous les chiffres alignés. */
  .day-pill .dp-mon.muet { visibility: hidden; }
  .day-pill .dp-count {
    font-size: 9px;
    color: var(--warm);
    font-variant-numeric: tabular-nums;
  }
  .day-pill.empty { opacity: 0.38; cursor: default; }
  .day-pill.today {
    border-color: var(--warm);
    background: rgba(212, 165, 116, 0.09);
  }

  main.feed { padding: 34px 0 80px; }

  /* ---------- journées ----------
     La colonne de date de 200 px (soit 232 px des 1280 du conteneur pour
     afficher « 18/07 ») est remplacée par un bandeau fin sticky pleine
     largeur : les cartes récupèrent toute la largeur, et chaque journée
     s'ouvre sur un filet en dégradé qui la sépare nettement de la
     précédente. */
  .day {
    padding: 0 0 26px;
    scroll-margin-top: 8px;
    /* Le navigateur ne calcule la mise en page que des journées visibles.
       Sur ~700 cartes le gain est net, pour zéro changement visuel.
       contain-intrinsic-size donne une hauteur estimée afin que la barre
       de défilement reste juste avant le rendu réel. */
    content-visibility: auto;
    contain-intrinsic-size: auto 420px;
  }
  .day + .day { margin-top: 34px; }
  .day::before {
    content: '';
    display: block;
    height: 1px;
    background: linear-gradient(to right,
      rgba(231, 223, 190, 0.30),
      rgba(231, 223, 190, 0.30) 72%,
      rgba(231, 223, 190, 0.05));
  }

  .day-bar {
    position: sticky;
    top: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 0;
    margin-bottom: 14px;
    background: linear-gradient(to bottom, var(--bg) 72%, rgba(22, 31, 37, 0.9));
    font-family: 'JetBrains Mono', monospace;
  }
  .day-bar .db-date {
    background: var(--ink);
    color: var(--bg);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 5px 11px;
    border-radius: var(--radius);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .day-bar .db-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Boutons de famille, dans la barre de journée. L'état est GLOBAL —
     éteindre « expos » l'éteint partout — mais le compte est celui du
     JOUR : c'est ce qui permet de décider sans faire défiler. Le compte
     est celui des CARTES, grappes comprises, donc exactement ce qui
     apparaîtra. */
  .day-bar .db-familles {
    display: flex;
    gap: 5px;
    flex: 0 0 auto;
  }
  .day-bar .db-label { flex: 0 1 auto; min-width: 0; }
  .fam-chip {
    font-family: inherit;
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 4px 8px;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }
  .fam-chip .fam-n {
    color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
  }
  /* Éteinte : le trait pointillé dit « masquée » sans recourir à la
     seule opacité, qui se confond avec l'état désactivé. */
  .fam-chip[aria-pressed="false"] {
    opacity: 0.5;
    border-style: dashed;
  }
  .fam-chip:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .fam-chip:hover:not(:disabled) {
    border-color: var(--ink-soft);
    color: var(--ink);
  }
  .fam-chip:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
  /* Dans l'état vide les boutons ne sont plus dans une barre de journée
     et n'héritent donc plus de sa police monospace. */
  .empty-familles {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
  }
  .day-bar .db-count {
    font-size: 9.5px;
    color: var(--ink-mute);
    letter-spacing: 0.14em;
    margin-left: auto;
    white-space: nowrap;
  }
  @media (max-width: 560px) {
    .day-bar { gap: 9px; flex-wrap: wrap; }
    .day-bar .db-label { font-size: 9.5px; letter-spacing: 0.12em; }
    /* Les cinq boutons prennent leur propre ligne : les tenir sur celle
       de la date écraserait le libellé du jour. */
    .day-bar .db-familles { flex: 1 0 100%; order: 3; }
    .day-bar .db-count { order: 2; }
    /* À CINQ, les pastilles ne tiennent plus sur une ligne de téléphone :
       386 px demandés pour 335 disponibles. On récupère la place sur
       l'INTERLETTRAGE plutôt que sur le corps — 0,12 em à 9,5 px coûtait
       une dizaine de pixels par pastille, et c'est du confort d'affiche,
       pas de lecture. Le corps, lui, ne bouge pas : il est déjà au seuil
       sous lequel des capitales monospace deviennent pénibles, seuil qui
       avait fait remonter l'étiquette d'arrondissement de 8,5 à 9,5.
       Mesuré : la rangée passe de 386 à 325 px, soit 10 px de marge sur
       la journée la plus chargée.
       Le retour à la ligne reste autorisé en dernier recours : sous
       340 px de large — un vieux téléphone —, aucun réglage ne les fait
       tenir, et mieux vaut une barre plus haute qu'une pastille qui sort
       de l'écran. */
    .fam-chip { letter-spacing: 0.04em; padding: 4px 6px; gap: 4px; }
    .day-bar .db-familles { gap: 4px; flex-wrap: wrap; row-gap: 4px; }
  }

  /* ---------- event grid ---------- */
  /* .group-cards — la grille interne d'un groupe déplié — partage les
     pistes de .events dans TOUTES les règles qui suivent, et jamais par
     recopie : elle doit produire les mêmes colonnes que la grille qui
     l'entoure. Dupliquer ces valeurs les aurait laissées diverger au
     premier réglage. */
  .events, .group-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    grid-auto-rows: 160px;
    gap: 12px;
  }
  @media (min-width: 1100px) {
    .events, .group-cards {
      grid-template-columns: repeat(auto-fill, minmax(280px, calc(33.333% - 8px)));
    }
  }
  @media (max-width: 560px) {
    /* Une seule colonne, mais la rangée garde ses 160 px : c'est le second
       endroit qui la libérait, et il faut les deux pour que la carte tienne
       sa hauteur sur téléphone. */
    .events, .group-cards {
      grid-template-columns: 1fr;
    }
  }

  /* Inner layout uses GRID with explicit row tracks. This is much more
     predictable than flex + line-clamp inside a fixed-height container. */
  .event {
    display: grid;
    /* Trois rangées au contenu, poussées en BAS de la carte : c'est ce
       qui définit la carte « A ». Le haut, laissé libre, montre l'affiche.
       Auparavant les rangées valaient `auto 1fr auto` et le titre flottait
       au centre d'une piste élastique ; le texte se retrouvait ainsi au
       milieu de la carte, donc sur la partie la plus forte du visuel.
       Ici les trois rangées prennent la hauteur de leur contenu et
       align-content les groupe contre le padding bas — le texte occupe
       donc toujours la zone où le visuel s'est éteint en fondu.
       Les `align-self` des enfants (title, list, foot) deviennent sans
       effet, une rangée `auto` valant exactement son contenu ; ils sont
       laissés en place pour le mode mobile, où la carte est un flex. */
    grid-template-rows: auto auto auto;
    align-content: end;
    /* Gouttiere NULLE : les deux ecarts de la carte sont portes par les
       marges des elements, parce qu'ils ne doivent pas etre egaux en
       geometrie pour l'etre a l'oeil. Une gouttiere uniforme de 6 px
       donnait 14,4 px d'encre a encre entre le lieu et le titre, contre
       7,0 px entre le titre et le filet : la boite du lieu laisse 4,7 px
       de vide sous ses capitales et celle du titre 3,7 px au-dessus des
       siennes, quand le filet, lui, est pose au ras du titre. */
    row-gap: 0;
    padding: 14px 18px 12px;
    /* Filet du même bleu-gris que les autres cadres du site, au lieu du
       crème à 20 % : sur un fond de carte descendu à #0d1317, le crème
       translucide tirait vers le brun et la carte prenait un liseré
       tiède qu'aucun autre élément ne portait. */
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
    /* Fond en creux SOUS la page — cf. --bg-carte. */
    background: var(--bg-carte);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.18s ease, background 0.18s ease;
    height: 100%;
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .event:hover {
    border-color: var(--warm);
    background: var(--bg-carte-2);
  }

  /* ---------- couche visuelle en fond de carte ----------
     Affiche réelle si disponible, enseigne du lieu sinon — dans les
     deux cas la couche s'éteint en fondu vers ~55 % de la hauteur pour
     laisser le texte respirer. L'enseigne est TOUJOURS rendue en
     sous-couche : si l'affiche ne charge pas (hotlink bloqué, 404),
     onerror masque la photo et l'enseigne réapparaît. */
  /* Le visuel tient le HAUT de la carte : il monte de 0 à pleine force
     sur les 12 premiers pour cent, tient jusqu'aux 42 %, puis s'éteint
     et a disparu à 82 %. Le texte, désormais groupé en bas de carte
     (cf. align-content:end sur .event), tombe donc sur une zone d'où
     l'affiche s'est retirée — c'est ce partage haut/bas qui fait la
     lisibilité de la carte A, et non un voile posé sur l'image.
     Le fondu du haut garde son effet d'origine : la texture s'efface
     juste sous le bord supérieur, où la carte respire.
     Auparavant le visuel tenait jusqu'aux 56 % et ne s'effaçait qu'au
     bord bas : le titre, alors centré, passait sur sa partie la plus
     forte. */
  .visual-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom,
        transparent 0%, rgba(0,0,0,.62) 5%, rgba(0,0,0,1) 12%,
        rgba(0,0,0,1) 42%, rgba(0,0,0,.52) 58%, rgba(0,0,0,.14) 72%, transparent 82%);
    mask-image: linear-gradient(to bottom,
        transparent 0%, rgba(0,0,0,.62) 5%, rgba(0,0,0,1) 12%,
        rgba(0,0,0,1) 42%, rgba(0,0,0,.52) 58%, rgba(0,0,0,.14) 72%, transparent 82%);
  }
  /* L'enseigne porte ses opacités dans son propre balisage, bande par
     bande : aucune opacité de calque ici, sinon elle les diviserait
     toutes. Le 0,58 qui s'appliquait aux anciens motifs est parti avec
     eux — les valeurs du balisage en tiennent compte. */
  .visual-bg .enseigne {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }
  .visual-bg .photo-wrap { position: absolute; inset: 0; }
  .visual-bg img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 22%;
    /* Assombrissement de l'affiche, aux valeurs de la maquette : le titre
       passe devant l'image, et les affiches claires le rendaient illisible.
       La trame sérigraphie qui doublait ce filtre a été retirée — elle
       apportait 25 % d'assombrissement moyen en plus, dont ce chiffre-ci
       tient désormais compte, et elle mangeait le détail des visages et
       des visuels fins. La désaturation légère fait le travail qu'elle
       faisait d'utile : unifier des affiches très hétérogènes.
       Le filtre porte sur la balise image seule : l'enseigne, composée en
       blanc entre 0,07 et 0,18 d'opacité, est déjà sourde et n'en a pas
       besoin. */
    filter: brightness(0.42) saturate(0.85) contrast(1.08);
  }
  /* Voile sombre CROISSANT : il était le plus fort en haut, où vivait la
     ligne lieu·arr·heure ; le texte étant passé en bas, il s'inverse.
     Le palier de 0,90 est atteint dès 40 % : il couvre ainsi la ligne du
     lieu, qui tombe à 41 % sur une carte simple, sans que la rampe des
     quarante premiers pour cent change assez pour se voir. La valeur du
     haut, 0,28, ne sert qu'à l'image : montée à 0,50 elle éteignait les
     affiches sans rien gagner sur le texte.
     Sa COULEUR est celle du fond de carte, #0d1317, et non celle de la
     page : le voile et le bas de carte se rejoignent donc sans raccord.
     Tant qu'ils différaient, la zone où le masque éteint l'affiche
     laissait paraître une marche entre les deux gris.
     C'est ce voile, et non le masque, qui porte la lisibilité. Mesuré sur
     une affiche entièrement blanche — le pire cas, qui n'existe pas : le
     blanc du texte tient 15:1 partout, le crème 11:1, et la plus sombre
     des dix-neuf teintes 4,4:1 sur la ligne du lieu d'une carte simple.
     Le cas le plus défavorable du site est la carte groupée à quatre
     lignes, dont le texte remonte jusqu'aux 14 % : 2,9:1 pour cette même
     teinte sur le cartouche blanc d'un logo — un nom de lieu que le logo
     derrière lui écrit déjà. Aller au-delà demanderait soit d'éteindre
     les logos, soit de délaver quatre des dix-neuf teintes de 20 %, sans
     pour autant atteindre les 4,5:1 qu'un texte de 12 px réclame.
     Il est à l'intérieur de .visual-bg, donc soumis au même masque :
     sous 82 % il ne reste plus rien à voiler et le fond de carte
     (--bg-carte) porte seul le pied. */
  .visual-bg .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom,
        rgba(13,19,23,.28) 0%, rgba(13,19,23,.90) 40%, rgba(13,19,23,1) 92%);
  }
  /* ---------- logo de salle sur les cartes groupées ----------
     Une carte groupée n'a pas d'affiche : elle représente plusieurs
     spectacles à la fois, et tire donc l'enseigne du lieu. Pour les
     salles qui jouent plusieurs fois par soir, la marque du lieu dit
     mieux de quoi il s'agit — et c'est le même geste que pour une
     affiche, à un cadrage près : une affiche est en `cover` et remplit
     la carte, un logo est posé à sa taille et déborde un peu.

     La hauteur est en pour cent de la carte, la largeur suit d'elle-même
     le rapport intrinsèque de l'image — d'où `width: auto` sur la balise
     plutôt qu'une boîte à `aspect-ratio`, qui aurait obligé à déclarer
     le ratio de chaque fichier et à le maintenir à la main.

     Le débordement haut et bas est voulu : le fondu de .visual-bg le
     reprend et le logo s'efface aux deux bords comme le reste.

     brightness un cran plus bas que les affiches (0,50 contre 0,60) :
     un logo est un aplat, il n'a pas le bruit d'une photographie et
     ressort donc plus fort à luminosité égale. */
  /* Cartouche blanc, sur TOUTE la carte. Sans lui, les logos ajourés
     — Improvidence, Le Complexe, le médaillon de l'Institut Lumière —
     posaient leurs traits sombres sur un fond sombre et se lisaient
     mal ; Les Subsistances, dont le fichier porte déjà son fond blanc,
     faisaient exception et rompaient l'unité. Le cartouche met les
     salles sur le même pied et rend au logo le support pour lequel il a
     été dessiné : du papier.
     Étant dans .visual-bg, il hérite du fondu haut/bas de la carte : le
     blanc s'éteint aux deux bords comme le reste du visuel.
     C'est LUI qui porte le filtre, et non la marque : un filtre
     s'applique à tout son sous-arbre, si bien que le blanc du cartouche
     et celui qu'un fichier contient déjà — Les Subsistances — subissent
     rigoureusement le même traitement. Les filtrer séparément aurait
     demandé de pré-calculer la valeur du blanc filtré, et le moindre
     écart aurait dessiné un rectangle visible autour de la marque.
     Le filtre fait de ce calque le bloc conteneur de la marque qu'il
     entoure, laquelle se centre donc sur la carte. */
  .visual-bg .logo-plate {
    position: absolute;
    inset: 0;
    background: #fff;
    /* 0,40 et non 0,50 : la trame sérigraphie assombrissait le cartouche
       d'un quart en plus du filtre, et son retrait l'aurait éclairci
       d'autant. La valeur rendue est donc la même qu'avant, sans le grain. */
    filter: brightness(0.40) contrast(1.06);
  }
  .visual-bg .logo-img {
    position: absolute;
    inset: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    height: var(--k, 150%);
    width: auto;
    object-fit: contain;
    object-position: center;
    /* Le filtre des AFFICHES doit être annulé ici, pas seulement omis :
       .visual-bg img porte brightness(0.60), qui s'ajouterait à celui du
       cartouche et descendrait la marque à 0,30 — deux fois trop sombre.
       C'est le cartouche, et lui seul, qui filtre ce sous-arbre. */
    filter: none;
  }
  /* Repli typographique, pour les salles dont on n'a pas la marque.
     Il vit DANS le même cartouche que les logos, et hérite donc du même
     filtre : aucun blanc à recalculer, aucun raccord à ajuster. C'est ce
     qui garantit qu'aucune carte groupée d'un lieu scrappé ne retombe
     sur l'enseigne nue — y compris pour les salles qu'on scrappera
     demain, sans fichier à fournir.
     Bungee est la fonte d'affiche du site, déjà chargée par le wordmark :
     rien de plus à télécharger. */
  .visual-bg .logo-mot {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 9%;
    margin: 0;
    font-family: 'Bungee', system-ui, sans-serif;
    font-weight: 400;
    /* Le corps vient du JS : il dépend de la longueur du nom. */
    font-size: var(--fs, 30px);
    line-height: 1.02;
    letter-spacing: 0.005em;
    text-align: center;
    text-transform: uppercase;
    /* Noir, comme l'encre d'un logo : le cartouche l'éclaircit ensuite
       exactement comme il éclaircit une marque. */
    color: #000;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  /* L'enseigne reste dans le DOM sous le logo, mais éteinte : si le
     fichier manque, l'onerror retire la classe et elle reprend sa place.
     C'est l'invariant du site — la couche de secours est toujours là —
     appliqué à un visuel local plutôt qu'à une affiche distante. */
  .visual-bg.has-logo > svg { display: none; }

  /* Le contenu passe au-dessus de la couche visuelle.
     .event-list en fait partie, et son absence était un bug : une boîte
     NON positionnée se peint sous une boîte qui l'est, quel que soit
     l'ordre du DOM. La liste des cartes groupées passait donc derrière
     le .visual-bg, sur les 275 cartes concernées. Invisible tant que le
     visuel restait sourd — l'enseigne plafonne à 0,18 d'opacité — mais la
     ligne restait dessous. */
  .event-head, .event-title, .event-list, .event-foot { position: relative; }
  /* Le nom du lieu et son arrondissement sont la première ligne du bloc
     de texte, donc les seuls à border encore l'affiche — le titre et le
     pied sont plus bas, là où le visuel a disparu. Deux ombres plutôt
     qu'une : une courte et opaque qui détache la lettre, une large et
     diffuse qui creuse un halo dans l'image. Voiler l'affiche davantage
     aurait coûté sa couleur à toute la carte pour protéger une ligne. */
  .event-venue, .event-arr, .event-time {
    text-shadow: 0 1px 2px rgba(13,19,23,1), 0 0 10px rgba(13,19,23,.9);
  }
  .event-title { text-shadow: 0 1px 8px rgba(13,19,23,.8); }

  /* Row 1: header (venue + time) — using inline-block layout instead of flex
     to avoid baseline-alignment height bugs in grid cells */
  .event-head {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;       /* center, not baseline — baseline causes height calc bugs */
    gap: 12px;
    min-width: 0;
    line-height: 1.25;
    /* Force a stable, predictable height regardless of flex quirks */
    height: 18px;
    flex: 0 0 auto;
  }
  .event-venue {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    /* Teinte de la catégorie, posée par --t sur la carte. Repli en crème
       si la variable manque — une carte rendue hors du feed, par exemple. */
    color: var(--ink);
    color: var(--t, var(--ink));
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 700;
    line-height: 1.25;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Micro-étiquette FILAIRE, posée sur l'affiche : cadre seul, aucun fond.
     Le fond translucide qu'elle portait faisait une pastille sombre au
     milieu de l'image ; l'ombre portée de la ligne suffit à la détacher.
     Corps porté de 8,5 à 9,5 px : sous 9 px, des capitales monospace
     interlettrées passent sous le seuil de confort de lecture, et cette
     étiquette est le plus petit texte de la carte.
     Elle se cale d'elle-même contre le bord droit : .event-venue est en
     flex:1 et occupe donc tout l'espace libre à sa gauche. */
  .event-arr {
    font-family: 'JetBrains Mono', monospace;
    /* Aligne sur les LETTRES du pied : même corps de 10 px, mêmes
       minuscules, même interlettrage. « villeurbanne » et « autre » se
       lisent donc exactement comme « café-théâtre » deux lignes plus bas,
       et le chiffre de « 1er » y dépasse la hauteur d'x comme un chiffre
       dans une phrase — c'est la relation normale de la fonte, pas
       l'écart de calibre que corrigeait le pied.
       Interligne verrouillé à 14 px : le cadre fait alors 18 px, la
       hauteur exacte de la rangée du lieu. Les étiquettes du pied en font
       19 grâce à leur interligne de 15 ; ce pixel d'écart ne se voit pas,
       les deux cadres n'étant jamais sur la même ligne. */
    font-size: 10px;
    line-height: 14px;
    color: var(--ink);
    letter-spacing: 0.1em;
    text-transform: lowercase;
    font-weight: 400;
    flex-shrink: 0;
    white-space: nowrap;
    border: 1px solid rgba(231, 223, 190, 0.32);
    border-radius: 2px;
    padding: 1px 5px;
  }
  /* Crème et sans graisse, comme l'étiquette d'arrondissement : l'heure
     tombe désormais au même pixel sur toutes les cartes et n'a plus
     besoin d'une couleur pour se faire trouver — la position suffit. Le
     tan gras d'avant en faisait le point le plus vif du pied, alors que
     ce qui doit gagner là est le nom de la catégorie, en teinte.
     tabular-nums garde les chiffres sur la même largeur, sans quoi la
     colonne d'heures se déformerait de carte en carte. */
  .event-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    color: var(--ink);
    font-weight: 400;
    white-space: nowrap;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    /* Son filet est déclaré plus bas, après la boîte commune aux
       étiquettes : celle-ci pose `border: 1px solid transparent` et vit
       après cette règle-ci, si bien qu'à spécificité égale elle gagnait. */
  }
  .event-time.empty {
    color: var(--ink-mute);
    font-weight: 400;
  }

  /* Row 2: title fills available space, vertically centered.
     Bricolage Grotesque en variable, poids 300 — validé sur maquette.
     line-clamp propre avec ellipsis, au lieu de la coupe nette que
     produisait max-height. */
  .event-title {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    /* La graisse doit être portée par les DEUX propriétés : sur une police
       variable, font-variation-settings l'emporte sur font-weight, et ne
       changer que la seconde n'aurait aucun effet visible.
       opsz suit le corps rendu, c'est le rôle de cet axe — le laisser à 16
       pour un texte composé à 21 px appliquerait la compensation optique
       d'un corps plus petit, donc des pleins trop appuyés. */
    font-variation-settings: 'opsz' 22, 'wght' 600;
    font-weight: 600;
    font-size: 22px;
    line-height: 1.08;
    /* 1 px seulement : la boite du lieu et celle du titre apportent deja
       8,4 px de vide entre leurs encres. */
    margin: 2px 0 0;
    letter-spacing: -0.022em;
    /* Le seul élément blanc de la carte, et le seul que la teinte de
       catégorie ne touche pas : c'est ce qui le maintient au-dessus du
       lieu et du pied, tous deux colorés. */
    color: #fff;
    text-wrap: balance;
    /* Deux lignes, jamais trois : au-delà, coupe et points de suspension.
       Le clamp les dessine lui-même. Trois lignes tenaient dans la carte
       — 76 px pour 84 disponibles — mais un titre de trois lignes en
       22 px devenait le seul objet de la carte et écrasait tout le reste ;
       et les rares titres si longs sont des phrases d'agrégateur qu'une
       coupe résume mieux qu'un pavé. */
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    align-self: center;
  }
  .event-title.placeholder {
    color: var(--ink-mute);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    font-style: normal;
    letter-spacing: 0.06em;
  }

  /* Row 3: footer.
     flex-end plutôt que space-between : la catégorie est masquée quand elle
     est vide (:empty ci-dessous), et space-between recollait alors le groupe
     source + durée à GAUCHE — d'où des cartes dont le bas ne s'alignait pas
     sur les autres. Avec flex-end le groupe de droite est ancré à droite en
     toutes circonstances, et la catégorie, quand elle existe, est repoussée
     à gauche par son margin-right auto. */
  .event-foot {
    display: flex;
    justify-content: flex-end;
    /* CENTRAGE des boîtes, et non alignement des lignes de base.
       C'est contre-intuitif et c'est mesuré. JetBrains Mono a une
       ascendante moins une descendante (1,02 − 0,30) égale à sa hauteur
       de capitale (0,73) : dans une boîte de ligne centrée, le milieu
       des capitales tombe donc exactement au milieu de la boîte, quel
       que soit le corps. Centrer aligne du même coup les CADRES des
       étiquettes, dont la boîte est symétrique autour de leur texte.
       Mesuré sur un pied portant les quatre éléments — centres d'encre
       à 0,75 px près et cadres à 0,25 px du texte, contre 1,5 px pour
       les deux en alignant les bases. Aligner les bases égalise ce que
       l'œil ne lit pas et désaligne ce qu'il lit : les cadres.
       min-height tient la rangée pour qu'elle ne dépende pas des
       étiquettes présentes. */
    align-items: center;
    min-height: 19px;
    /* Douze pixels, dont le filet occupe le milieu : l'encre du titre se
       retrouve alors a 10,0 px du filet, contre 9,4 px entre le lieu et
       le titre. Les deux ecarts se lisent enfin comme un seul rythme. */
    margin-top: 11px;
    gap: 8px;
    /* Indispensable pour que l'ellipse de .event-cat se déclenche : en tant
       qu'élément de grille, ce pied a un min-width:auto qui l'empêche de
       descendre sous sa largeur min-content. Comme la catégorie est en
       nowrap, cette min-content vaut son texte entier — le pied débordait
       donc de la carte au lieu de tronquer (« Art contemporain et
       numérique » à La Salle de bains, 385 px dans une piste de 354). */
    min-width: 0;
    /* L'ancrage en bas de carte vient d'ici : la rangée est le 3e track du
       grid .event (auto 1fr auto), align-self end la colle au padding bas. */
    align-self: end;
  }
  /* Filet de la teinte au-dessus du pied — le trait qui vient de la
     maquette E. Il est dessiné par un PSEUDO-ÉLÉMENT absolu, posé au
     milieu de la gouttière de 6 px, et non par un border-top sur le pied :
     une bordure et son padding auraient coûté 9 px de hauteur, or la
     piste centrale n'a que 2,6 px de marge pour ses quatre lignes de
     carte groupée (cf. le calcul de GROUP_MAX_LINES). Le filet ne prend
     donc aucune place et la géométrie de la carte reste celle qui est
     documentée plus haut.
     Deux déclarations : color-mix() est refusé par les navigateurs
     d'avant 2023, qui gardent alors le crème translucide. */
  .event-foot::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: -6px;
    border-top: 1px solid rgba(231, 223, 190, 0.20);
    border-top: 1px solid color-mix(in srgb, var(--t, #e7dfbe) 55%, transparent);
  }
  /* Dix pixels pour les LETTRES du pied, huit pour ses CHIFFRES : dans
     JetBrains Mono, un chiffre mesure 0,75 em d'encre contre 0,55 em pour
     la hauteur d'x d'une minuscule, soit un rapport de 1,36 à corps égal.
     Les corps d'origine — 9 px pour la catégorie, 11 px pour l'heure —
     portaient l'écart à 1,67 : l'heure faisait une fois deux tiers la
     hauteur de la catégorie, et se lisait comme un autre calibre.
     Dix et huit donnent 5,50 px et 6,00 px d'encre, un rapport de 1,09.
     Composer les chiffres plus petits que les lettres est le seul moyen
     d'obtenir la même taille APPARENTE : la fonte n'offre pas de chiffres
     elzeviriens, qui l'auraient réglé sans y toucher — vérifié, la
     propriété font-variant-numeric: oldstyle-nums n'y change rien. */
  .event-cat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    color: var(--t, var(--ink-soft));
    text-transform: lowercase;
    letter-spacing: 0.1em;
    /* Repousse le groupe source + durée contre le bord droit. */
    margin-right: auto;
    /* Le pied doit tenir sur UNE ligne : certains libellés du Petit
       Bulletin sont très longs (« atelier · musique · cinéma · exposition
       · rencontre · arts visuels ») et passaient sur deux lignes, ce qui
       doublait la hauteur de la rangée et laissait les badges flotter au
       milieu au lieu d'être collés en bas. Tronqué plutôt que replié. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .event-cat:empty { display: none; }
  /* Boîte commune aux deux étiquettes du pied.
     `inline-block` et non `inline-flex` : la base d'une boîte en ligne est
     celle de son texte, si bien que l'align-items:baseline du pied aligne
     les quatre éléments sur une seule ligne de base. Un inline-flex de
     hauteur fixe, comme ici avant, définit sa base depuis son propre
     centrage interne — elle ne dépendait donc plus de la rangée, et les
     quatre corps de texte du pied (8, 9, 9,5 et 11 px) posaient leurs
     bases sur 1,8 px d'écart : c'était le décalage visible en bas de
     carte. L'interligne commun de 13 px et le padding symétrique donnent
     aux deux étiquettes la même hauteur de cadre, ce que la hauteur fixe
     garantissait avant.
     Cette règle doit précéder les deux suivantes, qui la surchargent. */
  .event-run,
  .event-source,
  .event-time {
    display: inline-block;
    box-sizing: border-box;
    /* Rembourrage et rayon repris au caractère près de .event-arr :
       l'heure encadrée devait ressembler à l'étiquette d'arrondissement,
       et les trois étiquettes du pied lui ressemblent donc aussi. Un
       pixel de moins de chaque côté qu'avant, soit six par carte rendus
       à la catégorie — le seul élément du pied qui se tronque. */
    padding: 1px 5px;
    /* 15 px : la catégorie, désormais la plus grande du pied avec ses
       10 px, a 13,2 px de hauteur de contenu. À 13 px d'interligne elle
       aurait touché son filet. Les quatre étiquettes gardent ainsi le même
       cadre de 19 px, ce qui est toute la raison d'être de cette règle. */
    line-height: 15px;
    border: 1px solid transparent;
    border-radius: 2px;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
  }
  /* Même filet crème que l'étiquette d'arrondissement : l'heure est de la
     même nature qu'elle — une coordonnée, pas une description. Sélecteur
     à deux classes pour l'emporter sur la boîte commune ci-dessus quel que
     soit l'ordre des règles. */
  .event-foot .event-time { border-color: rgba(231, 223, 190, 0.32); }
  /* Un tiret encadré dirait qu'on sait quelque chose. */
  .event-foot .event-time.empty {
    border-color: transparent;
    padding-left: 0;
    padding-right: 0;
  }
  /* « jusqu'au 18/10 » et « dernier » prennent exactement l'habit de
     l'étiquette d'arrondissement : même corps, même crème, même filet,
     aucune graisse. Ce sont deux annotations de même nature — un cadre
     où le lieu et le calendrier se situent — et le corail les faisait
     crier plus fort que le titre qu'elles annotent. */
  .event-run {
    font-size: 8px;
    text-transform: lowercase;
    color: var(--ink);
    letter-spacing: 0.1em;
    border-color: rgba(231, 223, 190, 0.32);
    font-weight: 400;
  }
  .event-foot-right {
    display: inline-flex;
    /* Même centrage que le pied qui le contient, sans quoi ce conteneur
       intermédiaire réalignerait ses trois enfants entre eux. */
    align-items: center;
    gap: 6px;
    /* Jamais comprimé par une catégorie longue : c'est elle qui se tronque. */
    flex-shrink: 0;
  }
  /* VARIANTE A — la catégorie encadrée comme les trois autres étiquettes.
     Même rembourrage, même interligne, même rayon, donc le même cadre de
     19 px ; le filet prend la teinte à 45 %, comme celui de la provenance,
     puisque tous deux disent ce QU'EST l'événement là où l'arrondissement
     et l'heure le situent en crème.
     Cette règle vient APRÈS .event-cat et compte deux classes : elle doit
     l'emporter sur le display du bloc d'origine sans le réécrire.
     Le coût mesuré est nul depuis que la provenance est un sigle : deux
     catégories tronquées sur 3104 aux largeurs courantes, quatre au plus
     étroit du bureau, contre deux — c'était 489 avant le sigle. */
  .event-foot .event-cat {
    display: inline-block;
    box-sizing: border-box;
    padding: 1px 5px;
    line-height: 15px;
    border: 1px solid transparent;
    border-color: rgba(165, 159, 134, 0.34);
    border-color: color-mix(in srgb, var(--t, #a59f86) 45%, transparent);
    border-radius: 2px;
  }
  /* Sans quoi une catégorie vide dessinerait un cadre vide : la règle
     .event-cat:empty plus haut est battue par le display ci-dessus. */
  .event-foot .event-cat:empty { display: none; }

  /* La provenance prend la teinte de la carte, sans cadre ni fond : le
     vert olive et le brun qu'elle portait étaient les deux seules
     couleurs de la carte à ne rien devoir à sa catégorie, et ils
     tiraient l'œil vers l'agrégateur plutôt que vers l'événement.
     Le pied se lit donc maintenant en trois registres : la teinte pour ce
     qui décrit l'événement — sa catégorie, sa source —, le crème encadré
     pour ce qui le situe — arrondissement, échéance —, le crème nu pour
     l'heure. Le nom de la source reste écrit en clair : la couleur ne
     distingue plus les deux agrégateurs, le mot s'en charge. */
  .event-source {
    font-size: 10px;
    text-transform: lowercase;
    letter-spacing: 0.1em;
    font-weight: 400;
    color: var(--ink-soft);
    color: var(--t, var(--ink-soft));
    /* Cadre de la teinte, un cran plus discret que celui des étiquettes
       en crème : à 45 % il encadre sans peser, là où l'échéance et
       l'arrondissement sont à 32 % d'un crème bien plus clair. C'est ce
       qui garde les deux registres distincts alors que les trois
       étiquettes ont maintenant toutes un cadre. */
    border-color: rgba(165, 159, 134, 0.34);
    border-color: color-mix(in srgb, var(--t, #a59f86) 45%, transparent);
  }

  /* ---------- carte groupée : plusieurs événements, même lieu, même jour ----------
     Elle occupe exactement la même case que les autres (160 px, cf.
     .events grid-auto-rows) et se déplie au clic en une carte par
     événement. Le regroupement se fait au RENDU et après filtrage : une
     grappe peut mêler des catégories, grouper avant filtrerait de travers. */
  button.event {
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    /* Le bouton natif impose ses propres marges et fond, que la règle
       .event ne couvre pas toutes. */
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  button.event:focus-visible {
    outline: 2px solid var(--ink-soft);
    outline-offset: 2px;
  }
  .event-list {
    display: grid;
    /* Meme pouce que le titre, dont cette liste prend la place. */
    margin-top: 2px;
    row-gap: 3px;
    align-self: center;
    min-height: 0;
  }
  .event-line {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    /* Rangée verrouillée à 18 px. Deux pièges sinon : sans line-height
       explicite chaque corps de texte impose le sien, et avec un
       align-items:baseline le décalage de ligne de base entre le titre en
       14 px et l'horaire en 10,5 px ajoutait 2 px par rangée — quatre
       lignes réclamaient alors 89 px pour une piste de 83,6, ce qui
       poussait le pied hors de la carte. */
    line-height: 18px;
  }
  /* Les titres d'une carte groupée sont en BLANC, comme le titre d'une
     carte simple : ils en tiennent exactement le rôle, et le crème les
     mettait un cran en dessous du reste alors qu'ils sont l'information.
     Seule la ligne de report « + N autres » reste sourde. */
  .event-line .t {
    font-size: 14px;
    font-weight: 300;
    color: #fff;
    line-height: inherit;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .event-line .t.more { color: var(--ink-mute); }
  /* Colonne des heures d'une carte groupée : en teinte de catégorie, et
     non en corail. Elle est le seul élément coloré à l'intérieur du bloc
     de titres — c'est ce qui fait tenir la grappe comme un ensemble
     plutôt que comme quatre lignes empilées. */
  .event-line .h {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--t, var(--hot));
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    line-height: inherit;
  }
  /* Bloc d'un groupe déplié : les cartes ouvertes et leur bouton de repli,
     cerclés d'un filet corail.
     Il occupe des RANGÉES ENTIÈRES (grid-column 1/-1), sans quoi le cadre
     serait impossible : on ne peut pas encadrer un sous-ensemble
     d'éléments de grille susceptible de déborder sur deux rangées.
     Conséquence assumée : le groupe démarre sur une nouvelle ligne et
     laisse un vide derrière lui si la rangée précédente n'était pas
     pleine — ce vide marque d'ailleurs qu'un dépliage a eu lieu.
     Le filet est un OUTLINE et non une bordure : il ne prend aucune place
     dans la mise en page et se dessine dans la gouttière, si bien que les
     colonnes du bloc restent alignées au pixel près sur celles de la
     grille autour. Une bordure, avec son remplissage, aurait rétréci les
     cartes contenues par rapport aux autres.
     Le corail plutôt qu'une teinte de catégorie : il sert déjà aux
     filtres cochés, donc il se lit comme un signal d'interface — et il
     reste constant, là où une teinte suivrait la catégorie des cartes
     qu'il encadre et se confondrait avec l'une d'elles. */
  /* Le corps d'une journée empile des conteneurs : .events pour les cartes
     ordinaires, .group-block pour un groupe déplié. Le bloc est un FRÈRE
     de .events et non un élément à l'intérieur — placé dans la grille, il
     aurait été enfermé dans une rangée de 160 px (grid-auto-rows) et son
     contenu, qui occupe deux rangées dès quatre cartes, aurait débordé.
     Un grid-row:span aurait dépendu du nombre de colonnes, donc du
     viewport ; en sortir le bloc règle le cas par construction. */
  .day-body {
    display: grid;
    gap: 12px;
  }
  /* Sections par famille, sur les seules journées denses. Le titre est un
     filet à gauche duquel s'inscrit le nom : assez présent pour découper,
     assez discret pour ne pas concurrencer la barre de journée, qui reste
     le repère principal du fil. */
  .fam-section + .fam-section { margin-top: 20px; }
  .fam-titre {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .fam-titre .ft-n {
    font-size: 9.5px;
    color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
  }
  .fam-titre::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rule);
  }
  /* Le bloc est une pile verticale : la grille des cartes ouvertes, puis
     la barre de repli. Le filet est une BORDURE et non un outline décalé.
     L'outline avait l'avantage de ne prendre aucune place, donc de garder
     les colonnes du bloc rigoureusement alignées sur celles d'à côté —
     mais il se dessinait à 7 px À L'EXTÉRIEUR du bloc, lequel occupe
     toute la largeur de la journée. Or .day porte content-visibility:auto,
     qui implique une containment de peinture : tout ce qui déborde de la
     boîte de la journée est rogné. Les montants gauche et droit étaient
     donc invisibles, seuls le haut et le bas passaient.
     La bordure reste à l'intérieur et se ferme sur les quatre côtés. Elle
     coûte 18 px de largeur utile, soit environ 6 px par colonne sur trois
     colonnes : les cartes encadrées sont très légèrement plus étroites
     que les autres, ce qui se lit comme un encart plutôt que comme un
     défaut d'alignement. */
  .group-block {
    display: grid;
    gap: 10px;
    border: 1px solid var(--hot);
    border-radius: var(--radius);
    padding: 8px;
    margin: 6px 0;
  }

  /* Bouton de repli : une barre pleine largeur au pied du bloc. Il était
     auparavant une case de la grille des cartes, donc haut de 160 px —
     un grand rectangle vide dès que le nombre de cartes ne remplissait
     pas sa dernière rangée. Sorti de cette grille, il reprend la hauteur
     d'un vrai contrôle. Teinté de corail comme le filet du bloc, pour
     qu'on lise les deux comme un même objet. */
  .collapse-card {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 40px;
    background: rgba(224, 141, 112, 0.07);
    border: 0;
    border-radius: var(--radius);
    color: var(--ink-soft);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .collapse-card:hover {
    color: var(--ink);
    background: rgba(224, 141, 112, 0.14);
  }
  .collapse-card:focus-visible {
    outline: 2px solid var(--ink-soft);
    outline-offset: 2px;
  }

  /* Subtitle removed from main grid layout — too noisy in compact cards.
     Keep style for if we re-enable later. */
  .event-subtitle {
    display: none;
  }

  /* ---------- empty state ---------- */
  .empty-state {
    text-align: center;
    padding: 100px 24px;
    color: var(--ink-soft);
  }
  .empty-state p {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-variation-settings: 'opsz' 32, 'wght' 300;
    font-size: 30px;
    color: var(--ink);
  }
  .empty-state p::before { content: "( "; color: var(--ink-mute); }
  .empty-state p::after { content: " )"; color: var(--ink-mute); }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--rule);
    padding: 32px 0 48px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  footer .container {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: end;
  }
  footer .col { line-height: 1.7; }
  footer .col-right { text-align: right; }
  footer a { color: var(--ink-soft); text-decoration: none; }
  footer a:hover { color: var(--ink); }
  footer .ind {
    color: var(--warm);
    margin-right: 4px;
  }

  /* ---------- mobile ---------- */
  /* Durée du fondu au changement de filtre ; neutralisé plus bas si
     l'utilisateur demande moins d'animations. */
  ::view-transition-old(root), ::view-transition-new(root) {
    animation-duration: 0.26s;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  @media (max-width: 720px) {
    .filter-row { gap: 6px 10px; }
    .filter-label { flex: 0 0 100%; margin-bottom: 4px; min-width: 0; }

    /* La carte garde sa hauteur de 160 px sur téléphone.
       Elle passait en hauteur libre, empilée en flex : les cartes
       mesuraient alors de 94 à 151 px selon la longueur de leur titre, le
       fil perdait son quadrillage, et la bande d'affiche se réduisait à
       une lisière sur les cartes courtes — or c'est elle qui porte la
       carte A. En rendant la rangée fixe, tout le modèle du bureau
       s'applique tel quel : même grille, même align-content:end, mêmes
       marges. Il ne reste ici que ce qui doit VRAIMENT changer avec la
       taille de l'écran — le rembourrage, le nom du lieu, la cible
       tactile du bouton de repli.
       Conséquence assumée : un titre de plus de deux lignes se coupe sur
       téléphone comme sur bureau, là où la hauteur libre le laissait
       courir. C'est le prix du quadrillage. */
    .events, .group-cards, .day-body {
      gap: 10px;
    }
    .event {
      padding: 12px 16px 11px;
    }
    .event-venue {
      font-size: 11px;
      letter-spacing: 0.12em;
    }
    /* Le bouton de repli n'a plus de rangée fixe à respecter : il redevient
       un simple bandeau, au lieu d'une case fantôme de 160 px. */
    .collapse-card {
      min-height: 44px;
      padding: 10px;
    }
    /* Le titre garde le corps du bureau : la carte a la même hauteur, il
       n'y a plus de raison de le régler séparément. */
    .event-title.placeholder {
      font-size: 10px;
    }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="container">
    <h1 class="wordmark"><span class="ast">*</span>nocturne</h1>
  </div>
</header>

<nav class="filters" id="filters">
  <div class="container">

    <!-- Rangée toujours visible : recherche + temps + bouton du tiroir.
         Les filtres secondaires (où / arr. / type) sont repliés par
         défaut — ils occupaient trois rangées avant même le premier
         événement. -->
    <div class="filter-row primary">
      <div class="filter-search-wrap">
        <input class="filter-search" id="filterSearch" type="search"
          placeholder="lieu, artiste ou événement" autocomplete="off" spellcheck="false">
        <button class="filter-search-clear" id="filterSearchClear" aria-label="effacer">✕</button>
      </div>
      <button class="chip drawer-toggle" id="drawerToggle" type="button"
              aria-expanded="false" aria-controls="filterDrawer">+ filtres</button>
      <div class="filter-group" id="filterWhen">
        <button class="chip active" data-when="all">tout</button>
        <button class="chip" data-when="weekend">ce weekend</button>
        <button class="chip" data-when="nextweek">semaine pro</button>
        <span class="datepicker-wrap">
          <button class="chip" id="dateBtn" type="button">date →</button>
          <div class="datepicker" id="datepicker"></div>
        </span>
      </div>
    </div>

    <div class="filter-drawer" id="filterDrawer" hidden>
      <div class="filter-row">
        <span class="filter-label">arr.</span>
        <div class="filter-group" id="filterArr"></div>
        <button class="clear-link" id="clearFilters">tout effacer</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">lieux</span>
        <div class="filter-liste" id="filterLieux"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">tags</span>
        <div class="filter-liste" id="filterTags"></div>
      </div>
    </div>

  </div>
</nav>

<!-- Bandeau de jours : les 14 prochaines dates avec leur nombre
     d'événements, cliquables pour y sauter. « Qu'est-ce qu'il y a ce
     soir » est la question centrale du site. -->
<nav class="daystrip-wrap">
  <div class="container">
    <div class="daystrip" id="daystrip"></div>
  </div>
</nav>

<main class="feed">
  <div class="container" id="feed"></div>
</main>

<footer>
  <div class="container">
    <div class="col">
      <div><span class="ind">§</span> données scrapées sur les sites des lieux</div>
      <div><span class="ind">§</span> <span id="footerIndex">—</span> événements ·
           <span id="footerVenues">—</span> lieux · 17 sources</div>
      <div><span class="ind">§</span> dernière mise à jour <span id="lastUpdated">—</span></div>
    </div>
    <div class="col col-right">
      <div><a href="https://github.com/Ricojrlyon/nocturne-lyon" target="_blank" rel="noopener">code source ↗</a></div>
      <div>lyon · mmxxvi</div>
    </div>
  </div>
</footer>

<script>
const FR_DAYS_FULL = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const FR_DAYS_SHORT = ['dim','lun','mar','mer','jeu','ven','sam'];
const FR_MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* ---------- venue groups ---------- */
const VENUE_GROUPS = [
  { name: 'spectacles & musiques', venues: ['La Halle Tony Garnier', 'Bourse du Travail', 'Radiant-Bellevue', "Agend'arts", 'Big White', 'LDLC Arena'] },
  { name: 'soirée',                venues: ['Le Sucre', 'Le Petit Salon', 'Le Transbordeur', 'La Rayonne', 'La Marquise'] },
  { name: 'concerts',              venues: ['Marché Gare', 'Le Sonic', 'Le Périscope', 'Toï Toï le Zinc', "L'Épicerie Moderne", "A Thou Bout d'Chant", "Bar Rock'n Eat"] },
  { name: 'lieux hybrides',        venues: ['La Commune', 'HEAT', 'Les Subsistances', 'Grrrnd Zero', 'Boskop', "Maison de l'écologie"] },

   étroite ; les entrées ci-dessous, vérifiées à la main, gagnent.
   Le Théâtre de La Renaissance y est parce que Nominatim ne le connaît

   sans qu'on sache laquelle accueille quelle date. Doit rester identique
   à OFFSITE_PLUSIEURS dans scrapers/base.py. */
const OFFSITE_PLUSIEURS = '·ailleurs';

/* La salle où l'on VA, qui n'est pas toujours celle qui programme :
   l'Opéra donne des concerts Salle Molière et au Théâtre de La
   Renaissance. `venue` reste celui qui programme — il groupe les cartes,
   tient le filtre par lieu et donne le logo. */
function lieuEffectif(e) {
  return (e.offsite_venue && e.offsite_venue !== OFFSITE_PLUSIEURS)
    ? e.offsite_venue : e.venue;
}

/* L'arrondissement est celui de la salle où l'on va. Un concert de
   l'Opéra donné Salle Molière sort donc quand on filtre le 5e, et non
   quand on filtre le 1er : le filtre répond à « qu'est-ce qui se passe
   dans le 5e ce soir », pas à « qui le programme ».
   Une production qui tourne dans plusieurs salles tombe dans « Autre » —
   la seule réponse qui ne soit pas fausse un soir sur deux. */
function eventArrondissement(e) {
  if (e.offsite_venue === OFFSITE_PLUSIEURS) return 'Autre';
  return VENUE_ARRONDISSEMENT[lieuEffectif(e)] || 'Autre';
}

   l'arrondissement ; pour un événement hors les murs, ce qu'on sait de
   plus précis sur l'endroit :

     salle géocodée hors Lyon      → sa commune, « saint-priest »
     salle introuvable, ou plusieurs → « ailleurs »
   « ailleurs » plutôt que « autre » : le second est un fourre-tout
   géographique que portent déjà Bron ou Dardilly, le premier dit que
   l'événement n'est pas chez celui qui l'affiche. */
function etiquetteLieu(e) {
  if (!e.offsite_venue) return eventArrondissement(e);
  if (e.offsite_venue === OFFSITE_PLUSIEURS) return 'ailleurs';
  const arr = VENUE_ARRONDISSEMENT[e.offsite_venue];
  if (arr && arr !== 'Autre') return arr;
  return VENUE_COMMUNE[e.offsite_venue] || 'ailleurs';
}

const TYPE_BUCKETS = [
  // Music sub-genres FIRST (order matters: first regex match wins).
  // The previous single "musique" bucket was too broad; with aggregators
  // bringing in 100+ events per scrape, having sub-genres is essential.
  { key: 'club',        label: 'club',        match: /\belectro|techno|house|trance|drum.?n.?bass|\bdnb\b|\bdj\b|soir[ée]e|club\b|clubbing|after/i },
  { key: 'jazz',        label: 'jazz',        match: /\bjazz|\bblues|\bswing\b|\bimpro\b/i },
  { key: 'rock',        label: 'rock & pop',  match: /\brock\b|\bpop\b|m[ée]tal|punk\b|indie|garage\b|hardcore/i },
  // 'rap' BEFORE 'chanson' so "Hip Hop / Rap" doesn't get caught by chanson's
  // \brap\b leftover (which has now been removed). Trap is rare but distinct.
  { key: 'rap',         label: 'rap',         match: /\brap\b|hip[\s-]?hop|\btrap\b|\brnb\b|\br&b\b/i },
  { key: 'chanson',     label: 'chanson',     match: /chanson|\bfolk\b|country|francophone|slam\b|po[ée]sie/i },
  // 'reggae' BEFORE 'monde' since reggae sometimes gets bundled under 'world music'.
  { key: 'reggae',      label: 'reggae',      match: /reggae|\bdub\b|\bska\b|dancehall|rocksteady/i },
  { key: 'classique',   label: 'classique',   match: /classique|symphon|op[ée]ra|musique\s*sacr|musique\s*de\s*chambre|baroque/i },
  { key: 'monde',       label: 'monde',       match: /sono\s*mondiale|fado|musique\s*du\s*monde|\bworld\b|tradition|flamenco|tango|fanfare/i },
  // 'atelier' BEFORE the 'musique' catch-all so "Atelier de musique" goes to
  // atelier rather than musique.
  { key: 'atelier',     label: 'atelier',     match: /atelier|workshop|stage\s+de|masterclass|formation/i },
  // Generic music catch-all (for events tagged just "concert" or "musique"
  // without specifying a subgenre). Comes AFTER the specific genres.
  { key: 'musique',     label: 'musique',     match: /musique|concert|\bsoul\b|\bfunk\b|\bdisco\b/i },
  // Le sport. Placé avant le bloc non-musical parce que 'conference'
  // revendique « rencontre », qui est le mot français pour un match :
  // sans cette priorité, une « rencontre de basket » deviendrait une
  // conférence. Il n'y a aucune autre collision — aucune règle plus haut
  // ne nomme un sport —, la position est donc libre par ailleurs.
  // Le bucket est plus large que ce qu'on scrappe aujourd'hui : l'ASVEL
  // masculin est le premier club du fil, les suivants viendront avec
  // leurs mots à eux.
  { key: 'sport',       label: 'sport',       match: /basket|\bsport|rugby|\bfoot\b|football|handball|volley|hockey|athl[ée]tisme|\bnatation\b/i },
  // Non-music. humour BEFORE theatre because "Humour & Café Théâtre" must
  // go to humour (theatre regex would match the "Théâtre" substring).
  // Note: 'théâtre' has circumflex â, so the regex uses [aâ]tre to match
  // both "theatre" (no accent) and "théâtre" (with accent) variants.
  { key: 'humour',      label: 'humour',      match: /humour|stand[\s-]?up|one[\s-]?man|comedy|caf[ée][\s-]*th[ée][aâ]tre/i },
  { key: 'theatre',     label: 'théâtre',     match: /th[ée][aâ]tre|spectacle\s*musical|com[ée]die\s*musicale|cabaret/i },
  { key: 'danse',       label: 'danse',       match: /danse|ballet|cho[ré]graph/i },
  // Cirque, magie, drag, performance : de la scène qui n'est ni théâtre
  // ni danse ni humour. Placé APRÈS ces trois-là, plus précis — sinon
  // « spectacle musical » quitterait le théâtre pour venir ici.
  { key: 'spectacle',   label: 'spectacle',   match: /spectacle|cirque|magie|\bdrag\b|performance|marionnette/i },
  // Les disciplines plastiques que la taxonomie du Petit Bulletin nomme
  // sans jamais dire « exposition ». Elles ne remontaient pas avant : le
  // scraper les écartait. Depuis qu'il ne filtre plus, ces cent
  // événements iraient grossir « autres » faute de bucket, et le bouton
  // « expos » — qui justifie précisément d'avoir levé le filtre —
  // resterait vide.
  { key: 'expo',        label: 'expo',        match: /\bexpo|exposition|vernissage|installation|\bvisite|street\s*art|sculpture|art\s*graphique|peinture|dessin|art\s*contemporain|photograph|design|architecture/i },
  { key: 'cine',        label: 'ciné',        match: /cin[ée]ma|projection|s[ée]ance|documentaire|court[\s-]?m[ée]trage/i },
  { key: 'conference',  label: 'conférence',  match: /conf[ée]rence|rencontre|d[ée]bat|table\s*ronde|discussion|colloque|lecture|sciences/i },
  // Quiz, blind test, karaoké : ni musique ni scène, mais assez présents
  // pour mériter leur filtre. En dernier, aucun autre bucket ne les
  // revendiquant.
  { key: 'jeux',        label: 'jeux',        match: /\bjeux?\b|\bquiz+|blind\s*test|karaok|\bbingo\b|\bloto\b|\b[ée]checs?\b/i },

function bucketOf(rawCategory) {
  if (!rawCategory) return 'autre';
  for (const b of TYPE_BUCKETS) {
