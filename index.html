<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>*nocturne · lyon</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-16 -16 32 32'><g fill='%23d4a574'><rect x='-2' y='-13' width='4' height='26' rx='2'/><rect x='-2' y='-13' width='4' height='26' rx='2' transform='rotate(60)'/><rect x='-2' y='-13' width='4' height='26' rx='2' transform='rotate(120)'/></g></svg>">
<meta name="description" content="Guide nocturne — concerts, théâtre, danse, clubs à Lyon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #161f25;
    --bg-elev:      #1c272f;
    --bg-elev-2:    #243038;
    --ink:          #e7dfbe;        /* cream — main text */
    --ink-soft:     #a59f86;        /* faded cream — secondary */
    --ink-mute:     #5e6973;        /* muted blue-gray — tertiary */
    --rule:         #2a363f;        /* very subtle line */
    --rule-strong:  #3a4853;
    --accent:       #e7dfbe;        /* cream accent (same as ink) */
    --accent-glow:  rgba(231, 223, 190, 0.12);
    --warm:         #d4a574;        /* warm tan for badges/highlights */
    /* Corail adouci pour le badge de durée : l'ancien #ff6b4a, très saturé,
       criait plus fort que le titre de l'événement qu'il annote. Chroma
       divisée par deux, teinte conservée. --hot-line sert au filet, encore
       un cran en retrait pour que le contour n'appuie pas le texte. */
    --hot:          #e08d70;        /* coral adouci — durée / multi-jours */
    --hot-line:     rgba(224, 141, 112, 0.42);
    /* Angles très légèrement adoucis — validé sur maquette (3 px). */
    --radius:       3px;
    /* Teintes des motifs de secours, une par motif. Le vert et le rose
       partagent luminosité et chroma ; l'orange est volontairement plus
       foncé (0.62 au lieu de 0.72), avec une chroma remontée d'un cran
       car un orange assombri à chroma constante vire au brun terne. */
    --motif-vert:   oklch(0.72 0.12 150);
    --motif-rose:   oklch(0.72 0.12 350);
    --motif-orange: oklch(0.62 0.13 52);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter Tight', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
    font-feature-settings: 'ss01' on, 'cv11' on;
  }
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px;
  }
  @media (max-width: 720px) {
    .container { padding: 0 20px; }
  }

  /* ---------- type primitives ---------- */
  .mono {
    font-family: 'JetBrains Mono', monospace;
    font-feature-settings: 'ss03' on;
  }

  /* ---------- masthead : bloc plein ----------
     Le wordmark vit dans un bloc crème, texte en négatif (device
     emprunté à Aspen Search / State of AI). Rien à côté : le relevé de
     données a été retiré, il n'apportait pas d'information utile et
     s'empilait mal sur téléphone. */
  header.masthead {
    border-bottom: 1px solid var(--rule-strong);
  }
  /* Le conteneur garde le padding standard (32 px, 20 px sur mobile) :
     le bord gauche du bloc crème s'aligne ainsi exactement sur le reste
     du contenu — filtres, bandeau de jours, cartes. */
  .masthead .container {
    display: flex;
    align-items: stretch;
  }
  .wordmark {
    margin: 0;
    background: var(--ink);
    color: var(--bg);
    font-family: 'Bungee', system-ui, sans-serif;
    font-size: 20px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.01em;
    padding: 13px 22px 12px;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }
  .wordmark .ast {
    color: var(--warm);
    animation: ast-pulse 3.6s ease-in-out infinite;
  }
  @keyframes ast-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  @media (max-width: 720px) {
    .wordmark { font-size: 17px; padding: 11px 18px 10px; }
  }

  /* ---------- filters bar ---------- */
  .filters {
    border-bottom: 1px solid var(--rule);
    padding: 14px 0;
  }

  .filter-row {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    align-items: center;
    padding: 4px 0;
  }
  /* Le tiroir des filtres secondaires : replié par défaut, il libère
     ~120 px avant le premier événement. */
  .filter-drawer {
    border-top: 1px dashed var(--rule);
    margin-top: 8px;
    padding-top: 6px;
  }
  .filter-drawer[hidden] { display: none; }
  .filter-drawer .filter-row + .filter-row {
    border-top: 1px dashed var(--rule);
    padding-top: 10px;
    margin-top: 6px;
  }
  /* Rangée principale. Ordre du DOM : recherche, bouton du tiroir, chips
     de temps — ainsi l'ordre de tabulation suit l'ordre visuel. Sur
     téléphone la recherche et le bouton partagent la première ligne et
     les chips occupent la seconde ; le bouton ne se retrouve plus seul
     sur sa propre ligne, décalé du reste. */
  .filter-row.primary {
    gap: 8px 6px;
    align-items: center;
  }
  .filter-row.primary .filter-search-wrap { flex: 1 1 220px; }
  .filter-row.primary .filter-group { flex: 1 1 auto; }
  @media (max-width: 720px) {
    .filter-row.primary .filter-group { flex: 1 0 100%; }
  }
  .drawer-toggle { border-style: dashed; flex: 0 0 auto; }
  .drawer-toggle[aria-expanded="true"] {
    border-style: solid;
    border-color: var(--warm);
    color: var(--warm);
  }
  .filter-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: lowercase;
    letter-spacing: 0.06em;
    color: var(--ink-mute);
    flex: 0 0 auto;
    align-self: center;
    min-width: 64px;
  }
  .filter-label::before { content: "("; color: var(--ink-mute); }
  .filter-label::after { content: ")"; color: var(--ink-mute); }

  .filter-group { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0; }

  /* chips */
  /* Search input in filter bar */
  .filter-search-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
  }
  .filter-search {
    width: 100%;
    box-sizing: border-box;
    background: transparent;
    border: 1px solid var(--rule-strong);
    color: var(--ink);
    padding: 6px 28px 6px 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    border-radius: var(--radius);
    outline: none;
    letter-spacing: 0.04em;
    transition: border-color 0.16s ease;
    -webkit-appearance: none;
  }
  .filter-search::placeholder { color: var(--ink-mute); }
  .filter-search:focus { border-color: var(--ink); }
  .filter-search-clear {
    position: absolute;
    right: 9px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-mute);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0;
    display: none;
  }
  .filter-search-clear:hover { color: var(--ink); }

  .chip {
    border: 1px solid var(--rule-strong);
    background: transparent;
    color: var(--ink-soft);
    padding: 5px 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.16s ease;
    text-transform: lowercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    line-height: 1.5;
  }
  .chip:hover {
    border-color: var(--ink);
    color: var(--ink);
  }
  .chip.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .chip.partial {
    border-color: var(--warm);
    color: var(--warm);
    background: transparent;
  }
  .chip-group {
    font-weight: 700;
    text-transform: lowercase;
  }
  .chip-group::after {
    content: "↘";
    margin-left: 6px;
    font-size: 10px;
    display: inline-block;
    transition: transform 0.18s ease;
    opacity: 0.6;
  }
  .venue-group.expanded .chip-group::after {
    transform: rotate(45deg);
    opacity: 1;
  }
  .chip-sub { font-size: 10px; padding: 4px 10px; font-weight: 400; }

  /* venue groups */
  .venue-groups {
    display: flex; flex-wrap: wrap; gap: 5px;
    flex: 1;
  }
  .venue-group { display: contents; }
  .venue-sublist {
    display: none;
    flex-wrap: wrap;
    gap: 4px;
    padding: 9px 12px;
    background: var(--bg-elev);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    width: 100%;
    margin: 4px 0 2px;
  }
  .venue-group.expanded .venue-sublist { display: flex; }

  /* date picker */
  .datepicker-wrap { position: relative; display: inline-block; }
  .datepicker {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 30;
    background: var(--bg-elev);
    border: 1px solid var(--ink-mute);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: 0 6px 32px rgba(0,0,0,0.5);
    min-width: 280px;
  }
  .datepicker.open { display: block; }
  .datepicker-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink);
  }
  .datepicker-nav {
    background: transparent;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
    width: 26px; height: 26px;
    cursor: pointer;
    color: var(--ink);
    font-size: 14px;
    line-height: 1;
    transition: all 0.14s ease;
  }
  .datepicker-nav:hover {
    border-color: var(--ink);
    background: var(--bg-elev-2);
  }
  .datepicker-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .datepicker-dow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    color: var(--ink-mute);
    text-align: center;
    padding: 4px 0;
    letter-spacing: 0.1em;
  }
  .datepicker-day {
    background: transparent;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink);
    padding: 6px 0;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .datepicker-day:hover:not(.disabled) {
    background: var(--bg-elev-2);
  }
  .datepicker-day.disabled { color: var(--ink-mute); cursor: not-allowed; opacity: 0.5; }
  .datepicker-day.muted { color: var(--ink-mute); }
  .datepicker-day.selected,
  .datepicker-day.range-start,
  .datepicker-day.range-end {
    background: var(--ink);
    color: var(--bg);
  }
  .datepicker-day.in-range {
    background: var(--bg-elev-2);
    color: var(--ink);
    border-radius: 0;
  }
  .datepicker-day.range-start { border-radius: var(--radius) 0 0 var(--radius); }
  .datepicker-day.range-end { border-radius: 0 var(--radius) var(--radius) 0; }
  .datepicker-day.range-start.range-end { border-radius: var(--radius); }
  .datepicker-day.today {
    box-shadow: inset 0 0 0 1px var(--warm);
  }
  .datepicker-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: lowercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    gap: 8px;
  }
  .datepicker-foot span { flex: 1; }
  .datepicker-foot button {
    background: transparent;
    border: none;
    color: var(--warm);
    font-family: inherit;
    font-size: inherit;
    text-transform: inherit;
    letter-spacing: inherit;
    cursor: pointer;
    padding: 0;
  }
  .datepicker-foot button:hover { text-decoration: underline; }

  .clear-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: lowercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
    margin-left: auto;
    transition: color 0.14s ease;
  }
  .clear-link:hover { color: var(--ink); }
  .clear-link::after {
    content: " →";
    color: var(--warm);
  }

  /* ---------- feed / day blocks ---------- */
  /* ---------- bandeau de jours ---------- */
  .daystrip-wrap {
    border-bottom: 1px solid var(--rule);
  }
  .daystrip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 0 12px;
    scrollbar-width: thin;
    scroll-snap-type: x proximity;
  }
  .day-pill {
    flex: 0 0 auto;
    min-width: 62px;
    text-align: center;
    cursor: pointer;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 6px 9px 5px;
    font-family: 'JetBrains Mono', monospace;
    scroll-snap-align: start;
    transition: border-color 0.14s ease, background 0.14s ease;
  }
  .day-pill:hover { border-color: var(--ink-soft); }
  .day-pill:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
  .day-pill .dp-dow {
    display: block;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-mute);
  }
  .day-pill .dp-num {
    display: block;
    font-size: 15px;
    line-height: 1.2;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .day-pill .dp-mon {
    font-style: normal;
    font-size: 8.5px;
    letter-spacing: 0.04em;
    color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
  }
  /* Le mois n'est affiché qu'aux changements de mois, mais sa place reste
     RÉSERVÉE partout : le contenu de la pastille est centré, donc le
     supprimer décalerait le numéro d'environ 5 px sur les pastilles sans
     mois. visibility:hidden garde tous les chiffres alignés. */
  .day-pill .dp-mon.muet { visibility: hidden; }
  .day-pill .dp-count {
    font-size: 9px;
    color: var(--warm);
    font-variant-numeric: tabular-nums;
  }
  .day-pill.empty { opacity: 0.38; cursor: default; }
  .day-pill.today {
    border-color: var(--warm);
    background: rgba(212, 165, 116, 0.09);
  }

  main.feed { padding: 34px 0 80px; }

  /* ---------- journées ----------
     La colonne de date de 200 px (soit 232 px des 1280 du conteneur pour
     afficher « 18/07 ») est remplacée par un bandeau fin sticky pleine
     largeur : les cartes récupèrent toute la largeur, et chaque journée
     s'ouvre sur un filet en dégradé qui la sépare nettement de la
     précédente. */
  .day {
    padding: 0 0 26px;
    scroll-margin-top: 8px;
    /* Le navigateur ne calcule la mise en page que des journées visibles.
       Sur ~700 cartes le gain est net, pour zéro changement visuel.
       contain-intrinsic-size donne une hauteur estimée afin que la barre
       de défilement reste juste avant le rendu réel. */
    content-visibility: auto;
    contain-intrinsic-size: auto 420px;
  }
  .day + .day { margin-top: 34px; }
  .day::before {
    content: '';
    display: block;
    height: 1px;
    background: linear-gradient(to right,
      rgba(231, 223, 190, 0.30),
      rgba(231, 223, 190, 0.30) 72%,
      rgba(231, 223, 190, 0.05));
  }

  .day-bar {
    position: sticky;
    top: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 0;
    margin-bottom: 14px;
    background: linear-gradient(to bottom, var(--bg) 72%, rgba(22, 31, 37, 0.9));
    font-family: 'JetBrains Mono', monospace;
  }
  .day-bar .db-date {
    background: var(--ink);
    color: var(--bg);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 5px 11px;
    border-radius: var(--radius);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .day-bar .db-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .day-bar .db-count {
    font-size: 9.5px;
    color: var(--ink-mute);
    letter-spacing: 0.14em;
    margin-left: auto;
    white-space: nowrap;
  }
  @media (max-width: 560px) {
    .day-bar { gap: 9px; }
    .day-bar .db-label { font-size: 9.5px; letter-spacing: 0.12em; }
  }

  /* ---------- event grid ---------- */
  /* .group-cards — la grille interne d'un groupe déplié — partage les
     pistes de .events dans TOUTES les règles qui suivent, et jamais par
     recopie : elle doit produire les mêmes colonnes que la grille qui
     l'entoure. Dupliquer ces valeurs les aurait laissées diverger au
     premier réglage. */
  .events, .group-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    grid-auto-rows: 160px;
    gap: 12px;
  }
  @media (min-width: 1100px) {
    .events, .group-cards {
      grid-template-columns: repeat(auto-fill, minmax(280px, calc(33.333% - 8px)));
    }
  }
  @media (max-width: 560px) {
    .events, .group-cards {
      grid-template-columns: 1fr;
      grid-auto-rows: auto;
    }
  }

  /* Inner layout uses GRID with explicit row tracks. This is much more
     predictable than flex + line-clamp inside a fixed-height container. */
  .event {
    display: grid;
    grid-template-rows: auto 1fr auto;
    row-gap: 6px;
    padding: 14px 18px 12px;
    border: 1px solid rgba(231, 223, 190, 0.20);
    border-radius: var(--radius);
    /* Fond légèrement surélevé par rapport à la page : sans lui, le bas
       de la carte — là où le visuel s'est éteint en fondu — se confondait
       exactement avec le fond. */
    background: var(--bg-elev);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.18s ease, background 0.18s ease;
    height: 100%;
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .event:hover {
    border-color: var(--warm);
    background: var(--bg-elev-2);
  }

  /* ---------- couche visuelle en fond de carte ----------
     Affiche réelle si disponible, motif de catégorie sinon — dans les
     deux cas la couche s'éteint en fondu vers ~55 % de la hauteur pour
     laisser le texte respirer. Le motif est TOUJOURS rendu en
     sous-couche : si l'affiche ne charge pas (hotlink bloqué, 404),
     onerror masque la photo et le motif réapparaît. */
  /* Le visuel occupe toute la hauteur de carte, ses deux bords adoucis :
     il monte de 0 à pleine force sur les 17 premiers pour cent, tient
     jusqu'aux 56 %, puis s'efface jusqu'au bord bas. Auparavant il
     s'éteignait à 60 % et la moitié basse de la carte restait nue.
     Le fondu du haut a un effet secondaire utile : la texture s'efface
     juste derrière la ligne du lieu, qui s'en détache mieux. */
  .visual-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom,
        transparent 0%, rgba(0,0,0,.62) 7%, rgba(0,0,0,1) 17%,
        rgba(0,0,0,1) 56%, rgba(0,0,0,.60) 78%, rgba(0,0,0,.20) 92%, transparent 100%);
    mask-image: linear-gradient(to bottom,
        transparent 0%, rgba(0,0,0,.62) 7%, rgba(0,0,0,1) 17%,
        rgba(0,0,0,1) 56%, rgba(0,0,0,.60) 78%, rgba(0,0,0,.20) 92%, transparent 100%);
  }
  .visual-bg svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0.58;                 /* intensité validée sur maquette */
  }
  .visual-bg .photo-wrap { position: absolute; inset: 0; }
  .visual-bg img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 22%;
    /* Assombrissement de l'affiche. Depuis que le visuel remplit la carte,
       le titre passe devant l'image au lieu de la zone nue d'avant, et les
       affiches claires le rendaient illisible. Le filtre porte sur la
       balise image seule : les motifs de secours, dessinés dans trois
       teintes connues à 58 % d'opacité, sont déjà sourds et n'en ont pas
       besoin. Le léger gain de contraste compense l'affadissement que
       produit toujours une baisse de luminosité. */
    filter: brightness(0.60) contrast(1.06);
  }
  /* Trame sérigraphie : une grille de points sombres par-dessus l'affiche.
     C'est elle qui unifie des visuels très hétérogènes (portraits, photos
     de salle, visuels graphiques) sans en écraser les couleurs.
     Densifiée en second recours de lisibilité, après l'assombrissement de
     l'image : points portés de 42 à 50 % du rayon et de 60 à 88 %
     d'opacité, pas resserré de 3,4 à 3,1 px, plus un voile résiduel de
     10 % entre les points. Elle assombrit donc l'affiche dans le langage
     du site plutôt qu'avec un calque neutre — l'image garde ses couleurs
     et gagne du grain. Contrepartie : les visuels fins et les visages y
     perdent du détail. */
  .visual-bg .photo-wrap::after {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle,
        rgba(22,31,37,.88) 50%, rgba(22,31,37,.10) 56%);
    background-size: 3.1px 3.1px;
  }
  /* voile sombre dégressif : la ligne lieu·arr·heure doit gagner sur
     les affiches claires */
  .visual-bg .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom,
        rgba(22,31,37,.6) 0%, rgba(22,31,37,.26) 38%, rgba(22,31,37,.04) 60%);
  }
  /* le contenu passe au-dessus de la couche visuelle */
  .event-head, .event-title, .event-foot { position: relative; }
  .event-venue, .event-arr, .event-time {
    text-shadow: 0 1px 6px rgba(22,31,37,.95);
  }
  .event-title { text-shadow: 0 1px 8px rgba(22,31,37,.8); }

  /* Row 1: header (venue + time) — using inline-block layout instead of flex
     to avoid baseline-alignment height bugs in grid cells */
  .event-head {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;       /* center, not baseline — baseline causes height calc bugs */
    gap: 12px;
    min-width: 0;
    line-height: 1.25;
    /* Force a stable, predictable height regardless of flex quirks */
    height: 18px;
    flex: 0 0 auto;
  }
  .event-venue {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 700;
    line-height: 1.25;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* micro-étiquette encadrée, posée sur l'affiche */
  .event-arr {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    color: var(--ink-soft);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 400;
    flex-shrink: 0;
    white-space: nowrap;
    border: 1px solid rgba(231, 223, 190, 0.32);
    border-radius: 2px;
    padding: 1px 5px;
    background: rgba(22, 31, 37, 0.45);
  }
  .event-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--warm);
    font-weight: 700;
    white-space: nowrap;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .event-time.empty {
    color: var(--ink-mute);
    font-weight: 400;
  }

  /* Row 2: title fills available space, vertically centered.
     Bricolage Grotesque en variable, poids 300 — validé sur maquette.
     line-clamp propre avec ellipsis, au lieu de la coupe nette que
     produisait max-height. */
  .event-title {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    /* La graisse doit être portée par les DEUX propriétés : sur une police
       variable, font-variation-settings l'emporte sur font-weight, et ne
       changer que la seconde n'aurait aucun effet visible.
       opsz suit le corps rendu, c'est le rôle de cet axe — le laisser à 16
       pour un texte composé à 21 px appliquerait la compensation optique
       d'un corps plus petit, donc des pleins trop appuyés. */
    font-variation-settings: 'opsz' 20, 'wght' 400;
    font-weight: 400;
    font-size: 21px;
    line-height: 1.19;
    margin: 0;
    letter-spacing: -0.006em;
    color: var(--ink);
    text-wrap: balance;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
    align-self: center;
  }
  .event-title.placeholder {
    color: var(--ink-mute);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    font-style: normal;
    letter-spacing: 0.06em;
  }

  /* Row 3: footer.
     flex-end plutôt que space-between : la catégorie est masquée quand elle
     est vide (:empty ci-dessous), et space-between recollait alors le groupe
     source + durée à GAUCHE — d'où des cartes dont le bas ne s'alignait pas
     sur les autres. Avec flex-end le groupe de droite est ancré à droite en
     toutes circonstances, et la catégorie, quand elle existe, est repoussée
     à gauche par son margin-right auto. */
  .event-foot {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    /* Indispensable pour que l'ellipse de .event-cat se déclenche : en tant
       qu'élément de grille, ce pied a un min-width:auto qui l'empêche de
       descendre sous sa largeur min-content. Comme la catégorie est en
       nowrap, cette min-content vaut son texte entier — le pied débordait
       donc de la carte au lieu de tronquer (« Art contemporain et
       numérique » à La Salle de bains, 385 px dans une piste de 354). */
    min-width: 0;
    /* L'ancrage en bas de carte vient d'ici : la rangée est le 3e track du
       grid .event (auto 1fr auto), align-self end la colle au padding bas. */
    align-self: end;
  }
  .event-cat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ink-soft);
    text-transform: lowercase;
    letter-spacing: 0.1em;
    /* Repousse le groupe source + durée contre le bord droit. */
    margin-right: auto;
    /* Le pied doit tenir sur UNE ligne : certains libellés du Petit
       Bulletin sont très longs (« atelier · musique · cinéma · exposition
       · rencontre · arts visuels ») et passaient sur deux lignes, ce qui
       doublait la hauteur de la rangée et laissait les badges flotter au
       milieu au lieu d'être collés en bas. Tronqué plutôt que replié. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .event-cat:empty { display: none; }
  .event-cat::before {
    content: "[ ";
    color: var(--ink-mute);
  }
  .event-cat::after {
    content: " ]";
    color: var(--ink-mute);
  }
  .event-cat:empty::before, .event-cat:empty::after { display: none; }
  /* Boîte commune aux deux étiquettes du pied. Sans elle, leurs réglages
     divergents donnaient deux cadres de hauteurs différentes : la durée en
     9 px avec une bordure faisait 19,5 px, la source en 8 px sans bordure
     13,5. Hauteur fixe et centrage en flex rendent le cadre indépendant du
     corps de texte ; le filet transparent hérité par la source compense la
     bordure de la durée, pour que les deux boîtes extérieures coïncident.
     Cette règle doit précéder les deux suivantes, qui la surchargent. */
  .event-run,
  .event-source {
    display: inline-flex;
    align-items: center;
    box-sizing: border-box;
    height: 18px;
    padding: 0 8px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
  }
  .event-run {
    font-size: 9px;
    color: var(--hot);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-color: var(--hot-line);
    font-weight: 500;
  }
  .event-foot-right {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    /* Jamais comprimé par une catégorie longue : c'est elle qui se tronque. */
    flex-shrink: 0;
  }
  .event-source {
    font-size: 8px;
    text-transform: lowercase;
    letter-spacing: 0.08em;
    font-weight: 400;
  }
  .event-source.pb {
    color: #5a7042;
    background: rgba(90, 112, 66, 0.10);
  }
  .event-source.vm {
    color: #8a5530;
    background: rgba(138, 85, 48, 0.10);
  }

  /* ---------- carte groupée : plusieurs événements, même lieu, même jour ----------
     Elle occupe exactement la même case que les autres (160 px, cf.
     .events grid-auto-rows) et se déplie au clic en une carte par
     événement. Le regroupement se fait au RENDU et après filtrage : une
     grappe peut mêler des catégories, grouper avant filtrerait de travers. */
  button.event {
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    /* Le bouton natif impose ses propres marges et fond, que la règle
       .event ne couvre pas toutes. */
    margin: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  button.event:focus-visible {
    outline: 2px solid var(--ink-soft);
    outline-offset: 2px;
  }
  /* Compteur d'événements : occupe la place de l'heure d'une carte simple,
     donc rien de nouveau à apprendre pour l'œil, mais en crème plutôt
     qu'en tan pour ne pas se faire passer pour un horaire. */
  .event-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink);
    font-weight: 500;
    white-space: nowrap;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .event-list {
    display: grid;
    row-gap: 3px;
    align-self: center;
    min-height: 0;
  }
  .event-line {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    /* Rangée verrouillée à 18 px. Deux pièges sinon : sans line-height
       explicite chaque corps de texte impose le sien, et avec un
       align-items:baseline le décalage de ligne de base entre le titre en
       14 px et l'horaire en 10,5 px ajoutait 2 px par rangée — quatre
       lignes réclamaient alors 89 px pour une piste de 83,6, ce qui
       poussait le pied hors de la carte. */
    line-height: 18px;
  }
  .event-line .t {
    font-size: 14px;
    font-weight: 300;
    color: var(--ink);
    line-height: inherit;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .event-line .t.more { color: var(--ink-mute); }
  .event-line .h {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--hot);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    line-height: inherit;
  }
  /* Bloc d'un groupe déplié : les cartes ouvertes et leur bouton de repli,
     cerclés d'un filet corail.
     Il occupe des RANGÉES ENTIÈRES (grid-column 1/-1), sans quoi le cadre
     serait impossible : on ne peut pas encadrer un sous-ensemble
     d'éléments de grille susceptible de déborder sur deux rangées.
     Conséquence assumée : le groupe démarre sur une nouvelle ligne et
     laisse un vide derrière lui si la rangée précédente n'était pas
     pleine — ce vide marque d'ailleurs qu'un dépliage a eu lieu.
     Le filet est un OUTLINE et non une bordure : il ne prend aucune place
     dans la mise en page et se dessine dans la gouttière, si bien que les
     colonnes du bloc restent alignées au pixel près sur celles de la
     grille autour. Une bordure, avec son remplissage, aurait rétréci les
     cartes contenues par rapport aux autres.
     Le corail plutôt qu'une teinte de motif : il sert déjà aux heures et
     aux badges, donc il se lit comme un signal d'interface — et il reste
     constant, là où une teinte de motif se confondrait avec le fond d'un
     groupe dont le motif est justement orange. */
  /* Le corps d'une journée empile des conteneurs : .events pour les cartes
     ordinaires, .group-block pour un groupe déplié. Le bloc est un FRÈRE
     de .events et non un élément à l'intérieur — placé dans la grille, il
     aurait été enfermé dans une rangée de 160 px (grid-auto-rows) et son
     contenu, qui occupe deux rangées dès quatre cartes, aurait débordé.
     Un grid-row:span aurait dépendu du nombre de colonnes, donc du
     viewport ; en sortir le bloc règle le cas par construction. */
  .day-body {
    display: grid;
    gap: 12px;
  }
  /* Le bloc est une pile verticale : la grille des cartes ouvertes, puis
     la barre de repli. Le filet est une BORDURE et non un outline décalé.
     L'outline avait l'avantage de ne prendre aucune place, donc de garder
     les colonnes du bloc rigoureusement alignées sur celles d'à côté —
     mais il se dessinait à 7 px À L'EXTÉRIEUR du bloc, lequel occupe
     toute la largeur de la journée. Or .day porte content-visibility:auto,
     qui implique une containment de peinture : tout ce qui déborde de la
     boîte de la journée est rogné. Les montants gauche et droit étaient
     donc invisibles, seuls le haut et le bas passaient.
     La bordure reste à l'intérieur et se ferme sur les quatre côtés. Elle
     coûte 18 px de largeur utile, soit environ 6 px par colonne sur trois
     colonnes : les cartes encadrées sont très légèrement plus étroites
     que les autres, ce qui se lit comme un encart plutôt que comme un
     défaut d'alignement. */
  .group-block {
    display: grid;
    gap: 10px;
    border: 1px solid var(--hot);
    border-radius: var(--radius);
    padding: 8px;
    margin: 6px 0;
  }

  /* Bouton de repli : une barre pleine largeur au pied du bloc. Il était
     auparavant une case de la grille des cartes, donc haut de 160 px —
     un grand rectangle vide dès que le nombre de cartes ne remplissait
     pas sa dernière rangée. Sorti de cette grille, il reprend la hauteur
     d'un vrai contrôle. Teinté de corail comme le filet du bloc, pour
     qu'on lise les deux comme un même objet. */
  .collapse-card {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 40px;
    background: rgba(224, 141, 112, 0.07);
    border: 0;
    border-radius: var(--radius);
    color: var(--ink-soft);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .collapse-card:hover {
    color: var(--ink);
    background: rgba(224, 141, 112, 0.14);
  }
  .collapse-card:focus-visible {
    outline: 2px solid var(--ink-soft);
    outline-offset: 2px;
  }

  /* Subtitle removed from main grid layout — too noisy in compact cards.
     Keep style for if we re-enable later. */
  .event-subtitle {
    display: none;
  }

  /* ---------- empty state ---------- */
  .empty-state {
    text-align: center;
    padding: 100px 24px;
    color: var(--ink-soft);
  }
  .empty-state p {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-variation-settings: 'opsz' 32, 'wght' 300;
    font-size: 30px;
    color: var(--ink);
  }
  .empty-state p::before { content: "( "; color: var(--ink-mute); }
  .empty-state p::after { content: " )"; color: var(--ink-mute); }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--rule);
    padding: 32px 0 48px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  footer .container {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: end;
  }
  footer .col { line-height: 1.7; }
  footer .col-right { text-align: right; }
  footer a { color: var(--ink-soft); text-decoration: none; }
  footer a:hover { color: var(--ink); }
  footer .ind {
    color: var(--warm);
    margin-right: 4px;
  }

  /* ---------- mobile ---------- */
  /* Durée du fondu au changement de filtre ; neutralisé plus bas si
     l'utilisateur demande moins d'animations. */
  ::view-transition-old(root), ::view-transition-new(root) {
    animation-duration: 0.26s;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  @media (max-width: 720px) {
    .filter-row { gap: 6px 10px; }
    .filter-label { flex: 0 0 100%; margin-bottom: 4px; min-width: 0; }

    /* Mobile cards: switch from fixed-height grid cells to content-sized flex stack.
       Avoids overlap when title is long, and removes the "empty middle" feel. */
    .events, .group-cards, .day-body {
      grid-auto-rows: auto;
      gap: 10px;
    }
    .event {
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: auto;
      min-height: 0;
      padding: 12px 16px 11px;
    }
    .event-head {
      height: auto;
    }
    .event-venue {
      font-size: 11px;
      letter-spacing: 0.12em;
    }
    .event-time {
      font-size: 10px;
    }
    /* En mobile la carte est une pile flex verticale, où align-self joue sur
       l'axe HORIZONTAL : le centrage prévu pour la grille y rétrécirait la
       liste à la largeur de son texte. */
    .event-list {
      align-self: stretch;
    }
    /* Le bouton de repli n'a plus de rangée fixe à respecter : il redevient
       un simple bandeau, au lieu d'une case fantôme de 160 px. */
    .collapse-card {
      min-height: 44px;
      padding: 10px;
    }
    .event-title {
      /* Aligné sur le corps de bureau. Laissé à 17 px, le titre serait
         devenu plus PETIT sur mobile que sur grand écran — l'inverse du
         rapport d'origine, où le mobile était d'un demi-point au-dessus.
         Ici la carte est en hauteur libre, le corps ne contraint rien. */
      font-size: 21px;
      line-height: 1.18;
      max-height: none;
      align-self: stretch;
      margin-top: 2px;
    }
    .event-title.placeholder {
      font-size: 10px;
    }
    .event-foot {
      align-self: stretch;
      margin-top: 2px;
    }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="container">
    <h1 class="wordmark"><span class="ast">*</span>nocturne</h1>
  </div>
</header>

<nav class="filters" id="filters">
  <div class="container">

    <!-- Rangée toujours visible : recherche + temps + bouton du tiroir.
         Les filtres secondaires (où / arr. / type) sont repliés par
         défaut — ils occupaient trois rangées avant même le premier
         événement. -->
    <div class="filter-row primary">
      <div class="filter-search-wrap">
        <input class="filter-search" id="filterSearch" type="search"
          placeholder="lieu, artiste ou événement" autocomplete="off" spellcheck="false">
        <button class="filter-search-clear" id="filterSearchClear" aria-label="effacer">✕</button>
      </div>
      <button class="chip drawer-toggle" id="drawerToggle" type="button"
              aria-expanded="false" aria-controls="filterDrawer">+ filtres</button>
      <div class="filter-group" id="filterWhen">
        <button class="chip active" data-when="all">tout</button>
        <button class="chip" data-when="weekend">ce weekend</button>
        <button class="chip" data-when="nextweek">semaine pro</button>
        <span class="datepicker-wrap">
          <button class="chip" id="dateBtn" type="button">date →</button>
          <div class="datepicker" id="datepicker"></div>
        </span>
      </div>
    </div>

    <div class="filter-drawer" id="filterDrawer" hidden>
      <div class="filter-row">
        <span class="filter-label">où</span>
        <div class="filter-group venue-groups" id="filterVenue"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">arr.</span>
        <div class="filter-group" id="filterArr"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">type</span>
        <div class="filter-group" id="filterCategory"></div>
        <button class="clear-link" id="clearFilters">tout effacer</button>
      </div>
    </div>

  </div>
</nav>

<!-- Bandeau de jours : les 14 prochaines dates avec leur nombre
     d'événements, cliquables pour y sauter. « Qu'est-ce qu'il y a ce
     soir » est la question centrale du site. -->
<nav class="daystrip-wrap">
  <div class="container">
    <div class="daystrip" id="daystrip"></div>
  </div>
</nav>

<main class="feed">
  <div class="container" id="feed"></div>
</main>

<footer>
  <div class="container">
    <div class="col">
      <div><span class="ind">§</span> données scrapées sur les sites des lieux</div>
      <div><span class="ind">§</span> <span id="footerIndex">—</span> événements ·
           <span id="footerVenues">—</span> lieux · 17 sources</div>
      <div><span class="ind">§</span> dernière mise à jour <span id="lastUpdated">—</span></div>
    </div>
    <div class="col col-right">
      <div><a href="https://github.com/Ricojrlyon/nocturne-lyon" target="_blank" rel="noopener">code source ↗</a></div>
      <div>lyon · mmxxvi</div>
    </div>
  </div>
</footer>

<script>
const FR_DAYS_FULL = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const FR_DAYS_SHORT = ['dim','lun','mar','mer','jeu','ven','sam'];
const FR_MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* ---------- venue groups ---------- */
const VENUE_GROUPS = [
  { name: 'spectacles & musiques', venues: ['La Halle Tony Garnier', 'Bourse du Travail', 'Radiant-Bellevue', "Agend'arts", 'Big White', 'LDLC Arena'] },
  { name: 'soirée',                venues: ['Le Sucre', 'Le Petit Salon', 'Le Transbordeur', 'La Rayonne', 'La Marquise'] },
  { name: 'concerts',              venues: ['Marché Gare', 'Le Sonic', 'Le Périscope', 'Toï Toï le Zinc', "L'Épicerie Moderne", "A Thou Bout d'Chant", "Bar Rock'n Eat"] },
  { name: 'lieux hybrides',        venues: ['La Commune', 'HEAT', 'Les Subsistances', 'Grrrnd Zero', 'Boskop', "Maison de l'écologie"] },
  /* Comédie Odéon retirée : la politique théâtres (voir aggregate.py)
     exclut ce lieu, son chip restait grisé en permanence. Son entrée
     dans VENUE_ARRONDISSEMENT est conservée — inoffensive, et utile si
     un événement y remonte un jour via un agrégateur. */
  { name: 'théâtre & danse',       venues: ['Opéra national de Lyon', 'TNG', 'Maison de la Danse', 'Improvidence'] },
  { name: 'classique',             venues: ['Auditorium de Lyon', 'Chapelle de la Trinité', 'Salle Molière'] },
  /* 'musées & galeries' is dynamically populated by inferGroupForVenue
     (anything containing musée / galerie / institut). */
  { name: 'musées & galeries',     venues: [], dynamic: true },
  /* 'autre' is dynamically populated at runtime with venues that appear
     in events but aren't listed in any group above (e.g. from aggregators).
     Note: many venues do have arrondissement mappings in VENUE_ARRONDISSEMENT
     for the arr. filter and card label, but intentionally stay in 'autre'
     for the venue group filter (e.g. La Salle de Bains, Café Nanoum,
     Kraspek Myzik, Boulangerie du Prado, etc.). */
  { name: 'autre',                 venues: [], dynamic: true },
];

/* ---------- type buckets ---------- */
const TYPE_BUCKETS = [
  // Music sub-genres FIRST (order matters: first regex match wins).
  // The previous single "musique" bucket was too broad; with aggregators
  // bringing in 100+ events per scrape, having sub-genres is essential.
  { key: 'club',        label: 'club',        match: /\belectro|techno|house|trance|drum.?n.?bass|\bdnb\b|\bdj\b|soir[ée]e|club\b|after/i },
  { key: 'jazz',        label: 'jazz',        match: /\bjazz|\bblues|\bswing\b|\bimpro\b/i },
  { key: 'rock',        label: 'rock & pop',  match: /\brock\b|\bpop\b|m[ée]tal|punk\b|indie|garage\b|hardcore/i },
  // 'rap' BEFORE 'chanson' so "Hip Hop / Rap" doesn't get caught by chanson's
  // \brap\b leftover (which has now been removed). Trap is rare but distinct.
  { key: 'rap',         label: 'rap',         match: /\brap\b|hip[\s-]?hop|\btrap\b|\brnb\b|\br&b\b/i },
  { key: 'chanson',     label: 'chanson',     match: /chanson|\bfolk\b|country|francophone|slam\b|po[ée]sie/i },
  // 'reggae' BEFORE 'monde' since reggae sometimes gets bundled under 'world music'.
  { key: 'reggae',      label: 'reggae',      match: /reggae|\bdub\b|\bska\b|dancehall|rocksteady/i },
  { key: 'classique',   label: 'classique',   match: /classique|symphon|op[ée]ra|musique\s*sacr|musique\s*de\s*chambre|baroque/i },
  { key: 'monde',       label: 'monde',       match: /sono\s*mondiale|fado|musique\s*du\s*monde|\bworld\b|tradition|flamenco|tango|fanfare/i },
  // 'atelier' BEFORE the 'musique' catch-all so "Atelier de musique" goes to
  // atelier rather than musique.
  { key: 'atelier',     label: 'atelier',     match: /atelier|workshop|stage\s+de|masterclass|formation/i },
  // Generic music catch-all (for events tagged just "concert" or "musique"
  // without specifying a subgenre). Comes AFTER the specific genres.
  { key: 'musique',     label: 'musique',     match: /musique|concert/i },
  // Non-music. humour BEFORE theatre because "Humour & Café Théâtre" must
  // go to humour (theatre regex would match the "Théâtre" substring).
  // Note: 'théâtre' has circumflex â, so the regex uses [aâ]tre to match
  // both "theatre" (no accent) and "théâtre" (with accent) variants.
  { key: 'humour',      label: 'humour',      match: /humour|stand[\s-]?up|one[\s-]?man|comedy|caf[ée][\s-]*th[ée][aâ]tre/i },
  { key: 'theatre',     label: 'théâtre',     match: /th[ée][aâ]tre|spectacle\s*musical|com[ée]die\s*musicale|cabaret/i },
  { key: 'danse',       label: 'danse',       match: /danse|ballet|cho[ré]graph/i },
  { key: 'expo',        label: 'expo',        match: /\bexpo|exposition|vernissage|installation/i },
  { key: 'cine',        label: 'ciné',        match: /cin[ée]ma|projection|s[ée]ance|documentaire|court[\s-]?m[ée]trage/i },
  { key: 'conference',  label: 'conférence',  match: /conf[ée]rence|rencontre|d[ée]bat|table\s*ronde|discussion|colloque|lecture/i },
];
function bucketOf(rawCategory) {
  if (!rawCategory) return 'autre';
  for (const b of TYPE_BUCKETS) {
    if (b.match.test(rawCategory)) return b.key;
  }
  return 'autre';
}
const ALL_BUCKETS = [...TYPE_BUCKETS, { key: 'autre', label: 'autre' }];

/* ---------- visuel de carte : motifs de secours ----------
   Motif tiré par événement, quand aucune affiche n'est disponible. Plus de
   « un motif ou une couleur = un type d'événement » : deux soirées club
   voisines ne se ressemblent pas. Le tirage est déterministe (hash de
   lieu + titre) : une carte garde son apparence d'un rendu à l'autre —
   sinon les motifs changeraient à chaque frappe dans la recherche — et
   d'un jour à l'autre. Seul le hasard ENTRE événements est recherché. */

/* Trois motifs, chacun un bloc FIGÉ : une trame de points, une loi de
   rayon, un jeu d'anneaux, une teinte. Rien n'est partagé entre eux et
   rien n'est tiré séparément — c'est le bloc entier qui est choisi par
   hash, sinon deux cartes de même trame n'avaient ni les mêmes anneaux
   ni la même couleur.

   Les pas sont en PIXELS et non en unités de viewBox : voir patternSVG,
   la couche de points est rendue sans viewBox pour que le pas déclaré
   soit le pas obtenu quelle que soit la largeur de carte. */
const MOTIFS = [
  {
    id: 'alignes',
    // Tuile 120 px = 32 pas de 3,75. Plus la tuile est grande, plus les
    // raccords sont espacés — la trame se répète, forcément.
    trame: { w: 120, h: 120, dx: 3.75, dy: 3.75, stagger: 'none' },
    // u est uniforme sur [0,1[. Exposant > 1 = beaucoup de points fins,
    // quelques gros seulement.
    rayon: u => 0.76 + Math.pow(u, 1.7) * 0.77,
    hue: 'var(--motif-vert)',
    formes: rubans,
  },
  {
    id: 'lignes',
    // 3,6 px entre points d'une ligne, 4,5 px entre deux lignes. La
    // hauteur 90 vaut 20 × 4,5, multiple PAIR : les rangées étant
    // décalées d'un demi-pas, une tuile impaire laisserait une ligne de
    // rupture visible au raccord.
    trame: { w: 108, h: 90, dx: 3.6, dy: 4.5, stagger: 'row' },
    rayon: u => 0.74 + Math.pow(u, 1.5) * 0.61,
    hue: 'var(--motif-rose)',
    formes: gouttes,
  },
  {
    id: 'colonnes',
    // Largeur 90 = 20 × 4,5, PAIR pour la même raison, colonnes décalées.
    trame: { w: 90, h: 108, dx: 4.5, dy: 3.6, stagger: 'col' },
    rayon: u => 0.71 + Math.pow(u, 1.9) * 0.76,
    hue: 'var(--motif-orange)',
    formes: eventail,
  },
];

/* ---------- formes du motif ----------
   Chaque motif superpose à sa trame de points un dessin qui lui est
   propre. Ces dessins sont IDENTIQUES pour toutes les cartes d'un même
   motif : ils vivent donc dans les defs partagés et chaque carte n'en
   porte qu'un <use> (voir ensureMotifDefs et patternSVG). C'est ce qui
   permet des tracés de plusieurs milliers de points sans que le coût
   dépende du nombre de cartes. */

/* Rose — ondes concentriques d'une goutte tombée dans l'eau. Six points
   d'impact ; ce qui fait lire la goutte plutôt qu'un cercle décoratif,
   c'est la RÉGULARITÉ de l'écart entre anneaux, et leur amincissement
   régulier vers l'extérieur. cx, cy, premier rayon, écart, nombre. */
const IMPACTS = [
  [58, 26, 5, 7.5, 10], [196, 54, 5, 8, 11], [292, 18, 6, 9, 9],
  [124, 118, 5, 7.5, 9], [16, 96, 7, 9.5, 8],
  // Sixième impact en bas à droite : il tombe sous le fondu du masque,
  // il est donc volontairement discret.
  [286, 130, 5, 8, 10],
];

function gouttes(hue) {
  let s = '';
  for (const [cx, cy, r0, pas, n] of IMPACTS) {
    for (let k = 0; k < n; k++) {
      const o = 0.80 - k * 0.075;
      if (o < 0.10) continue;
      const w = Math.max(0.5, 1.5 - k * 0.11);
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r0 + k * pas).toFixed(1)
         + '" fill="none" stroke="' + hue + '" stroke-width="' + w.toFixed(2)
         + '" opacity="' + o.toFixed(2) + '"/>';
    }
  }
  return s;
}

/* Vert — ruban vrillé, façon forme d'onde en volume.
     y(x, v) = base + A(x)·sin(φ) + v·h·cos(φ)
   Le premier terme donne la vague, le second fait tourner la SECTION du
   ruban le long de la courbe : les brins se resserrent là où la surface
   se présente de profil (cos ≈ 0) et s'écartent quand elle nous fait
   face. C'est ce contraste de densité qui donne le relief, il n'y a
   aucune ombre. v parcourt -1 à 1 d'un bord à l'autre du ruban. */
function ruban(hue, o) {
  let s = '';
  for (let i = 0; i < o.n; i++) {
    const v = (i / (o.n - 1)) * 2 - 1;
    let d = '';
    for (let x = -12; x <= 334; x += 4) {
      const ph = x / o.lam * Math.PI * 2 + o.phase;
      const amp = o.A * (0.55 + 0.45 * Math.sin(x / o.env * Math.PI * 2 + 0.6));
      const y = o.base + amp * Math.sin(ph) + v * o.h * Math.cos(ph);
      d += (x < -11 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(2);
    }
    // Les brins de bord sont plus pâles : le cœur du ruban reste le plus dense.
    s += '<path d="' + d + '" fill="none" stroke="' + hue + '" stroke-width="'
       + o.w + '" opacity="' + (o.o0 - Math.abs(v) * o.oFall).toFixed(3) + '"/>';
  }
  return s;
}

function rubans(hue) {
  return ruban(hue, { n: 18, A: 20, h: 12, lam: 150, env: 300, phase: 2.1,
                      base: 50,  w: 0.55, o0: 0.42, oFall: 0.20 })
       + ruban(hue, { n: 30, A: 28, h: 19, lam: 225, env: 360, phase: 0.3,
                      base: 86,  w: 0.5,  o0: 0.66, oFall: 0.30 })
       // Troisième ruban en opposition de phase : il croise les deux autres
       // au lieu de les accompagner. Posé bas, donc largement estompé par
       // le masque — il apporte de la profondeur, pas du dessin.
       + ruban(hue, { n: 22, A: 16, h: 13, lam: 185, env: 280, phase: 4.0,
                      base: 128, w: 0.5,  o0: 0.50, oFall: 0.24 });
}

/* Orange — éventail de hachures : l'angle pivote de 14° à gauche à 60° à
   droite. 145 traits, dont une douzaine seulement sont épais : l'exposant
   6,2 écrase la loi vers le bas, si bien que densifier n'ajoute que des
   traits fins. Sans ça, multiplier les traits aurait aussi multiplié les
   épais et empâté le motif. */
function eventail(hue) {
  const N = 145;
  let s = '';
  for (let i = 0; i < N; i++) {
    const x = (i / N) * 330 - 6;
    const y = 4 + alea01('ey' + i) * 118;
    const len = (70 + alea01('el' + i) * 90) * 0.85;
    const a = (14 + (x / 320) * 46) * Math.PI / 180;
    const w = 0.45 + Math.pow(alea01('ew' + i), 6.2) * 1.75;
    s += '<line x1="' + x.toFixed(1) + '" y1="' + y.toFixed(1)
       + '" x2="' + (x + len * Math.cos(a)).toFixed(1)
       + '" y2="' + (y + len * Math.sin(a)).toFixed(1)
       + '" stroke="' + hue + '" stroke-width="' + w.toFixed(2)
       + '" opacity="' + (0.74 - (i % 12) * 0.028).toFixed(2)
       + '" stroke-linecap="round"/>';
  }
  return s;
}

/* Hash stable (djb2-ish) : même chaîne → même entier, à chaque rendu et
   à chaque chargement. Sert aux tirages sans Math.random(), qui ferait
   changer les motifs à chaque re-render. */
function stableHash(s) {
  let h = 5381;
  for (let i = 0; i < (s || '').length; i++) {
    h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  }
  return h;
}

/* Mélange final 32 bits. stableHash seul ne suffit pas pour tirer les
   rayons : sur des coordonnées qui se suivent, ses bits bas restent
   corrélés et un simple modulo dessinait des séries de gros points en
   diagonale (autocorrélation mesurée entre voisins : 0,13 avant, 0,02
   après). alea01 rend une valeur continue plutôt que N paliers. */
function mix32(h) {
  h = (h ^ (h >>> 16)) >>> 0;
  h = Math.imul(h, 0x7feb352d) >>> 0;
  h = (h ^ (h >>> 15)) >>> 0;
  h = Math.imul(h, 0x846ca68b) >>> 0;
  h = (h ^ (h >>> 16)) >>> 0;
  return h;
}
function alea01(s) { return mix32(stableHash(s)) / 4294967296; }

/* Trames ET formes sont définies UNE fois pour tout le document, puis
   référencées par chaque carte : celle-ci coûte alors un <rect> plus un
   <use>, soit deux nœuds, au lieu des ~3 000 cercles qu'exigerait ce pas
   de trame et des ~2 500 points que réclament les rubans. Sans ce
   partage, ni la densité de la trame ni la complexité des formes ne
   seraient tenables sur un millier de cartes. */
let motifDefsReady = false;
function ensureMotifDefs() {
  if (motifDefsReady) return;
  const host = document.body || document.documentElement;
  if (!host) return;                     // appelé trop tôt : on réessaiera
  let defs = '';
  for (const m of MOTIFS) {
    const t = m.trame;
    let dots = '';
    for (let iy = 0; iy * t.dy < t.h - 0.001; iy++) {
      for (let ix = 0; ix * t.dx < t.w - 0.001; ix++) {
        let cx = ix * t.dx, cy = iy * t.dy;
        if (t.stagger === 'row' && iy % 2) cx += t.dx / 2;
        if (t.stagger === 'col' && ix % 2) cy += t.dy / 2;
        if (cx >= t.w - 0.001 || cy >= t.h - 0.001) continue;
        const r = m.rayon(alea01(m.id + ':' + ix + '/' + iy));
        dots += '<circle cx="' + cx.toFixed(2) + '" cy="' + cy.toFixed(2)
              + '" r="' + r.toFixed(2) + '" fill="' + m.hue + '"/>';
      }
    }
    defs += '<pattern id="motif-' + m.id + '" x="0" y="0" width="' + t.w
          + '" height="' + t.h + '" patternUnits="userSpaceOnUse">'
          + dots + '</pattern>'
          + '<g id="formes-' + m.id + '">' + m.formes(m.hue) + '</g>';
  }
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', '0');
  svg.setAttribute('height', '0');
  svg.setAttribute('aria-hidden', 'true');
  svg.style.position = 'absolute';
  svg.innerHTML = '<defs>' + defs + '</defs>';
  host.appendChild(svg);
  motifDefsReady = true;
}

/* Deux couches superposées, et c'est délibéré.
   La trame de points est rendue SANS viewBox : ses unités valent alors
   des pixels CSS, donc le pas à l'écran est exactement celui déclaré.
   Avec un viewBox 320×160 mis à l'échelle sur la carte, tout était
   multiplié par la largeur — mesuré de 0,99 à 2,43 selon le format, si
   bien que la trame était deux fois et demie plus lâche sur une carte
   pleine largeur en mobile que sur une carte de grille.
   Les formes gardent le viewBox : elles DOIVENT suivre la carte, sinon
   leur composition se décale selon la largeur. */
function patternSVG(seed) {
  ensureMotifDefs();
  // Le hash est brassé AVANT le modulo, et ce n'est pas décoratif : djb2
  // calcule h = 33·h + c, or 33 est divisible par 3. Le terme 33·h
  // disparaît donc modulo 3 et le reste dépend surtout du dernier
  // caractère de la graine — mesuré sur 26 400 graines, la répartition
  // tourne en cycle selon ce caractère (khi2 conditionnel de 47,6 contre
  // 2,2 après brassage). Sur des titres numérotés d'une même salle, les
  // motifs se succédaient en cycle régulier de période 3, exactement ce
  // que le tirage devait éviter.
  const m = MOTIFS[mix32(stableHash(seed)) % MOTIFS.length];
  return '<svg class="dots" aria-hidden="true">'
       + '<rect x="0" y="0" width="100%" height="100%" fill="url(#motif-'
       + m.id + ')" opacity="0.5"/></svg>'
       + '<svg class="rings" viewBox="0 0 320 160" '
       + 'preserveAspectRatio="xMidYMid slice" aria-hidden="true">'
       + '<use href="#formes-' + m.id + '"/></svg>';
}

/* Couche visuelle d'une carte : motif toujours en sous-couche, affiche
   par-dessus si disponible (lazy). onerror masque la photo → le motif
   réapparaît si l'image est morte ou le hotlink bloqué. */
function visualLayerHtml(e, seedOverride) {
  // Graine des tirages : (lieu + titre) est stable d'un run à l'autre —
  // contrairement à e.id, qui dépend de l'heure et change si la dédup
  // l'enrichit depuis une autre source. Les occurrences d'un même
  // événement multi-jours partagent donc forme et couleur.
  // seedOverride sert aux cartes d'un groupe déplié : elles reçoivent la
  // graine de la CARTE GROUPÉE, donc le motif du lieu. Sans ça le
  // dépliage défaisait visuellement le groupe qu'il venait d'ouvrir —
  // quatre cartes d'un même lieu affichaient trois trames et trois
  // teintes différentes.
  const seed = seedOverride || ((e.venue || '') + '|' + (e.title || ''));
  let html = '<div class="visual-bg">' + patternSVG(seed);
  if (e.image && /^https?:\/\//.test(e.image)) {
    html += '<div class="photo-wrap">'
          + '<img src="' + escapeHtml(e.image) + '" alt="" loading="lazy" '
          + 'decoding="async" referrerpolicy="no-referrer" '
          + 'onerror="this.parentElement.style.display=\'none\'">'
          + '<div class="scrim"></div></div>';
  }
  html += '</div>';
  return html;
}

/* ---------- state ---------- */
const state = {
  when: 'all',
  customRange: null,
  venues: new Set(),
  arrondissements: new Set(),
  buckets: new Set(),
  search: '',          // free text search: venue name or event title
  events: [],
  occurrences: [],     // expandOccurrences(events), calculé une fois au load
  // Grappes (lieu, jour) dépliées, clés « AAAA-MM-JJ|Lieu ». Gardé en état
  // plutôt qu'en DOM : le feed est reconstruit à chaque filtre ou frappe,
  // une manipulation directe du DOM serait effacée. Les clés qui ne
  // correspondent plus à rien après un changement de filtre sont ignorées.
  expanded: new Set(),
};

/* Listes d'événements par journée, telles que triées au dernier rendu.
   Le dépliage ne reconstruit qu'une journée : il n'a donc ni à refiltrer
   ni à retrier, il lui suffit de relire la liste d'ici. */
const lastRenderDays = new Map();

function isoOf(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}
function parseIso(s) { return new Date(s + 'T00:00:00'); }

/* ---------- date picker ---------- */
let dpMonth = (() => { const d = new Date(); d.setDate(1); return d; })();
let dpRangeAnchor = null;

function renderDatepicker() {
  const dp = document.getElementById('datepicker');
  const ref = new Date(dpMonth);
  const year = ref.getFullYear();
  const month = ref.getMonth();
  const today = new Date(); today.setHours(0,0,0,0);

  const monthName = FR_MONTHS[month] + ' ' + year;
  const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const rangeStart = state.customRange ? parseIso(state.customRange.start) : null;
  const rangeEnd   = state.customRange ? parseIso(state.customRange.end)   : null;

  const cells = [];
  for (let i = firstWeekday; i > 0; i--) {
    const day = daysInPrevMonth - i + 1;
    const d = new Date(year, month - 1, day);
    cells.push({ d, muted: true, disabled: d < today });
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    cells.push({ d, muted: false, disabled: d < today });
  }
  while (cells.length % 7 !== 0) {
    const last = cells[cells.length - 1].d;
    const d = new Date(last); d.setDate(last.getDate() + 1);
    cells.push({ d, muted: true, disabled: false });
  }

  let html = '';
  html += '<div class="datepicker-head">';
  html += '  <button class="datepicker-nav" data-nav="prev" aria-label="mois précédent">‹</button>';
  html += '  <span>' + monthName + '</span>';
  html += '  <button class="datepicker-nav" data-nav="next" aria-label="mois suivant">›</button>';
  html += '</div>';
  html += '<div class="datepicker-grid">';
  for (const dow of ['lu','ma','me','je','ve','sa','di']) {
    html += '<div class="datepicker-dow">' + dow + '</div>';
  }
  for (const cell of cells) {
    const cls = ['datepicker-day'];
    if (cell.muted) cls.push('muted');
    if (cell.disabled) cls.push('disabled');
    if (cell.d.getTime() === today.getTime()) cls.push('today');
    if (rangeStart && rangeEnd) {
      const sameStart = cell.d.getTime() === rangeStart.getTime();
      const sameEnd = cell.d.getTime() === rangeEnd.getTime();
      if (sameStart) cls.push('range-start');
      if (sameEnd) cls.push('range-end');
      if (cell.d > rangeStart && cell.d < rangeEnd) cls.push('in-range');
      if (sameStart && sameEnd) cls.push('selected');
    } else if (dpRangeAnchor && cell.d.getTime() === dpRangeAnchor.getTime()) {
      cls.push('range-start');
    }
    const iso = isoOf(cell.d);
    const dis = cell.disabled ? 'disabled' : '';
    html += '<button class="' + cls.join(' ') + '" data-day="' + iso + '" ' + dis + '>'
          + cell.d.getDate() + '</button>';
  }
  html += '</div>';
  html += '<div class="datepicker-foot">';
  if (state.customRange) {
    const s = parseIso(state.customRange.start);
    const e = parseIso(state.customRange.end);
    if (state.customRange.start === state.customRange.end) {
      html += '<span>' + s.getDate() + ' ' + FR_MONTHS[s.getMonth()].slice(0,4) + '</span>';
    } else {
      html += '<span>' + s.getDate() + ' ' + FR_MONTHS[s.getMonth()].slice(0,4)
            + ' → ' + e.getDate() + ' ' + FR_MONTHS[e.getMonth()].slice(0,4) + '</span>';
    }
    html += '<button data-action="clear">effacer</button>';
  } else if (dpRangeAnchor) {
    html += '<span>début : ' + dpRangeAnchor.getDate() + ' '
          + FR_MONTHS[dpRangeAnchor.getMonth()].slice(0,4) + '</span>';
    html += '<button data-action="cancel">annuler</button>';
  } else {
    html += '<span>1 jour ou 2 clics</span>';
    html += '<button data-action="close">fermer</button>';
  }
  html += '</div>';

  dp.innerHTML = html;
}

function openDatepicker() {
  document.getElementById('datepicker').classList.add('open');
  dpRangeAnchor = null;
  renderDatepicker();
}
function closeDatepicker() {
  document.getElementById('datepicker').classList.remove('open');
  dpRangeAnchor = null;
}
function isDatepickerOpen() {
  return document.getElementById('datepicker').classList.contains('open');
}

document.getElementById('dateBtn').addEventListener('click', e => {
  e.stopPropagation();
  if (isDatepickerOpen()) closeDatepicker();
  else openDatepicker();
});

document.getElementById('datepicker').addEventListener('click', e => {
  e.stopPropagation();
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) {
    const dir = navBtn.dataset.nav === 'prev' ? -1 : 1;
    dpMonth = new Date(dpMonth.getFullYear(), dpMonth.getMonth() + dir, 1);
    renderDatepicker();
    return;
  }
  const dayBtn = e.target.closest('[data-day]:not([disabled])');
  if (dayBtn) {
    const isoStr = dayBtn.dataset.day;
    const d = parseIso(isoStr);
    if (!dpRangeAnchor) {
      dpRangeAnchor = d;
      renderDatepicker();
    } else {
      let start = dpRangeAnchor, end = d;
      if (end < start) { [start, end] = [end, start]; }
      state.customRange = { start: isoOf(start), end: isoOf(end) };
      state.when = 'custom';
      document.querySelectorAll('#filterWhen .chip[data-when]').forEach(c => c.classList.remove('active'));
      document.getElementById('dateBtn').classList.add('active');
      dpRangeAnchor = null;
      renderDatepicker();
      setTimeout(closeDatepicker, 250);
      render();
    }
    return;
  }
  const action = e.target.closest('[data-action]');
  if (action) {
    if (action.dataset.action === 'clear') {
      state.customRange = null;
      state.when = 'all';
      document.querySelectorAll('#filterWhen .chip[data-when]').forEach(c => c.classList.remove('active'));
      document.querySelector('#filterWhen .chip[data-when="all"]').classList.add('active');
      document.getElementById('dateBtn').classList.remove('active');
      renderDatepicker();
      render();
    } else if (action.dataset.action === 'cancel') {
      dpRangeAnchor = null;
      renderDatepicker();
    } else if (action.dataset.action === 'close') {
      closeDatepicker();
    }
  }
});

document.addEventListener('click', e => {
  if (!isDatepickerOpen()) return;
  if (e.target.closest('#dateBtn') || e.target.closest('#datepicker')) return;
  closeDatepicker();
});

/* ---------- main load ---------- */
async function load() {
  // Fetch events and auto-geocoded arrondissements in parallel.
  // venue_arrondissements.json is generated by aggregate.py (scrapers/geo.py).
  // It only contains venues NOT already in the hardcoded VENUE_ARRONDISSEMENT
  // map above. If the file is missing (first run, local dev), we silently
  // ignore it — the hardcoded map is still fully functional.
  const [eventsRes, geoRes] = await Promise.allSettled([
    fetch('events.json', { cache: 'no-store' }),
    fetch('venue_arrondissements.json', { cache: 'no-store' }),
  ]);

  if (eventsRes.status === 'rejected') throw eventsRes.reason;
  const data = await eventsRes.value.json();
  state.events = data.events || [];
  // Les occurrences ne dépendent que de state.events : calculées une seule
  // fois ici au lieu d'être recalculées à chaque render() (chaque frappe,
  // chaque clic de chip).
  state.occurrences = expandOccurrences(state.events);

  // Merge geocoded arrondissements into VENUE_ARRONDISSEMENT.
  // Hardcoded entries win on conflict (they've been manually verified).
  if (geoRes.status === 'fulfilled' && geoRes.value.ok) {
    try {
      const geo = await geoRes.value.json();
      for (const [venue, entry] of Object.entries(geo)) {
        if (VENUE_ARRONDISSEMENT[venue]) continue;  // hardcoded wins
        if (entry.arr) VENUE_ARRONDISSEMENT[venue] = entry.arr;
      }
    } catch (_) { /* malformed JSON — ignore */ }
  }

  buildVenueHomepages();

  // Chiffres et date de mise à jour : en pied de page, pas dans le
  // masthead — l'information est utile mais n'a pas à occuper le haut.
  document.getElementById('footerIndex').textContent = state.events.length;
  document.getElementById('footerVenues').textContent =
    new Set(state.events.map(e => e.venue)).size;
  document.getElementById('lastUpdated').textContent = formatUpdated(data.generated_at);

  buildVenueFilters();
  buildArrondissementFilters();
  buildTypeFilters();
  buildDaystrip();
  render();
}

/* ---------- bandeau de jours ----------
   Les 14 prochains jours ; ceux qui ont des événements affichent leur
   compte et défilent jusqu'à leur section, les autres restent grisés. */
function buildDaystrip() {
  const strip = document.getElementById('daystrip');
  if (!strip) return;
  strip.innerHTML = '';
  const counts = new Map();
  for (const occ of state.occurrences) {
    counts.set(occ._date, (counts.get(occ._date) || 0) + 1);
  }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  for (let i = 0; i < 14; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const iso = isoOf(d);
    const n = counts.get(iso) || 0;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'day-pill' + (n === 0 ? ' empty' : '') + (i === 0 ? ' today' : '');
    // Mois affiché uniquement au premier jour de chaque mois, et sur la
    // première pastille de la bande — sans elle, une fenêtre entièrement
    // contenue dans un mois n'indiquerait aucun mois du tout.
    const moisVisible = (i === 0 || d.getDate() === 1);
    btn.innerHTML = '<span class="dp-dow">' + FR_DAYS_SHORT[d.getDay()] + '</span>'
                  + '<span class="dp-num">' + d.getDate()
                  + '<i class="dp-mon' + (moisVisible ? '' : ' muet') + '">/'
                  + String(d.getMonth() + 1).padStart(2, '0')
                  + '</i></span>'
                  + '<span class="dp-count">' + (n ? n : '·') + '</span>';
    if (n) {
      btn.title = n + (n > 1 ? ' événements' : ' événement');
      btn.addEventListener('click', () => {
        const target = document.getElementById('day-' + iso);
        if (!target) return;
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      });
    } else {
      btn.disabled = true;
    }
    strip.appendChild(btn);
  }
}

/* ---------- tiroir des filtres secondaires ---------- */
